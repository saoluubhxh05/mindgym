":13,"muc_uu_tien":"A – cốt lõi","loai":"chuoi","nhom":"Chuỗi kinh tế – Cung-cầu vi mô","ten":"Giảm giá – tăng cầu","ten_goc":"Law of demand; độ co giãn quyết định mức tăng","neu":"Giảm giá","thi":"có thể hết hàng","chuoi":"Giảm giá → nhiều người mua → lượng cầu tăng → có thể hết hàng","vi_du":"Siêu thị giảm 30% → hàng hết sau 2 giờ.","gioi_han":"Mức tăng phụ thuộc độ co giãn; giảm sâu có thể bị nghi chất lượng (CH-KT-012).","tu_khoa":"Giảm giá, nhiều người mua, lượng cầu tăng, có thể hết hàng","chuoi_hoc":"Kinh tế: giá và thị trường","kieu_hoc":"chuoi","buoc":2,"truoc":"CH-KT-001","sau":"CH-KT-003","ct_nguon_goc":"Cùng thuộc quy luật cầu (Law of demand) của kinh tế học vi mô, được Marshall (1890) mô hình hoá. Trong marketing hiện đại, nó được vận dụng dưới dạng các chiến lược định giá thâm nhập (penetration pricing) hoặc khuyến mãi (sales promotion) để thao túng ngắn hạn hành vi người tiêu dùng, nhằm thanh lý hàng tồn hoặc giành thị phần.","ct_co_che":"Giảm giá kích hoạt cảm giác được món hời trong tâm lý người mua. Nó hạ thấp rào cản tài chính để dùng thử sản phẩm. Cơ chế hoạt động ngược lại với tăng giá: khách hàng chuyển từ đối thủ sang mua của bạn (hiệu ứng thay thế) và họ mua số lượng nhiều hơn mức bình thường vì cảm thấy tiền của mình có giá trị lớn hơn (hiệu ứng thu nhập). Sự khan hiếm thời gian của đợt giảm giá càng đẩy lượng cầu tăng vọt cục bộ.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Tính hiệu quả của việc giảm giá để tăng sản lượng bán ra là thực tế đã được chứng minh vững chắc trong kinh doanh bán lẻ và kinh tế học hành vi.","ct_quy_trinh":"Xác định mục tiêu: xả hàng tồn, tìm khách mới hay tối đa doanh thu || Tính toán biên lợi nhuận để tìm mức giảm giá an toàn, không lỗ vốn || Giới hạn thời gian hoặc số lượng rõ ràng để tạo áp lực khan hiếm || Đảm bảo hệ thống cung ứng (kho hàng, nhân sự) chịu được sự tăng vọt cục bộ của lượng cầu || Đo lường sau chiến dịch: bao nhiêu khách mới ở lại mua giá gốc","ct_vi_du_mau":"Tình huống: Một hãng thời trang nội địa có đợt hàng áo thun mùa hè bán rất chậm. Họ quyết định chạy chiến dịch giảm 50% chỉ trong 24 giờ. Mức giá giảm từ 300.000đ xuống 150.000đ. Nhờ giảm giá sâu, lượng đơn hàng tăng vọt gấp 10 lần ngày thường. Tuy nhiên, do không dự báo đúng độ co giãn của cầu, kho hàng hết sạch chỉ sau 4 tiếng. Khách hàng vào trang web sau đó thấy toàn báo hết hàng liền lên mạng xã hội phàn nàn là hãng lừa đảo. Kết quả: Dù bán hết hàng, thương hiệu bị tổn hại nghiêm trọng về uy tín và tốn kém chi phí xử lý khủng hoảng truyền thông. Bài học: Giảm giá luôn làm tăng cầu, nhưng nếu không chuẩn bị đủ nguồn cung hoặc hạ tầng phục vụ, sự bùng nổ lượng cầu sẽ làm vỡ hệ thống vận hành.","ct_bien_the":"Định giá chim mồi (Decoy pricing); Mua 1 tặng 1 mang lại cảm giác hời hơn là giảm giá 50% dù chi phí đối với doanh nghiệp có thể tương đương.","ct_gioi_han":"Lạm dụng giảm giá sẽ đào tạo khách hàng thói quen chỉ mua khi có khuyến mãi. Giảm giá quá sâu hoặc liên tục khiến sản phẩm bị nghi ngờ về chất lượng (định giá thấp đồng nghĩa với hàng kém). Khó áp dụng cho dịch vụ cao cấp định vị bằng sự khan hiếm.","ct_sai_lam":"Giảm giá nhưng không giới hạn thời gian khiến nó trở thành mức giá mặc định mới || Không kiểm tra năng lực đáp ứng của kho bãi, nhân viên giao hàng trước khi chạy chiến dịch || Dùng giảm giá để cứu một sản phẩm quá tệ, dẫn đến chi phí tiếp thị cao mà khách không bao giờ quay lại || Tính sai biên lợi nhuận, bán càng nhiều càng lỗ ròng","ct_tu_kiem_tra":"Rủi ro lớn nhất của việc liên tục lạm dụng giảm giá là gì? ⇒ Làm hỏng định vị thương hiệu và tạo ra tệp khách hàng chỉ chờ khuyến mãi. || Tại sao mua 1 tặng 1 thường hấp dẫn hơn giảm 50%? ⇒ Do tâm lý con người thích nhận thêm đồ miễn phí (zero-price effect) hơn là cảm giác phải chi tiền. || Cần chuẩn bị gì trước khi tung đợt giảm giá lớn? ⇒ Tính toán điểm hoà vốn, giới hạn thời gian, số lượng và chuẩn bị đủ năng lực cung ứng.","ct_tai_lieu":"TL155,TL170,TL089","ct_tai_lieu_de_xuat":"Ariely, D. (2008). Predictably Irrational."},{"id":"CH-KT-003","thu_tu":107,"tuan":6,"ngay":2,"nhom_hoc":"Kinh tế: giá và thị trường","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"chuoi","nhom":"Chuỗi kinh tế – Cung-cầu vi mô","ten":"Thay thế hàng hoá","ten_goc":"Substitution effect","neu":"Giá A tăng","thi":"cầu B tăng","chuoi":"Giá A tăng → người mua chuyển sang B tương tự → cầu B tăng","vi_du":"Giá cà phê tăng → nhiều người uống trà.","gioi_han":"Chỉ khi có hàng thay thế gần.","tu_khoa":"Giá A tăng, người mua chuyển sang B tương tự, cầu B tăng","chuoi_hoc":"Kinh tế: giá và thị trường","kieu_hoc":"chuoi","buoc":3,"truoc":"CH-KT-002","sau":"CH-KT-004","ct_nguon_goc":"Khái niệm \"Hiệu ứng thay thế\" (Substitution effect) do các nhà kinh tế học cổ điển và cận đại xây dựng, được định hình rõ trong kinh tế học vi mô của Alfred Marshall (1890) và phát triển toàn diện qua phương trình Slutsky. Nó giải thích cách người tiêu dùng dịch chuyển cơ cấu tiêu dùng giữa các loại hàng hoá khi giá cả tương đối của chúng thay đổi.","ct_co_che":"Khi giá của mặt hàng A tăng lên trong khi các sản phẩm tương tự giữ nguyên giá, người tiêu dùng ngay lập tức nhận thấy sản phẩm A trở nên đắt đỏ hơn so với các lựa chọn thay thế xung quanh. Cơ chế tâm lý và kinh tế thúc đẩy họ từ bỏ sản phẩm A và chuyển sang mua sản phẩm B (có công dụng tương đương nhưng giá rẻ hơn) để tối ưu hoá lợi ích kinh tế của ví tiền. Độ mạnh của sự dịch chuyển này phụ thuộc hoàn toàn vào mức độ tương đồng giữa hai sản phẩm.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Hiệu ứng thay thế là một trong hai trụ cột cốt lõi (cùng với hiệu ứng thu nhập) cấu thành nên đường cầu dốc xuống trong kinh tế học, được kiểm chứng qua hàng thế kỷ dữ liệu thị trường.","ct_quy_trinh":"Xác định sản phẩm đang bị tăng giá hoặc mất lợi thế cạnh tranh trong danh mục của bạn || Liệt kê toàn bộ các sản phẩm thay thế gần nhất mà khách hàng có thể chuyển sang || Tính toán khoảng cách giá giữa sản phẩm của bạn và đối thủ thay thế || Tung ra các chương trình giữ chân hoặc truyền thông nhấn mạnh điểm độc quyền để ngăn khách chuyển đổi || Theo dõi dòng chảy khách hàng sang các nhóm sản phẩm thay thế để có chiến lược ứng phó kịp thời","ct_vi_du_mau":"Tình huống: Một chuỗi cửa hàng cà phê quyết định tăng giá ly cà phê truyền thống từ 30.000đ lên 45.000đ do chi phí nguyên liệu đầu vào tăng. Ngay lập tức, một lượng lớn khách hàng quen không chấp nhận mức giá mới. Thay vì tiếp tục mua, họ chuyển sang mua cà phê gói hoà tan tại các cửa hàng tiện lợi hoặc rẽ sang các quán trà sữa bình dân ở gần đó (hiệu ứng thay thế diễn ra mạnh mẽ vì tính chất sản phẩm tương đối đồng nhất). Doanh thu của chuỗi giảm sút nghiêm trọng dù biên lợi nhuận trên từng ly đã cao hơn. Bài học: Khi tăng giá mà không có yếu tố khác biệt độc quyền, bạn đang trực tiếp đẩy khách hàng vào tay đối thủ thay thế.","ct_bien_the":"Hàng hoá thay thế hoàn hảo (độ co giãn chéo cao); Thay thế trong tiêu dùng công nghiệp khi các nhà máy đổi nguyên liệu đầu vào (ví dụ dùng nhựa thay nhôm) khi giá nhôm tăng vọt.","ct_gioi_han":"Không xuất hiện hiệu ứng thay thế nếu sản phẩm đó không có bất kỳ hàng hoá thay thế nào trên thị trường (độc quyền hoàn toàn). Nó cũng rất yếu đối với những người tiêu dùng trung thành tuyệt đối với thương hiệu (brand loyalty cao) hoặc có thu nhập quá dồi dào để quan tâm đến chênh lệch giá.","ct_sai_lam":"Tăng giá sản phẩm mà quên khảo sát xem thị trường đang có những sản phẩm thay thế nào giá rẻ hơn || Cho rằng khách hàng sẽ mãi gắn bó mà không tìm kiếm lựa chọn khác || Không tạo ra tính năng độc quyền để giữ chân khách khi giá thay đổi || Chủ quan đánh giá thấp khả năng thích ứng của người tiêu dùng","ct_tu_kiem_tra":"Hiệu ứng thay thế xảy ra khi nào? ⇒ Khi giá của một mặt hàng tăng, khiến người mua chuyển sang sản phẩm tương tự có giá rẻ hơn. || Điều gì quyết định mức độ dịch chuyển của hiệu ứng thay thế? ⇒ Mức độ tương đồng giữa các sản phẩm và khoảng cách chênh lệch giá giữa chúng. || Làm sao để sản phẩm của bạn miễn nhiễm với hiệu ứng thay thế? ⇒ Tạo ra sự khác biệt độc quyền khiến sản phẩm khác không thể thay thế được.","ct_tai_lieu":"TL155,TL170"},{"id":"CH-KT-004","thu_tu":108,"tuan":6,"ngay":2,"nhom_hoc":"Kinh tế: giá và thị trường","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"chuoi","nhom":"Chuỗi kinh tế – Cung-cầu vi mô","ten":"Thu nhập → tiêu dùng","ten_goc":"Income effect","neu":"Thu nhập tăng","thi":"cầu tăng","chuoi":"Thu nhập tăng → chi tiêu tăng → cầu tăng","vi_du":"Được tăng lương → ăn ngoài nhiều hơn.","gioi_han":"Với hàng thứ cấp (mì gói), thu nhập tăng thì cầu giảm.","tu_khoa":"Thu nhập tăng, chi tiêu tăng, cầu tăng","chuoi_hoc":"Kinh tế: giá và thị trường","kieu_hoc":"chuoi","buoc":4,"truoc":"CH-KT-003","sau":"CH-KT-028","ct_nguon_goc":"Thuộc hệ thống lý thuyết kinh tế học vi mô cổ điển và hiện đại, được hệ thống hoá qua các giáo trình kinh tế học chuẩn mực như của Paul Samuelson và N. Gregory Mankiw. Khái niệm \"Hiệu ứng thu nhập\" (Income effect) chỉ sự thay đổi trong lượng cầu của một hàng hoá phát sinh từ việc thay đổi sức mua thực tế của người tiêu dùng, khi giá cả hoặc thu nhập danh nghĩa biến động.","ct_co_che":"Khi thu nhập thực tế của một người tăng lên (do được tăng lương hoặc giá cả hàng hoá nói chung giảm), sức mua của họ mở rộng. Cơ chế tâm lý thúc đẩy họ không chỉ mua nhiều hơn những mặt hàng thông thường đang dùng, mà còn có xu hướng nâng cấp chất lượng tiêu dùng, dịch chuyển sang các sản phẩm cao cấp hơn. Ngược lại, khi thu nhập giảm, họ buộc phải thu hẹp quy mô tiêu dùng và cắt giảm các khoản chi không thiết yếu.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Đây là một định luật kinh tế cơ bản phản ánh mối quan hệ trực tiếp giữa khả năng tài chính và hành vi phân bổ nguồn lực tiêu dùng của con người.","ct_quy_trinh":"Đánh giá sự biến động về thu nhập hoặc sức mua của phân khúc khách hàng mục tiêu || Phân loại sản phẩm của bạn thuộc nhóm hàng thông thường (nhu cầu tăng khi thu nhập tăng) hay hàng thứ cấp || Điều chỉnh chiến lược sản phẩm: tung ra dòng cao cấp hơn khi thu nhập chung tăng trưởng || Thiết kế các gói sản phẩm tiết kiệm khi nền kinh tế hoặc thu nhập cộng đồng sụt giảm || Theo dõi các chỉ số kinh tế vĩ mô liên quan đến thu nhập khả dụng","ct_vi_du_mau":"Tình huống: Một nhóm nhân viên văn phòng nhận được quyết định tăng lương 20% sau một năm làm việc hiệu quả. Hiệu ứng thu nhập lập tức kích hoạt: họ thay đổi thói quen ăn trưa từ những quán cơm bình dân 35.000đ sang các nhà hàng máy lạnh có giá 80.000đ mỗi bữa. Họ cũng bắt đầu đặt mua cà phê pha máy giao tận nơi thay vì tự pha gói hoà tan như trước. Các quán cơm bình dân xung quanh chứng kiến lượng khách từ nhóm này giảm sút, trong khi các nhà hàng cao cấp lại đông khách hơn hẳn. Bài học: Khi thu nhập của khách hàng tăng, hành vi tiêu dùng dịch chuyển theo hướng ưu tiên chất lượng và trải nghiệm thay vì chỉ tìm giá rẻ.","ct_bien_the":"Hàng thứ cấp (Inferior goods): hàng mà cầu giảm khi thu nhập tăng (ví dụ mì gói rẻ tiền; khi có tiền nhiều người sẽ chuyển sang ăn phở hoặc cơm tươi).","ct_gioi_han":"Không áp dụng đồng đều cho mọi loại hàng hoá. Hàng thiết yếu (như gạo, muối, điện nước) có lượng cầu gần như không đổi dù thu nhập tăng cao đến mức nào.","ct_sai_lam":"Dự báo sai lầm rằng khách hàng sẽ tiếp tục mua sản phẩm giá rẻ khi thu nhập của họ đã tăng trưởng mạnh || Kinh doanh hàng cao cấp trong bối cảnh thu nhập cộng đồng đang sụt giảm do khủng hoảng || Nhầm lẫn giữa hàng thông thường và hàng thứ cấp dẫn đến định vị sai phân khúc","ct_tu_kiem_tra":"Hiệu ứng thu nhập tác động thế nào đến hành vi tiêu dùng khi thu nhập tăng? ⇒ Người mua tăng chi tiêu, đồng thời dịch chuyển sang các sản phẩm có chất lượng cao hơn. || Hàng thứ cấp là gì? ⇒ Là loại hàng hoá mà khi thu nhập người mua càng tăng, lượng cầu đối với nó lại càng giảm đi. || Tại sao hàng thiết yếu không thay đổi nhiều khi thu nhập biến động? ⇒ Vì nhu cầu tiêu thụ các mặt hàng này đã bão hòa ở mức cơ bản của đời sống.","ct_tai_lieu":"TL155,TL170","ct_cho_duyet":1},{"id":"CH-LT-03","thu_tu":109,"tuan":6,"ngay":3,"nhom_hoc":"Leo thang","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"chuoi","nhom":"Chuỗi leo thang – 4. Chuỗi leo thang cam kết","ten":"Nhóm làm quyết định cực đoan hơn","ten_goc":"Group polarization – Moscovici & Zavalloni; Stoner (risky shift)","neu":"Nhóm đồng ý","thi":"khó dừng","chuoi":"Nhóm đồng ý → thảo luận → cam kết mạnh hơn → khó dừng","vi_du":"Hội đồng thảo luận xong chọn phương án mạo hiểm hơn ý từng người.","gioi_han":"Mời người phản biện độc lập trước khi chốt.","tu_khoa":"Nhóm đồng ý, thảo luận, cam kết mạnh hơn, khó dừng","de_nham_voi":"CH-LA-14","chuoi_hoc":"Leo thang","kieu_hoc":"chuoi","buoc":5,"truoc":"CH-LT-02","sau":"CH-LT-09","cap_doi":"CH-LA-14","khac_nhau":"Chọn phe: chia thành hai phe đối lập; Nhóm cực đoan hơn: một nhóm tự đẩy quyết định mạnh lên","ct_nguon_goc":"Được phát triển từ các nghiên cứu thực nghiệm tiên phong của Serge Moscovici & Marisa Zavalloni (1969) về sự phân cực thái độ trong nhóm; đồng thời kế thừa hiện tượng \"sự dịch chuyển mạo hiểm\" (risky shift) do James Stoner phát hiện năm 1961. Khái niệm này chỉ ra rằng các quyết định được đưa ra sau khi thảo luận nhóm thường có xu hướng cực đoan hơn (hoặc cực kỳ mạo hiểm, hoặc cực kỳ thận trọng) so với xu hướng trung bình của các cá nhân trước khi bước vào cuộc thảo luận.","ct_co_che":"Trong quá trình thảo luận nhóm, hai cơ chế tâm lý chính diễn ra đồng thời. Thứ nhất là lập luận ưu thế (persuasive arguments): những người có cùng chí hướng sẽ củng cố thêm các luận điểm có lợi cho quan điểm sẵn có, làm tăng thêm lý lẽ một chiều. Thứ hai là so sánh xã hội (social comparison): các cá nhân muốn nổi bật hoặc được nhóm công nhận thường có xu hướng đẩy ý kiến của mình nhỉnh hơn một chút về phía giá trị mà nhóm đang ưu ái, khiến cả tập thể trượt dần về phía thái cực.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Hiện tượng phân cực nhóm đã được tái hiện trong hàng trăm thí nghiệm tâm lý học xã hội trên khắp thế giới trong nhiều thập kỷ qua.","ct_quy_trinh":"Nhận diện khi một hội đồng hoặc nhóm chuẩn bị đưa ra quyết định quan trọng || Cử một thành viên đóng vai trò phản biện độc lập (devil's advocate) từ đầu buổi họp || Yêu cầu mỗi thành viên viết ra quyết định cá nhân độc lập trước khi bắt đầu thảo luận chung || Khuyến khích đưa ra các số liệu và kịch bản rủi ro đi ngược lại xu hướng chung của nhóm || Đặt mốc thời gian dừng lại để xem xét lại nếu quyết định trở nên quá táo bạo hoặc quá bảo thủ","ct_vi_du_mau":"Tình huống: Ban giám đốc một công ty đang thảo luận về việc mở rộng đầu tư sang một lĩnh vực hoàn toàn mới. Ban đầu, mỗi thành viên chỉ có mức độ dè dặt nhất định (cho rằng nên thử nghiệm nhỏ với 10% vốn). Tuy nhiên, sau vài giờ thảo luận, do không có ý kiến trái chiều nào phản đối mạnh mẽ, những lời cổ vũ lẫn nhau đã làm không khí nóng lên. Cuối cùng, hội đồng thống nhất quyết định rót toàn bộ 50% quỹ dự trữ của công ty vào dự án mạo hiểm này vì ai cũng muốn tỏ ra quyết đoán và ủng hộ tầm nhìn lớn của tập thể. Kết quả: Dự án thất bại nặng nề do thiếu bước kiểm chứng thực tế. Bài học: Thảo luận nhóm mà thiếu kiểm soát phản biện rất dễ đẩy tập thể rơi vào trạng thái cực đoan, tự tin thái quá.","ct_bien_the":"Tư duy tập thể (Groupthink) của Irving Janis; Hiệu ứng echo chamber (buồng tiếng vang) trên không gian mạng khi các nhóm cùng quan điểm củng cố lẫn nhau.","ct_gioi_han":"Không xảy ra nếu nhóm có sự đa dạng cao về quan điểm từ ban đầu, hoặc có cơ chế bỏ phiếu kín không qua tranh luận kéo dài. Nếu có một cá nhân có quyền lực tuyệt đối chi phối cuộc họp, nhóm sẽ không phân cực theo ý chung mà sẽ ngả hoàn toàn theo ý kẻ mạnh đó.","ct_sai_lam":"Cho rằng quyết định của tập thể lúc nào cũng an toàn và khách quan hơn cá nhân || Bỏ qua hoặc trù dập những ý kiến phản biện thận trọng trong buổi thảo luận || Để những người có cá tính mạnh lấn át hoàn toàn không gian của các thành viên khác || Không yêu cầu bỏ phiếu độc lập trước khi bước vào tranh luận công khai","ct_tu_kiem_tra":"Vì sao các quyết định của nhóm thường cực đoan hơn ý kiến cá nhân ban đầu? ⇒ Do cơ chế củng cố lập luận một chiều và mong muốn thể hiện sự ủng hộ theo hướng nhóm ưu ái. || Làm thế nào để ngăn chặn hiện tượng phân cực nhóm? ⇒ Yêu cầu viết quyết định cá nhân độc lập trước khi họp và cử người đóng vai trò phản biện độc lập. || Phân cực nhóm khác với tư duy tập thể ở điểm nào? ⇒ Phân cực đẩy quyết định đi xa hơn về một thái cực, còn tư duy tập thể là xu hướng tìm kiếm sự đồng thuận bằng mọi giá.","ct_tai_lieu":"TL111,TL110"},{"id":"CH-LT-09","thu_tu":110,"tuan":6,"ngay":3,"nhom_hoc":"Leo thang","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"chuoi","nhom":"Chuỗi leo thang – 7. Chuỗi kỳ vọng & niềm tin","ten":"Sự kiện nổi bật dẫn quyết định","ten_goc":"Availability heuristic – Tversky & Kahneman (1973)","neu":"Sự kiện nổi bật","thi":"lan","chuoi":"Sự kiện nổi bật → được chú ý → đánh giá lệch → quyết định → lan","vi_du":"Sau tin tai nạn máy bay, nhiều người chuyển đi ô tô (rủi ro cao hơn).","gioi_han":"Kiểm tra bằng số liệu nền (tần suất thật).","tu_khoa":"Sự kiện nổi bật, được chú ý, đánh giá lệch, quyết định, lan","chuoi_hoc":"Leo thang","kieu_hoc":"chuoi","buoc":6,"truoc":"CH-LT-03","sau":"CH-LT-10"},{"id":"CH-LT-10","thu_tu":111,"tuan":6,"ngay":3,"nhom_hoc":"Leo thang","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"chuoi","nhom":"Chuỗi leo thang – 7. Chuỗi kỳ vọng & niềm tin","ten":"Lời tiên tri tự ứng nghiệm","ten_goc":"Self-fulfilling prophecy – Robert K. Merton (1948)","neu":"Tin điều gì","thi":"củng cố niềm tin","chuoi":"Tin điều gì → hành động theo → kết quả xảy ra → củng cố niềm tin","vi_du":"Tin ngân hàng sắp vỡ → rút tiền → ngân hàng vỡ thật.","gioi_han":"Không phải mọi niềm tin đều tự thành; cần hành động đủ đông.","tu_khoa":"Tin điều gì, hành động theo, kết quả xảy ra, củng cố niềm tin","chuoi_hoc":"Leo thang","kieu_hoc":"chuoi","buoc":7,"truoc":"CH-LT-09","sau":"CH-LT-06"},{"id":"QL-LI-03","thu_tu":112,"tuan":6,"ngay":4,"nhom_hoc":"Lợi ích: chia và phản ứng","uu_tien":10,"muc_uu_tien":"B – quan trọng"," ruyền thông, độc quyền, dư luận, nhận thức","de_nham_voi":"QL-QL-12","chuoi_hoc":"Quyền lực: mềm, cứng và thông tin","kieu_hoc":"chuoi","buoc":5,"truoc":"QL-QL-12","sau":"QL-QL-11","cap_doi":"QL-QL-12","khac_nhau":"Diễn ngôn: kiểm soát kênh thông tin; Lặp lại: một thông điệp nghe nhiều thành tin"},{"id":"QL-QL-11","thu_tu":149,"tuan":9,"ngay":3,"nhom_hoc":"Quyền lực: mềm, cứng và thông tin","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"quy_luat","nhom":"QL quyền lực","ten":"Khủng hoảng tin giả","ten_goc":"Nghiên cứu lan truyền tin giả – Vosoughi, Roy & Aral (2018)","neu":"Tin giả lan rộng mà không được đính chính kịp","thi":"Niềm tin xã hội suy giảm, hệ thống rơi vào khủng hoảng","vi_du":"Tin đồn ngân hàng sắp phá sản lan trên mạng → người dân xếp hàng rút tiền.","gioi_han":"Đính chính nhanh từ nguồn đáng tin hạn chế được; đính chính chậm thường không theo kịp tin giả.","tu_khoa":"tin giả, lan nhanh, không đính chính","de_nham_voi":"QL-LD-12","chuoi_hoc":"Quyền lực: mềm, cứng và thông tin","kieu_hoc":"chuoi","buoc":6,"truoc":"QL-QL-10","sau":"QL-QL-15","cap_doi":"QL-LD-12","khac_nhau":"Chân không thông tin: lãnh đạo im lặng sinh tin đồn; Tin giả: tin sai lan mà không ai đính chính"},{"id":"QL-QL-15","thu_tu":150,"tuan":9,"ngay":3,"nhom_hoc":"Quyền lực: mềm, cứng và thông tin","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"quy_luat","nhom":"QL quyền lực","ten":"Quyền lớn, năng lực kém","ten_goc":"Nguyên lý Peter – Laurence J. Peter (tham khảo)","neu":"Giao quyền lớn cho người thiếu năng lực","thi":"Hiệu quả quản lý giảm mạnh, sai lầm lan rộng","vi_du":"Thăng chức người bán giỏi lên quản lý mà không đào tạo → đội rối loạn.","gioi_han":"Đào tạo và hỗ trợ đúng lúc có thể bù một phần năng lực thiếu.","tu_khoa":"giao quyền, thiếu năng lực, hiệu quả giảm","de_nham_voi":"QL-QL-20","chuoi_hoc":"Quyền lực: mềm, cứng và thông tin","kieu_hoc":"chuoi","buoc":7,"truoc":"QL-QL-11","sau":"QL-QL-14","cap_doi":"QL-QL-20","khac_nhau":"Quyền lớn năng lực kém: người không đủ sức; Suy thoái: mất nguồn lực và niềm tin"},{"id":"QL-QL-14","thu_tu":151,"tuan":9,"ngay":3,"nhom_hoc":"Quyền lực: mềm, cứng và thông tin","uu_tien":9,"muc_uu_tien":"B – quan trọng","loai":"quy_luat","nhom":"QL quyền lực","ten":"Quyền lực tuyệt đối dễ tha hoá","ten_goc":"Châm ngôn Lord Acton; nghiên cứu tâm lý quyền lực – Dacher Keltner","neu":"Cá nhân, tổ chức nắm quyền lớn không bị kiểm soát","thi":"Nguy cơ lạm dụng, tham nhũng, sai lầm lớn tăng cao","vi_du":"Trưởng chi nhánh không bị kiểm toán nhiều năm → chi tiêu sai mục đích.","gioi_han":"Là châm ngôn và xu hướng, không tất yếu với mọi người; giám sát độc lập là cách phòng.","tu_khoa":"không kiểm soát, lạm dụng, tham nhũng","de_nham_voi":"QL-QL-01","chuoi_hoc":"Quyền lực: mềm, cứng và thông tin","kieu_hoc":"chuoi","buoc":8,"truoc":"QL-QL-15","cap_doi":"QL-QL-01","khac_nhau":"Tập trung: nhóm nhỏ dựng cơ chế giữ quyền; Tuyệt đối: không ai kiểm soát nên dễ tha hoá"},{"id":"PP-DL-29","thu_tu":152,"tuan":9,"ngay":4,"nhom_hoc":"Động lực: Tạo động lực","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – III. Motivation (Động lực)","ten":"Gợi tò mò","ten_goc":"Information gap theory – George Loewenstein (1994)","neu":"Chủ đề khô khan; cần thu hút ngay","thi":"Đặt câu hỏi thú vị hoặc hé một phần thông tin trước","vi_du":"\"Vì sao 80% dự án trễ hạn ở cùng một bước?\" trước buổi đào tạo.","gioi_han":"Câu hỏi giật tít mà nội dung nhạt thì mất lòng tin.","tu_khoa":"tò mò, câu hỏi, khoảng trống thông tin","chuoi_hoc":"Động lực: Tạo động lực","kieu_hoc":"cay","buoc":5,"cha":"PP-DL-00"},{"id":"PP-DL-34","thu_tu":153,"tuan":9,"ngay":4,"nhom_hoc":"Động lực: Tạo động lực","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – III. Motivation (Động lực)","ten":"Thẩm quyền","ten_goc":"Authority – Cialdini; Milgram","neu":"Tình huống khẩn cấp; người làm tin cấp bậc, chuyên gia","thi":"Dùng lời khuyên chuyên gia hoặc mệnh lệnh cấp trên","vi_du":"Bác sĩ trưởng khoa yêu cầu rửa tay → tuân thủ tăng.","gioi_han":"Lạm dụng thẩm quyền khiến người ta làm sai mà không dám phản đối (Milgram).","tu_khoa":"chuyên gia, mệnh lệnh, cấp trên","phong_ve":"Hỏi: người có thẩm quyền này có chuyên môn đúng lĩnh vực không?","chuoi_hoc":"Động lực: Tạo động lực","kieu_hoc":"cay","buoc":6,"cha":"PP-DL-00"},{"id":"PP-DL-36","thu_tu":154,"tuan":9,"ngay":4,"nhom_hoc":"Động lực: Tạo động lực","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – III. Motivation (Động lực)","ten":"Mục tiêu chung","ten_goc":"Superordinate goals – Muzafer Sherif (Robbers Cave)","neu":"Tổ chức phân mảnh, xung đột lợi ích","thi":"Xây mục tiêu mà các bên chỉ đạt được khi hợp sức","vi_du":"\"Giữ khách hàng lớn nhất năm nay\" cần cả kinh doanh lẫn kỹ thuật.","gioi_han":"Mục tiêu chung không xoá xung đột thật về nguồn lực.","tu_khoa":"mục tiêu chung, hợp lực, đoàn kết","chuoi_hoc":"Động lực: Tạo động lực","kieu_hoc":"cay","buoc":7,"cha":"PP-DL-00"},{"id":"PP-DL-25","thu_tu":155,"tuan":9,"ngay":4,"nhom_hoc":"Động lực: Tạo động lực","uu_tien":9,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – III. Motivation (Động lực)","ten":"Thử thách đúng sức","ten_goc":"Flow – Csikszentmihalyi; Goal difficulty – Locke","neu":"Người giỏi nhưng chán vì việc dưới sức","thi":"Giao thử thách cụ thể, khó vừa đủ","vi_du":"\"Em thử rút quy trình này từ 5 ngày xuống 3 ngày xem.\"","gioi_han":"Thử thách quá sức gây lo âu.","tu_khoa":"thử thách, nhàm chán, khó vừa","chuoi_hoc":"Động lực: Tạo động lực","kieu_hoc":"cay","buoc":8,"cha":"PP-DL-00"},{"id":"PP-DL-15","thu_tu":156,"tuan":9,"ngay":5,"nhom_hoc":"Động lực: Khả năng","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – II. Ability (Khả năng)","ten":"Mẫu chuẩn kèm ví dụ","ten_goc":"Worked example effect – John Sweller","neu":"Sản phẩm cần theo khuôn mẫu; người học cần cái neo cụ thể","thi":"Đưa mẫu làm sẵn và ví dụ để làm theo","vi_du":"Gửi một email mẫu chuẩn trước khi nhân v  – Nhân khẩu","ten":"Nhập cư tăng","ten_goc":"Labor supply","neu":"Lao động nhập cư tăng","thi":"sản xuất tăng","chuoi":"Lao động nhập cư tăng → cung lao động tăng → chi phí giảm → sản xuất tăng","vi_du":"Nhà máy tuyển thêm lao động từ tỉnh khác.","gioi_han":"Có thể gây áp lực hạ tầng, nhà ở.","tu_khoa":"Lao động nhập cư tăng, cung lao động tăng, chi phí giảm, sản xuất tăng","chuoi_hoc":"Kinh tế: cấu trúc và thương mại","kieu_hoc":"chuoi","buoc":13,"truoc":"CH-KT-063","sau":"CH-KT-065"},{"id":"CH-KT-065","thu_tu":414,"tuan":23,"ngay":3,"nhom_hoc":"Kinh tế: cấu trúc và thương mại","uu_tien":5,"muc_uu_tien":"C – mở rộng","loai":"chuoi","nhom":"Chuỗi kinh tế – Nhân khẩu","ten":"Dân số giảm","ten_goc":"Demographic decline","neu":"Lao động giảm","thi":"tăng trưởng chậm","chuoi":"Lao động giảm → thiếu nhân công → chi phí tăng → tăng trưởng chậm","vi_du":"Nhật Bản thiếu lao động phải dùng robot.","gioi_han":"Tự động hoá và nhập cư có thể bù.","tu_khoa":"Lao động giảm, thiếu nhân công, chi phí tăng, tăng trưởng chậm","chuoi_hoc":"Kinh tế: cấu trúc và thương mại","kieu_hoc":"chuoi","buoc":14,"truoc":"CH-KT-064"}],"tinh_huong":[{"id":"TH-01","tinh_huong":"Một nhân viên IT phát hiện hệ thống máy chủ công ty bị tấn công mã độc tống tiền lúc nửa đêm. Anh ấy lập tức ngắt kết nối internet toàn bộ văn phòng để cô lập vùng nhiễm độc, sau đó báo cáo khẩn cấp cho giám đốc công nghệ và phối hợp cùng đội ngũ an ninh mạng khôi phục dữ liệu từ bản sao lưu dự phòng an toàn.","tu_khoa":"Tấn công mã độc, ngắt kết nối, cô lập, báo cáo khẩn cấp, khôi phục dữ liệu, sao lưu dự phòng","muc_lien_quan":"QL-LD-08,KHUNG-01,QL-LD-11"},{"id":"TH-02","tinh_huong":"Khách hàng VIP của ngân hàng tức giận đến phòng giao dịch lớn vì tài khoản cá nhân đột ngột bị trừ một khoản phí giao dịch quốc tế không rõ nguyên nhân. Trưởng phòng lập tức mời khách vào phòng riêng, kiểm tra lịch sử hệ thống, giải thích lỗi hệ thống và thực hiện hoàn tiền ngay kèm thư xin lỗi chính thức.","tu_khoa":"Khách hàng VIP, trừ tiền không rõ nguyên nhân, lỗi hệ thống, hoàn tiền lập tức, thư xin lỗi","muc_lien_quan":"QL-LI-04,QL-LI-05,HN-TP-09"},{"id":"TH-03","tinh_huong":"Trong giờ cao điểm tại nhà hàng tiệc cưới, một đầu bếp chính bất ngờ bị bỏng tay nặng do dầu sôi bắn vào. Bếp trưởng ngay lập tức sơ cứu vết thương bằng nước mát, điều chuyển nhân sự từ khu vực món khai vị sang thay thế vị trí, đảm bảo tiến độ lên món ăn không bị gián đoạn cho thực khách.","tu_khoa":"Tai nạn lao động, đầu bếp bị bỏng, sơ cứu, điều chuyển nhân sự, đảm bảo tiến độ","muc_lien_quan":"QL-LD-08,KHUNG-01,PP-DL-20"},{"id":"TH-04","tinh_huong":"Một startup công nghệ chuẩn bị ra mắt ứng dụng gọi xe thì đối thủ lớn tung chiến dịch khuyến mãi giảm giá 50% toàn thị trường. Ban giám đốc tổ chức họp khẩn, quyết định không đua giá mà tập trung nâng cao trải nghiệm chăm sóc khách hàng, tặng bảo hiểm chuyến đi và miễn phí 3 chuyến đầu cho người dùng mới.","tu_khoa":"Đối thủ cạnh tranh, khuyến mãi lớn, họp khẩn, nâng cao trải nghiệm, tặng bảo hiểm, người dùng mới","muc_lien_quan":"CH-KT-029,PP-36-16,KHUNG-10"},{"id":"TH-05","tinh_huong":"Công ty sản xuất thực phẩm phát hiện một lô bánh ngọt vừa phân phối ra các siêu thị lớn bị lỗi bao bì làm giảm hạn sử dụng. Giám đốc điều hành ra quyết định thu hồi khẩn cấp toàn bộ lô hàng lỗi, đăng thông cáo báo chí nhận trách nhiệm và đổi sản phẩm mới miễn phí cho khách đã mua.","tu_khoa":"Lỗi bao bì, hạn sử dụng, thu hồi khẩn cấp, thông cáo báo chí, đổi sản phẩm mới","muc_lien_quan":"QL-LD-03,QL-LD-12,QL-QL-11"},{"id":"TH-06","tinh_huong":"Do mưa bão lớn kéo dài làm sạt lở tuyến đường huyết mạch, một đại lý phân phối nông sản bị chậm chuyến giao hàng nguyên liệu cho nhà máy chế biến xuất khẩu. Quản lý kho đã chủ động gọi điện đàm phán xin gia hạn thời gian thêm 24 giờ, đồng thời tìm kiếm tuyến đường vòng dù chi phí cao hơn.","tu_khoa":"Mưa bão sạt lở, chậm giao hàng, đàm phán gia hạn, tuyến đường vòng, chi phí cao","muc_lien_quan":"KHUNG-01,QL-LD-08"},{"id":"TH-07","tinh_huong":"Một học sinh lớp 12 gặp áp lực tâm lý nặng nề trước kỳ thi tốt nghiệp THPT, dẫn đến mất ngủ kéo dài và có dấu hiệu trầm cảm nhẹ. Giáo viên chủ nhiệm phát hiện và chủ động liên hệ với phụ huynh, phối hợp cùng chuyên gia tâm lý học đường để giảm bớt áp lực bài vở cho em học sinh.","tu_khoa":"Áp lực thi cử, mất ngủ, trầm cảm, giáo viên chủ nhiệm, chuyên gia tâm lý, giảm áp lực","muc_lien_quan":"HN-PU-03,HN-TP-09,HN-TP-13"},{"id":"TH-08","tinh_huong":"Chuyến bay thương mại chở 150 hành khách chuẩn bị cất cánh thì hệ thống cảnh báo hiển thị lỗi áp suất lốp máy bay. Cơ trưởng quyết định hoãn chuyến bay, đưa máy bay về khu vực kỹ thuật để kiểm tra thay lốp, đồng thời hãng hàng không sắp xếp phòng chờ và cung cấp suất ăn miễn phí cho toàn bộ hành khách.","tu_khoa":"Lỗi áp suất lốp, hoãn chuyến bay, kiểm tra kỹ thuật, thay lốp máy bay, hỗ trợ hành khách","muc_lien_quan":"KHUNG-01,KHUNG-08"},{"id":"TH-09","tinh_huong":"Một công ty kiến trúc nộp hồ sơ đấu thầu dự án trung tâm thương mại lớn nhưng bị rò rỉ bản thiết kế ý tưởng cho đối thủ. Đội ngũ pháp lý lập tức thu thập chứng cứ chứng minh bản quyền, gửi văn bản cảnh cáo chính thức tới đối thủ và yêu cầu ban tổ chức đấu thầu hủy tư cách đơn vị gian lận.","tu_khoa":"Rò rỉ thiết kế, đối thủ cạnh tranh, chứng cứ bản quyền, văn bản cảnh cáo, hủy tư cách đấu thầu","muc_lien_quan":"PP-MT-32,QL-LI-11"},{"id":"TH-10","tinh_huong":"Nhà máy dệt may bị thanh tra môi trường đột xuất phát hiện nguồn nước thải chưa qua xử lý đạt chuẩn đang rò rỉ ra dòng sông bên cạnh. Ban quản lý nhà máy lập tức cho dừng dây chuyền sản xuất, khắc phục sự cố vỡ đường ống xử lý nước thải, cam kết đền bù thiệt hại và nộp phạt nghiêm chỉnh.","tu_khoa":"Thanh tra đột xuất, nước thải chưa chuẩn, rò rỉ vỡ ống, dừng sản xuất, khắc phục sự cố, đền bù","muc_lien_quan":"QL-LD-03,QL-LI-05,KHUNG-06"},{"id":"TH-11","tinh_huong":"Một cửa hàng bán lẻ điện thoại bị khách hàng tố cáo trên mạng xã hội rằng nhân viên có thái độ khinh thường người mua. Quản lý cửa hàng lập tức trích xuất camera kiểm tra, xác định nhân viên sai phạm, đình chỉ công tác nhân viên đó, đồng thời trực tiếp nhắn tin xin lỗi công khai vị khách hàng.","tu_khoa":"Khách hàng tố cáo, thái độ nhân viên, trích xuất camera, đình chỉ công tác, xin lỗi công khai","muc_lien_quan":"QL-LD-06,QL-QL-11,QL-LD-05"},{"id":"TH-12","tinh_huong":"Doanh nghiệp bất động sản đang triển khai dự án thì giá vật liệu xây dựng như sắt, thép, xi măng đột ngột tăng mạnh 30%. Chủ đầu tư phải tổ chức cuộc họp với các nhà thầu chính để thương lượng lại đơn giá, tối ưu hóa quy trình thi công nhằm tiết kiệm nguyên vật liệu mà không giảm chất lượng.","tu_khoa":"Giá vật liệu tăng, sắt thép xi măng, thương lượng đơn giá, tối ưu thi công, tiết kiệm nguyên liệu","muc_lien_quan":"QL-KT-01,CH-KT-028,CH-KT-084,PP-SC-06"},{"id":"TH-13","tinh_huong":"Một bệnh nhân lớn tuổi nhập viện cấp cứu trong tình trạng nguy kịch cần phẫu thuật gấp nhưng người nhà chưa kịp có mặt để ký giấy cam kết. Bác sĩ trưởng ca trực quyết định kích hoạt quy trình khẩn cấp, xin ý kiến ban giám đốc bệnh viện để tiến hành mổ ngay nhằm cứu sống tính mạng người bệnh.","tu_khoa":"Cấp cứu nguy kịch, phẫu thuật gấp, thiếu người nhà ký kết, quy trình khẩn cấp, cứu sống tính mạng","muc_lien_quan":"KHUNG-01,QL-LD-08,QL-LD-02"},{"id":"TH-14","tinh_huong":"Một đại lý du lịch lữ hành đặt nhầm phòng khách sạn cho đoàn khách 40 người tại Phú Quốc vào mùa cao điểm khiến khách không có chỗ ở. Giám đốc đại lý lập tức bay ra hiện trường, thương lượng chuyển khách sang resort 5 sao gần đó với chi phí cao hơn và công ty tự bù toàn bộ phần chênh lệch.","tu_khoa":"Đặt nhầm phòng, mùa cao điểm, Phú Quốc, thương lượng resort, bù chi phí chênh lệch","muc_lien_quan":"QL-LI-05,QL-LD-03,HN-TP-12"},{"id":"TH-15","tinh_huong":"Trong quá trình thi công đào móng xây dựng tòa nhà văn phòng, nhóm công nhân bất ngờ phát hiện một quả bom lớn còn sót lại từ thời chiến tranh. Chỉ huy trưởng công trường lập tức ra lệnh sơ tán toàn bộ công nhân, phong tỏa hiện trường và báo tin khẩn cấp cho cơ quan quân sự địa phương.","tu_khoa":"Đào móng xây dựng, phát hiện bom, sơ tán công nhân, phong tỏa hiện trường, cơ quan quân sự","muc_lien_quan":"KHUNG-01,QL-LD-08"},{"id":"TH-16","tinh_huong":"Một chuỗi siêu thị mini phát hiện hệ thống thanh toán thẻ POS bị lỗi kết nối diện rộng vào đúng ngày lễ mua sắm lớn. Bộ phận kỹ thuật triển khai phương án dự phòng chuyển sang nhận thanh toán bằng mã QR chuyển khoản nhanh và bố trí thêm nhân viên thu ngân nhận tiền mặt để giảm ùn tắc tại quầy.","tu_khoa":"Lỗi máy POS, ngày lễ mua sắm, phương án dự phòng, thanh toán mã QR, thu ngân tiền mặt, giảm ùn tắc","muc_lien_quan":"KHUNG-01,CH-LA-08,KHUNG-08"},{"id":"TH-17","tinh_huong":"Một công ty chuyển phát nhanh bị thất lạc gói hàng chứa tài liệu thầu quan trọng của một doanh nghiệp đối tác lớn. Trưởng bộ phận dịch vụ khách hàng trực tiếp liên hệ nhận lỗi, cử nhân viên đi tìm kiếm định vị định vị GPS dòng xe vận chuyển và kịp thời bàn giao tài liệu trước giờ đóng thầu 30 phút.","tu_khoa":"Thất lạc gói hàng, tài liệu thầu, liên hệ nhận lỗi, định vị GPS, bàn giao kịp thời","muc_lien_quan":"QL-LD-03,QL-LI-05"},{"id":"TH-18","tinh_huong":"Trường tiểu học phát hiện có 5 học sinh trong cùng một lớp có biểu hiện sốt cao và nổi nốt mẩn đỏ nghi mắc bệnh sởi. Hiệu trưởng lập tức cách ly các em tại phòng y tế, thông báo cho phụ huynh đón về đi khám, đồng thời phun thuốc khử trùng toàn bộ trường học để ngăn dịch lây lan.","tu_khoa":"Học sinh sốt cao, nghi mắc sởi, cách ly y tế, thông báo phụ huynh, phun thuốc khử trùng, ngăn dịch","muc_lien_quan":"KHUNG-01,CH-LA-11,QL-LD-12"},{"id":"TH-19","tinh_huong":"Một công ty phần mềm xuất khẩu bị mất điện đột ngột toàn bộ tòa nhà do sự cố máy biến áp khu vực khi đang chuẩn bị nghiệm thu dự án lớn. Đội ngũ kỹ sư lập tức khởi động máy phát điện dự phòng, chuyển sang dùng mạng di động 4G để duy trì kết nối trực tuyến liên tục với đối tác nước ngoài.","tu_khoa":"Mất điện đột ngột, sự cố biến áp, máy phát điện dự phòng, mạng 4G, duy trì kết nối, đối tác nước ngoài","muc_lien_quan":"KHUNG-01,KHUNG-08"},{"id":"TH-20","tinh_huong":"Một nông trại trồng rau sạch hữu cơ bị sâu bệnh tấn công bất ngờ trên diện rộng làm nguy cơ mất trắng toàn bộ vụ mùa cận Tết. Kỹ sư nông nghiệp quyết định không dùng thuốc hóa học độc hại mà sử dụng chế phẩm sinh học tỏi ớt kết hợp thiên địch để dập dịch, bảo vệ tiêu chuẩn hữu cơ.","tu_khoa":"Rau sạch hữu cơ, sâu bệnh tấn công, nguy cơ mất mùa, chế phẩm sinh học, dập dịch, tiêu chuẩn hữu cơ","muc_lien_quan":"KHUNG-09,PP-SC-01"}],"lich":[{"tuan":1,"hoc_moi":"T2 Vòng giải quyết vấn đề (4) · T3 Vòng giải quyết vấn đề (4) · T4 Vòng giải quyết vấn đề (2) · T5 Quán trà sữa (kinh tế vi mô) (4) · T6 Lãnh đạo được theo (4)","so_muc":18,"muc_uu_tien":"A, B","tro_luyen_mo":""},{"tuan":2,"hoc_moi":"T2 Giữ người giỏi: niềm tin (4) · T3 Động lực: Duy trì (5) · T4 Phản ứng khi bị tác động (4) · T5 Lợi ích: tính toán và chọn (4) · T6 Thói quen (4)","so_muc":21,"muc_uu_tien":"A","tro_luyen_mo":"NẾU–THÌ 60 giây (khi ≥ 10 mục bậc 5)"},{"tuan":3,"hoc_moi":"T2 Động lực: Lời nhắc (4) · T3 Nhìn người: hành vi thường ngày (4) · T4 Động lực: Khả năng (4) · T5 Động lực: Khả năng (3) · T6 Phản ứng khi bị tác động (4)","so_muc":19,"muc_uu_tien":"A","tro_luyen_mo":""},{"tuan":4,"hoc_moi":"T2 Giữ người giỏi: động lực và công bằng (4) · T3 Giữ người giỏi: động lực và công bằng (4) · T4 Phản ứng theo người khác (5) · T5 Lãnh đạo được theo (4) · T6 Động lực: Tạo động lực (4)","so_muc":21,"muc_uu_tien":"A","tro_luyen_mo":""},{"tuan":5,"hoc_moi":"T2 Động lực: Môi trường (5) · T3 Leo thang (4) · T4 Động lực: Duy trì (4) · T5 Động lực: Củng cố (4) · T6 Nhìn người: nền tảng và lâu dài (4)","so_muc":21,"muc_uu_tien":"A","tro_luyen_mo":""},{"tuan":6,"hoc_moi":"T2 Điều khiển nhóm (4) · T3 Kinh tế: giá và thị trường (4) · T4 Leo thang (3) · T5 Lợi ích: chia và phản ứng (4) · T6 Phụ thuộc (4)","so_muc":19,"muc_uu_tien":"A, B","tro_luyen_mo":""},{"tuan":7,"hoc_moi":"Củng cố – không học mới","so_muc":"","muc_uu_tien":"","tro_luy function ymd(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }

/* ================== Dữ liệu ================== */

let TL = {};

const KEY_PROFILES = 'mindgym_v1_profiles', KEY_DATA = 'mindgym_v1_data', KEY_THEME = 'mindgym_v1_theme';
let BANK = null, BYID = {}, TH = [];
function loadBank() {

  if (src !== EMBED) {   // dữ liệu nhập thiếu chi tiết → ghép theo id từ bản nhúng

    BANK.forEach(x => { const r = emb[x.id]; if (r && !hasCt(x)) { CT_KEYS.forEach(k => { if (r[k]) x[k] = String(r[k]); }); if (r.ct_cho_duyet) x.ct_cho_duyet = 1; } });

/* ================== Hồ sơ & tiến độ ================== */
let PROFILES = null, P = null;
function newProgress(name) {

  return { v: 1, name, created: t, startMonday: mondayOf(t), offset: 0, dayOverride: null, items: {}, sessions: {}, game: { limitMs: 8000, rounds: [] } };
}
function pkey(id) { return 'mindgym_v1_' + id; }
function loadProfiles() {
  PROFILES = store.get(KEY_PROFILES, null);
  if (!PROFILES || !PROFILES.list || !PROFILES.list.length) {
    PROFILES = { list: [{ id: 'hs1', name: 'Tôi' }], current: 'hs1' };
    store.set(KEY_PROFILES, PROFILES); store.set(pkey('hs1'), newProgress('Tôi'));
  }
  P = store.get(pkey(PROFILES.current), null) || newProgress(curProfile().name);
  P.items = P.items || {}; P.sessions = P.sessions || {}; P.game = P.game || { limitMs: 8000, rounds: [] };
}
function curProfile() { return PROFILES.list.find(p => p.id === PROFILES.current) || PROFILES.list[0]; }
function save() { if (!store.set(pkey(PROFILES.current), P)) { /* bộ nhớ trình duyệt bị chặn: vẫn chạy trong phiên */ } }
function today() { const d = new Date(); d.setDate(d.getDate() + (P.offset || 0)); return ymd(d); }
function dow() { return P.dayOverride != null && P.dayOverride !== '' ? Number(P.dayOverride) : parseYmd(today()).getDay(); }
function curWeek() { return Math.max(1, Math.floor(diffDays(P.startMonday, today()) / 7) + 1); }
function prog(id) {
  let it = P.items[id];
  if (!it) it = P.items[id] = { bac: 0, s2: 0, d3: [], d4: [], box: 0, due: null, tries: {}, note: '', hist: [], game: [] };
  return it;
}
function bacOf(id) { return P.items[id] ? P.items[id].bac : 0; }
function learned() { return BANK.filter(x => bacOf(x.id) >= 1); }
function dueList() { const t = today(); return BANK.filter(x => { const it = P.items[x.id]; return it && it.bac >= 2 && it.due && it.due <= t; }); }
function countBac(n) { return BANK.filter(x => bacOf(x.id) >= n).length; }
function gameUnlocked() { return curWeek() >= 2 && countBac(5) >= 10; }

/* Mục mới hôm nay: theo thứ tự ưu tiên (thu_tu). Lấy trọn "ngày học" kế tiếp đã xếp sẵn (3–5 mục cùng nhóm);
   dữ liệu tự soạn không có cột ngay thì lấy tối đa 4 mục liền nhau cùng nhóm. */
function newToday() {
  const w = curWeek();
  const pool = BANK.filter(x => x.tuan <= w && bacOf(x.id) === 0);
  if (!pool.length) return [];
  const f = pool[0];
  if (f.ngay) return pool.filter(x => x.tuan === f.tuan && x.ngay === f.ngay).slice(0, 5);
  const out = [];
  for (const x of pool) { if (x.nhom_hoc !== f.nhom_hoc || out.length >= 4) break; out.push(x); }
  return out;
}
function streak() {
  let n = 0, d = today();
  if (!P.sessions[d]) d = addDays(d, -1);
  for (let i = 0; i < 400; i++) {
    const wd = parseYmd(d).getDay();
    if (P.sessions[d]) n++; else if (wd !== 0) break;
    d = addDays(d, -1);
  }
  return n;
}

/* ================== Chấm & lên bậc ================== */
function addDay(arr, t) { if (!arr.includes(t)) arr.push(t); }
function setBac(it, b) { it.bac = b; if (b === 2) it.s2 = 0; if (b === 3) it.d3 = []; if (b === 4) it.d4 = []; }
function grade(id, level, ok, kind) {
  const it = prog(id), t = today();
  it.tries[level] = t; it.hist.push([t, level, ok ? 1 : 0, kind]); if (it.hist.length > 60) it.hist.shift();
  let up = false;
  if (level === 2) {
    if (ok) { it.s2++; if (it.s2 >= 2) { setBac(it, 3); it.box = 0; it.due = addDays(t, 1); up = true; } }
    else { it.s2 = 0; it.due = addDays(t, 1); }
  } else {
    if (ok) {
      if (level === 3) { addDay(it.d3, t); if (it.d3.length >= 2) { setBac(it, 4); up = true; } }
      if (level === 4) { addDay(it.d4, t); if (it.d4.length >= 2) { setBac(it, 5); up = true; } }
      if (kind !== 'practice') { it.due = addDays(t, INTERVAL[it.box]); it.box = Math.min(it.box + 1, 4); }
    } else {
      setBac(it, Math.max(2, it.bac - 1)); it.box = 0; it.due = addDays(t, 1);
    }
  }
  const s = sessRec(); s.total++; if (ok) s.correct++; if (up) s.up++;
  save();
  return up;
}
function sessRec() { const t = today(); return P.sessions[t] = P.sessions[t] || { neu: 0, on: 0, total: 0, correct: 0, up: 0, done: false, game: null }; }

/* ================== Câu hỏi ================== */
function distractors(item, field, n, sameGroup) {
  const base = BANK.filter(x => x.id !== item.id && x[field] && x[field] !== item[field]);
  const near = (item.de_nham_voi || '').split(',').map(s => s.trim()).filter(Boolean).map(i => BYID[i]).filter(x => x && x[field] && x[field] !== item[field]);
  let tiers;
  if (sameGroup) tiers = [near, base.filter(x => x.nhom === item.nhom), base.filter(x => x.loai === item.loai), base];
  else tiers = [base.filter(x => x.nhom !== item.nhom), base];
  const out = [], seen = new Set([item[field]]);
  for (const t of tiers) for (const x of shuffle(t)) { if (out.length >= n) break; if (!seen.has(x[field])) { seen.add(x[field]); out.push(x[field]); } }
  return out;
}
function makeQuiz(item, level) {
  const nOpt = level === 2 ? 1 : 3, same = level >= 3;
  let kinds = ['neu2thi', 'thi2ten'];
  if (item.chuoi && level >= 3) kinds.push('gap');
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  if (kind === 'gap') {
    const steps = item.chuoi.split('→').map(s => s.trim());
    if (steps.length >= 3) {
      const k = 1 + Math.floor(Math.random() * (steps.length - 2));
      const ans = steps[k];
      const pool = shuffle(BANK.filter(x => x.chuoi && x.id !== item.id).flatMap(x => x.chuoi.split('→').map(s => s.trim()))).filter(s => s !== ans);
      const opts = shuffle([ans, ...[...new Set(pool)].slice(0, nOpt)]);
      return { id: item.id, level, kind, label: 'Điền mắt xích còn thiếu', prompt: steps.map((s, i) => i === k ? '▢ ?' : s).join(' → '), opts, ans };
    }
  }
  if (level >= 3 && item.truoc && BYID[item.truoc] && bacOf(item.truoc) >= 2 && Math.random() < 0.4) {
    const prev = BYID[item.truoc];
    const same = BANK.filter(x => x.id !== item.id && x.id !== prev.id && x.chuoi_hoc === item.chuoi_hoc).map(x => x.ten);
    const other = distractors(item, 'ten', 3, true);
    const pool = [...new Set([...shuffle(same), ...other])].filter(t => t !== item.ten).slice(0, nOpt);
    if (pool.length === nOpt) return { id: item.id, level, kind: 'next', label: `Chuỗi «${item.chuoi_hoc}»: bước tiếp theo là gì?`, prompt: `Sau «${prev.ten}» là …`, opts: shuffle([item.ten, ...pool]), ans: item.ten };
  }
  if (kind === 'thi2ten') {
    const opts = shuffle([item.ten, ...distractors(item, 'ten', nOpt, same)]);
    return { id: item.id, level, kind, label: 'Hệ quả / cách làm này thuộc mục nào?', prompt: item.thi, opts, ans: item.ten };
  }
  const opts = shuffle([item.thi, ...distractors(item, 'thi', nOpt, same)]);
  return { id: item.id, level, kind: 'neu2thi', label: 'NẾU … thì sao?', prompt: item.neu, sub: item.ten, opts, ans: item.thi };
}
/* Bài "xếp lại chuỗi": lấy 3–5 mục liền nhau đã học của một chuỗi */
function makeOrder() {
  const chains = {};
  BANK.forEach(x => { if (x.kieu_hoc === 'chuoi' && x.chuoi_hoc && bacOf(x.id) >= 2) (chains[x.chuoi_hoc] = chains[x.chuoi_hoc] || []).push(x); });
  const ok = Object.entries(chains).filter(([, v]) => v.length >= 3);
  if (!ok.length) return null;
  const [name, its] = ok[Math.floor(Math.random() * ok.length)];
  its.sort((a, b) => a.buoc - b.buoc);
  const st = Math.floor(Math.random() * Math.max(1, its.length - 4));
  const ids = its.slice(st, st + 5).map(x => x.id);
  let shown = shuffle(ids); if (shown.join() === ids.join()) shown = shown.reverse();
  return { t: 'order', id: ids[0], chain: name, ids, shown, picked: [] };
}
function keywordScore(answer, ref) {
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9\s]/g, ' ');
  const STOP = new Set(['va','la','cua','cho','de','thi','khi','neu','cac','mot','nhung','duoc','voi','trong','nay','do','co','khong','hon','ra','vao','theo','tu','den','nguoi','lai','se','bi','hay','hoac','con','rat','van','cung']);
  const refW = [...new Set(norm(ref).split(/\s+/).filter(w => w.length >= 2 && !STOP.has(w)))];
  if (!refW.length) return 0;
  const a = ' ' + norm(answer) + ' ';
  return Math.round(100 * refW.filter(w => a.includes(' ' + w + ' ')).length / refW.length);
}

/* ================== Phiên tập ================== */
function startSession(mode) {
  if (mode === 'rest') { S = { mode, phase: 'rest', th: TH.length ? TH[Math.floor(Math.random() * TH.length)] : null, reveal: false }; render(); return; }
  if (mode === 'test') {
    const items = shuffle(BANK.filter(x => bacOf(x.id) >= 2)).slice(0, 30);
    S = { mode, phase: 'test', phases: ['test'], start: Date.now(), limit: 15, queue: items.map(x => taskFor(x.id)), cur: null, stat: { ok: 0, n: 0, up: [] } };
    const ord = makeOrder(); if (ord) S.queue.splice(Math.min(5, S.queue.length), 0, ord);
    if (!items.length) { S.cur = { t: 'info', msg: 'Chưa có mục nào ở bậc 2 trở lên để kiểm tra. Hãy học vài buổi trong tuần trước.' }; render(); startTimer(); return; }
    nextTask(); startTimer(); return;
  }
  S = { mode, phases: ['new', 'review', 'practice'], phase: null, start: 0, limit: PHASE_MIN, queue: [], cur: null, stat: { ok: 0, n: 0, up: [], neu: [] } };
  enterPhase('new');
}
function taskFor(id) { const b = bacOf(id); if (b <= 2) return { t: 'quiz', id, level: 2 }; if (b === 3) return { t: 'quiz', id, level: 3 }; if (b === 4) return { t: 'type', id }; return { t: 'quiz', id, level: 5 }; }
function enterPhase(ph) {
  S.phase = ph; S.start = Date.now(); S.timeUpShown = false; S.cur = null;
  if (ph === 'new') {
    const brake = dueList().length > 40;
    const nt = brake ? [] : newToday();
    S.brake = brake;
    S.queue = [];
    nt.forEach(x => { S.queue.push({ t: 'card', id: x.id }); });
    nt.forEach(x => { S.queue.push({ t: 'quiz', id: x.id, level: 2 }); });
    S.newIds = nt.map(x => x.id);
    if (!nt.length) { S.cur = { t: 'info', msg: brake ? `Phanh bật: có ${dueList().length} thẻ cần ôn (> 40). Hôm nay chỉ ôn, không học mới.` : 'Không có mục mới hôm nay (đã học hết mục của tuần, hoặc đang là tuần củng cố).' }; render(); startTimer(); return; }
  }
  if (ph === 'review') {
    const t = today();
    S.queue = dueList().sort((a, b) => (P.items[a.id].due).localeCompare(P.items[b.id].due)).map(x => taskFor(x.id));
    if (!S.queue.length) { S.cur = { t: 'info', msg: 'Không có thẻ đến hạn ôn hôm nay. Tốt!' }; render(); startTimer(); return; }
  }
  if (ph === 'practice') {
    if (gameUnlocked()) { S.cur = { t: 'gameintro' }; render(); startTimer(); return; }
    const t = today();
    const pool = shuffle(BANK.filter(x => { const it = P.items[x.id]; return it && it.bac >= 2 && it.bac <= 4 && it.tries[it.bac] !== t; })).slice(0, 8);
    S.queue = pool.map(x => Object.assign(taskFor(x.id), { practice: true }));
    const ord = makeOrder(); if (ord) S.queue.push(ord);
    if (!S.queue.length) { S.cur = { t: 'info', msg: 'Chưa có mục nào cần đẩy bậc lúc này (mọi mục ở bậc 2–4 đã được hỏi hôm nay).' }; render(); startTimer(); return; }
  }
  nextTask(); startTimer();
}
function nextTask() {
  S.cur = S.queue.shift() || null;
  if (S.cur && S.cur.t === 'quiz') S.cur.q = makeQuiz(BYID[S.cur.id], S.cur.level);
  if (!S.cur) { finishPhase(); return; }
  render();
}
function finishPhase() {
  const i = S.phases.indexOf(S.phase);
  if (S.mode !== 'test' && i >= 0 && i < S.phases.length - 1) { enterPhase(S.phases[i + 1]); return; }
  endSession();
}
function endSession() {
  stopTimer();
  const rec = sessRec(); rec.done = true; save();

  render();

/* ================== Trò NẾU–THÌ 60 giây ================== */
function startGame(real, from) {
  const pool = real ? BANK.filter(x => bacOf(x.id) >= 5) : BANK.filter(x => bacOf(x.id) >= 1 || x.tuan <= curWeek());
  if (pool.length < 4) { toast('Cần ít nhất 4 mục để chơi.'); return; }
  if (from === 'academy') TAB = 'today';
  G = { from: from || 'session', real, pool, total: 60000, t0: Date.now(), limit: real ? P.game.limitMs : 8000, n: 0, ok: 0, wrong: [], win: [], q: null, qStart: 0, raf: 0, over: false };
  nextGameQ(); render(); loopGame();
}
function nextGameQ() {
  const x = G.pool[Math.floor(Math.random() * G.pool.length)];
  G.q = makeQuiz(x, 3); G.q.id = x.id; G.qStart = Date.now(); G.answered = false;
}
function loopGame() {
  cancelAnimationFrame(G.raf);
  const step = () => {
    if (!G || G.over) return;
    const now = Date.now(), tl = Math.max(0, G.total - (now - G.t0)), ql = Math.max(0, G.limit - (now - G.qStart));
    const a = document.getElementById('gt'), b = document.getElementById('qt');
    if (a) a.style.width = (100 * tl / G.total) + '%'; if (b) b.style.width = (100 * ql / G.limit) + '%';
    const c = document.getElementById('gsec'); if (c) c.textContent = Math.ceil(tl / 1000);
    if (tl <= 0) { endGame(); return; }
    if (ql <= 0 && !G.answered) { gameAnswer(-1); return; }
    G.raf = requestAnimationFrame(step);
  };
  G.raf = requestAnimationFrame(step);
}
function gameAnswer(i) {
  if (!G || G.answered || G.over) return;
  G.answered = true;
  const ok = i >= 0 && G.q.opts[i] === G.q.ans;
  G.n++; if (ok) G.ok++; else G.wrong.push(G.q.id);
  G.win.push(ok ? 1 : 0);
  if (G.real) { const it = prog(G.q.id); it.game = it.game || []; it.game.push(ok ? 1 : 0); if (it.game.length > 20) it.game.shift(); if (!ok) { it.due = addDays(today(), 1); } }
  if (G.win.length >= 10) {
    const acc = G.win.reduce((s, v) => s + v, 0) / G.win.length;
    if (acc < 0.9) G.limit = Math.min(15000, G.limit + 1000); else if (acc > 0.95) G.limit = Math.max(3000, G.limit - 1000);
    G.win = [];
  }
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, k) => { b.disabled = true; if (G.q.opts[k] === G.q.ans) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
  setTimeout(() => { if (!G || G.over) return; nextGameQ(); render(); loopGame(); }, ok ? 350 : 1100);
}
function endGame() {
  G.over = true; cancelAnimationFrame(G.raf);
  if (G.real) { P.game.limitMs = G.limit; P.game.rounds.push([today(), G.n, G.ok]); const s = sessRec(); s.game = [G.n, G.ok]; s.total += G.n; s.correct += G.ok; save(); if (S && G.from === 'session' && S.stat) { S.stat.n += G.n; S.stat.ok += G.ok; } }
  render();
}
function viewGame() {
  if (G.over) {
    const pct = G.n ? Math.round(100 * G.ok / G.n) : 0;
    const wr = [...new Set(G.wrong)].map(id => `<div>• ${esc(BYID[id].ten)}</div>`).join('');

      ${pct >= 90 ? '<div class="ok">Giữ ≥ 90%: phản xạ vững.</div>' : '<div class="warn">Dưới 90%: các mục sai được đưa vào hàng ôn ngày mai.</div>'}</div>

    <div class="card"><div class="qlabel">${esc(q.label)}</div><div class="q">${q.kind === 'neu2thi' ? 'Nếu ' + esc(lc1(q.prompt)) : esc(q.prompt)}</div>

/* ================== Đọc file .xlsx (không thư viện) ================== */
async function inflateRaw(u8) {
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf) {

  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Không phải file .xlsx hợp lệ');
  const n = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder();
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    const lnl = dv.getUint16(lo + 26, true), lxl = dv.getUint16(lo + 28, true);
    const data = u8.subarray(lo + 30 + lnl + lxl, lo + 30 + lnl + lxl + csize);
    files[name] = { method, data };
    p += 46 + nl + xl + cl;
  }
  return { async text(name) { const f = files[name]; if (!f) return null; const raw = f.method === 0 ? f.data : await inflateRaw(f.data); return td.decode(raw); }, has: n => !!files[n] };
}
function colIdx(ref) { let n = 0; for (const ch of ref.replace(/[0-9]/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; }
async function readXlsx(buf) {
  const z = await unzip(buf), dp = new DOMParser();
  const xml = async n => { const t = await z.text(n); return t ? dp.parseFromString(t, 'application/xml') : null; };
  const wb = await xml('xl/workbook.xml'), rels = await xml('xl/_rels/workbook.xml.rels');
  const ss = await xml('xl/sharedStrings.xml');
  const shared = ss ? [...ss.getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  const relMap = {}; [...rels.getElementsByTagName('Relationship')].forEach(r => relMap[r.getAttribute('Id')] = r.getAttribute('Target'));
  const out = {};
  for (const sh of [...wb.getElementsByTagName('sheet')]) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = relMap[rid] || ''; target = target.replace(/^\//, ''); if (!target.startsWith('xl/')) target = 'xl/' + target;
    const doc = await xml(target); if (!doc) continue;
    const rows = [];
    for (const r of [...doc.getElementsByTagName('row')]) {
      const arr = [];
      for (const c of [...r.getElementsByTagName('c')]) {
        const t = c.getAttribute('t'), ref = c.getAttribute('r'); let v = '';
        if (t === 'inlineStr') v = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else { const ve = c.getElementsByTagName('v')[0]; v = ve ? ve.textContent : ''; if (t === 's') v = shared[Number(v)] ?? ''; }
        arr[ref ? colIdx(ref) : arr.length] = v;

    }

  }

}
function rowsToObjects(rows) {
  if (!rows || !rows.length) return [];
  const hdr = rows[0].map(h => String(h || '').trim());
  return rows.slice(1).filter(r => r && r.some(v => v !== '' && v != null)).map(r => { const o = {}; hdr.forEach((h, i) => { if (h) o[h] = r[i] == null ? '' : r[i]; }); return o; });
}
async function importData(file) {
  const msg = document.getElementById('importMsg');
  try {
    let data;
    if (file.name.toLowerCase().endsWith('.json')) {
      const j = JSON.parse(await file.text()); data = Array.isArray(j) ? { muc: j } : j;
    } else {
      const sheets = await readXlsx(await file.arrayBuffer());
      const muc = rowsToObjects(sheets.muc || sheets.Muc || sheets[Object.keys(sheets).find(k => /muc/i.test(k))]);
      const th = rowsToObjects(sheets.tinh_huong || []);
      data = { muc, tinh_huong: th };
    }
    const items = (data.muc || []).map(normItem).filter(x => x.id && x.ten && x.neu && x.thi);
    const ids = new Set(); const dup = items.filter(x => ids.has(x.id) || !ids.add(x.id)).map(x => x.id);
    if (!items.length) throw new Error('Không tìm thấy dòng hợp lệ trong sheet "muc" (cần cột id, ten, neu, thi).');
    if (dup.length) throw new Error('Trùng id: ' + dup.slice(0, 5).join(', '));
    const ok = store.set(KEY_DATA, { ten: file.name, muc: items, tinh_huong: data.tinh_huong || [], tai_lieu: data.tai_lieu || [] });
    loadBank(); render();
    toast(`Đã nạp ${items.length} mục từ ${file.name}${ok ? '' : ' (chỉ trong phiên này: trình duyệt chặn lưu)'}`);
  } catch (e) { if (msg) msg.innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
}

/* ================== Sự kiện ================== */
document.addEventListener('click', e => {
  const tabB = e.target.closest('[data-tab]'); if (tabB) { if (G && !G.over) { G.over = true; cancelAnimationFrame(G.raf); G = null; } go(tabB.dataset.tab); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a) {
    case 'theme': { const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = cur; store.set(KEY_THEME, cur); break; }
    case 'start': startSession(b.dataset.mode); break;
    case 'understood': understood(); break;
    case 'answer': answer(Number(b.dataset.i)); break;
    case 'next': nextTask(); break;
    case 'ordpick': { const c = S.cur; c.picked.push(b.dataset.id); if (c.picked.length === c.ids.length) { const ok = c.picked.every((id, k) => id === c.ids[k]); S.stat.n++; if (ok) S.stat.ok++; const r = sessRec(); r.total++; if (ok) r.correct++; save(); } render(); break; }
    case 'ordundo': S.cur.picked.pop(); render(); break;
    case 'reveal': reveal(); break;
    case 'selfgrade': selfgrade(b.dataset.ok === '1'); break;
    case 'skipphase': if (S) { if (S.cur && S.cur.t === 'gameintro') { finishPhase(); } else finishPhase(); } break;
    case 'gamestart': startGame(b.dataset.real === '1', TAB === 'academy' ? 'academy' : 'session'); break;
    case 'ganswer': gameAnswer(Number(b.dataset.i)); break;
    case 'gameexit': { const from = G && G.from; G = null; if (from === 'academy') { TAB = 'academy'; render(); } else if (S) endSession(); else render(); break; }
    case 'exit': S = null; stopTimer(); render(); break;
    case 'restreveal': S.reveal = true; render(); break;
    case 'restnext': S.th = TH[Math.floor(Math.random() * TH.length)]; S.reveal = false; render(); break;
    case 'peek': ACAD_PEEK = b.dataset.id; render(); break;
    case 'ct': CT_STACK = []; openCt(b.dataset.id); break;
    case 'ctgo': openCt(b.dataset.id); break;
    case 'ctback': CT_STACK.pop(); openCt(CT_STACK.pop()); break;
    case 'ctclose': closeCt(); break;
    case 'profnew': { const n = prompt('Tên hồ sơ mới:'); if (n && n.trim()) { const id = 'p' + Date.now().toString(36); PROFILES.list.push({ id, name: n.trim() }); PROFILES.current = id; store.set(KEY_PROFILES, PROFILES); store.set(pkey(id), newProgress(n.trim())); loadProfiles(); S = null; render(); } break; }
    case 'profren': { const n = prompt('Tên mới:', curProfile().name); if (n && n.trim()) { curProfile().name = n.trim(); P.name = n.trim(); store.set(KEY_PROFILES, PROFILES); save(); render(); } break; }
    case 'profdel': { if (PROFILES.list.length < 2) { toast('Cần giữ ít nhất 1 hồ sơ.'); break; } if (confirm('Xoá hồ sơ "' + curProfile().name + '" và toàn bộ tiến độ?')) { store.del(pkey(PROFILES.current)); PROFILES.list = PROFILES.list.filter(p => p.id !== PROFILES.current); PROFILES.current = PROFILES.list[0].id; store.set(KEY_PROFILES, PROFILES); loadProfiles(); S = null; render(); } break; }
    case 'weekstart': P.startMonday = mondayOf(today()); save(); render(); toast('Tuần 1 bắt đầu từ thứ Hai tuần này.'); break;
    case 'datareset': store.del(KEY_DATA); loadBank(); render(); toast('Đã về dữ liệu nhúng sẵn.'); break;
    case 'progexport': {
      const blob = new Blob([JSON.stringify({ app: 'MindGym', v: 1, profile: curProfile().name, data: P }, null, 1)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = url; l.download = `mindgym_tien-do_${curProfile().name}_${today()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); break; }
    case 'progreset': if (confirm('Xoá toàn bộ tiến độ của hồ sơ này?')) { P = newProgress(curProfile().name); save(); S = null; render(); } break;
    case 'dayplus': P.offset = (P.offset || 0) + 1; save(); S = null; render(); toast('Đã giả lập sang ngày mới.'); break;
    case 'dayzero': P.offset = 0; save(); S = null; render(); break;
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'profSel') { PROFILES.current = t.value; store.set(KEY_PROFILES, PROFILES); loadProfiles(); S = null; render(); }
  else if (t.id === 'startMon' && t.value) { P.startMonday = mondayOf(t.value); save(); render(); }
  else if (t.id === 'dayOv') { P.dayOverride = t.value === '' ? null : Number(t.value); save(); S = null; render(); }
  else if (t.id === 'bw') { BOOK_W = t.value; render(); }
  else if (t.id === 'bct') { BOOK_CT = t.value; render(); }
  else if (t.id === 'fileData' && t.files[0]) { await importData(t.files[0]); }
  else if (t.id === 'fileProg' && t.files[0]) {
    try { const j = JSON.parse(await t.files[0].text()); const d = j.data || j; if (!d.items) throw new Error('File không đúng định dạng tiến độ MindGym'); P = Object.assign(newProgress(curProfile().name), d); save(); render(); toast('Đã nhập tiến độ.'); }
    catch (err) { toast('Lỗi: ' + err.message); }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'bq') { BOOK_Q = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#bq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } } });
document.addEventListener('keydown', e => {
  if (CT_STACK.length) { if (e.key === 'Escape') { e.preventDefault(); closeCt(); } return; }
  if (TAB !== 'today') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (G && !G.over) { const k = '1234'.indexOf(e.key); if (k >= 0) { e.preventDefault(); gameAnswer(k); } return; }
  if (!S || !S.cur) return;
  const c = S.cur;
  if (tag === 'textarea') { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (c.t === 'type' && !c.revealed) reveal(); else if (c.t === 'card') understood(); } return; }
  if (c.t === 'quiz') {
    if (c.answered == null) { const k = '1234'.indexOf(e.key); const k2 = 'abcd'.indexOf(e.key.toLowerCase()); const i = k >= 0 ? k : k2; if (i >= 0 && i < c.q.opts.length) { e.preventDefault(); answer(i); } }
    else if (e.key === 'Enter') { e.preventDefault(); nextTask(); }
  } else if (c.t === 'card' && e.key === 'Enter') { e.preventDefault(); understood(); }
  else if (c.t === 'type' && c.revealed) { if (e.key === '1') selfgrade(true); if (e.key === '2') selfgrade(false); }
  else if (c.t === 'info' && e.key === 'Enter') { e.preventDefault(); finishPhase(); }
  else if (c.t === 'order' && c.picked.length === c.ids.length && e.key === 'Enter') { e.preventDefault(); nextTask(); }
});

/* ================== Khởi động ================== */
(function init() {
  let th = store.get(KEY_THEME, null);
  if (!th) { try { th = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { th = 'dark'; } }
  document.documentElement.dataset.theme = th;
  loadBank(); loadProfiles(); render();
})();
</script>

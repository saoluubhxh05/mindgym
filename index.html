<title>MindGym v1.1 – Chi tiết</title>
<!--
  MindGym v1.1 – Khung CHI TIẾT dùng chung (31/10/2026)
  - Nhúng sẵn toàn bộ kho NL tổng hợp v2 (414 mục) + nội dung chi tiết đã soạn; công cụ Soạn chi tiết tự nhúng lại
    mỗi lần "Dựng lại v2" (soan_chi_tiet/nhung_app.py), không cần nhập file.
  - Nút "📖 Chi tiết" ở thẻ học (bậc 1), sau khi trả lời / so bản chuẩn, ô xem nhanh trong Học viện và Sổ tay.
  - Khung 16 phần: Tóm tắt · Nguồn gốc · Cơ chế · Mức bằng chứng A–D · Quy trình · Ví dụ giải mẫu · Biến thể · Giới hạn ·
    Sai lầm hay gặp · Nhận diện & phòng vệ · Tự kiểm tra (ẩn đáp án) · Phân biệt · Vị trí trong chuỗi · Tài liệu · Ghi chú.
  - Mục liên quan (trước/sau/thuộc/gồm/dễ nhầm) bấm được, có nút Quay lại; phím Esc đóng.
  - Sổ tay: lọc "chỉ mục có chi tiết", tìm cả trong nội dung chi tiết; Học viện: ô có chấm = đã có chi tiết.
  - Dữ liệu đã nhập từ trước (thiếu chi tiết) vẫn dùng được: chi tiết được ghép theo id từ dữ liệu nhúng.
  - Giữ nguyên khoá lưu tiến độ của v1.0 → tiến độ cũ dùng tiếp.

  MindGym v1.0 – Học viện Chiến lược (chế độ NL) · bản thử "Nền móng tuần 1"
  Changelog (28/10/2026):
  - Bản đầu tiên, một file, chạy không cần mạng (không tải thư viện ngoài).
  - Lõi học: 5 bậc thuộc (Làm quen → Nhận ra → Phân biệt → Nhớ ra → Phản xạ), ôn ngắt quãng Leitner 1–2–4–7–15 ngày.
  - Buổi 15 phút: T2–T6 học mới 4 mục cùng nhóm · ôn thẻ đến hạn · luyện; T7 kiểm tra trộn; CN nghỉ + 1 tình huống nhẹ.
  - Hai phanh: thẻ cần ôn > 40 thì dừng học mới; NẾU–THÌ 60 giây chỉ mở từ tuần 2 khi ≥ 10 mục đạt bậc 5.
  - Dữ liệu nhúng sẵn: tuần 1 (18 mục ưu tiên cao nhất: 10 khung tư duy, 4 QL kinh tế, 4 QL lãnh đạo) + 20 tình huống.
  - Thứ tự học theo độ ưu tiên (phổ biến + quan trọng + hay dùng); mỗi ngày 3–5 mục cùng nhóm.
  - Sắp xếp kết hợp: B chuỗi quy trình (câu hỏi "bước tiếp theo?", bài "xếp lại chuỗi"), A cây gốc – cành (thẻ hiện "Thuộc"/"Gồm"),
    C cặp đối chiếu (thẻ hiện "Dễ nhầm với", nhiễu bậc 3 lấy từ cặp, sai thì hiện chỗ khác nhau). Nhập thêm mindgym_data_NL_tong-hop_v1.xlsx/.json.
  - Nhiều hồ sơ trên một máy; xuất/nhập tiến độ .json; giao diện tối/sáng; phím tắt 1–4, Enter, Space.
  - Trò Phòng cấp cứu 90 giây (tuần 7) và Domino (tuần 16) mới hiện thẻ khoá, chưa chơi được.
-->
<style>
:root{
  --bg:#0f1724;--panel:#172235;--panel2:#1d2b42;--line:#2a3b57;--text:#e8eef7;--muted:#9fb0c8;
  --accent:#3fc1b0;--accent-ink:#06231f;--good:#47c47a;--bad:#ef6b6b;--warn:#f0b54a;
  --b0:#4a5870;--b1:#64748b;--b2:#4f8fe6;--b3:#9a7cf0;--b4:#e8a33d;--b5:#3fbf7f;
  --radius:14px;--shadow:0 6px 20px rgba(0,0,0,.25);
}
:root[data-theme="light"]{
  --bg:#f4f6fa;--panel:#ffffff;--panel2:#eef2f8;--line:#d7deea;--text:#16202f;--muted:#5b6b82;
  --accent:#0f8f80;--accent-ink:#ffffff;--good:#1f9d55;--bad:#d64545;--warn:#b7791f;
  --b0:#c3ccd9;--b1:#94a3b8;--b2:#3b7dd8;--b3:#7c5cd6;--b4:#d28a1e;--b5:#22a06b;
  --shadow:0 4px 14px rgba(20,30,50,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.logo{font-weight:800;letter-spacing:.2px}
.logo b{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.sp{flex:1}
.iconbtn{font-size:22px;line-height:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer}
main{padding:16px 0 96px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:6}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px}
nav.tabs button{background:none;border:0;border-radius:10px;min-height:52px;cursor:pointer;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--accent);background:var(--panel2);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 8px;font-size:20px}
.card h3{margin:0 0 8px;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:12px;padding:10px 12px}
.stat .n{font-size:24px;font-weight:800}
.stat .l{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.pill.acc{color:var(--accent);border-color:var(--accent)}
.plan{list-style:none;margin:8px 0 0;padding:0}
.plan li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .t{min-width:44px;font-weight:700;color:var(--accent)}
.warn{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);padding:10px 12px;border-radius:8px;margin:10px 0}
.ok{border-left:4px solid var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);padding:10px 12px;border-radius:8px;margin:10px 0}
.err{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);padding:10px 12px;border-radius:8px;margin:10px 0}
/* session */
.phasebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phasebar .steps{display:flex;gap:6px;flex:1}
.phasebar .st{flex:1;height:6px;border-radius:6px;background:var(--line)}
.phasebar .st.on{background:var(--accent)}
.phasebar .st.done{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.clock{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px;text-align:right}
.clock.over{color:var(--warn)}
.flash{font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.face{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.face .k{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.face .v{margin-top:2px}
.title{font-size:21px;font-weight:800;line-height:1.3}
.origin{font-size:13px;color:var(--muted);margin-top:2px}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.qlabel{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.opt .key{flex:0 0 26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel2))}
.opt:disabled{cursor:default}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:96px;resize:vertical}
.bacbar{display:flex;gap:4px;margin:8px 0}
.bacbar span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:9px;font-size:13px;font-weight:700;color:#fff;margin:0 6px 6px 0;cursor:pointer;border:0}
.b0{background:var(--b0)}.b1{background:var(--b1)}.b2{background:var(--b2)}.b3{background:var(--b3)}.b4{background:var(--b4)}.b5{background:var(--b5)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl tr.cur td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.lock{opacity:.6}
.hl{color:var(--accent);font-weight:700}
.timer{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer.total i{background:var(--warn)}
.big{font-size:40px;font-weight:800}
details summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:32px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.center{text-align:center}
.mt{margin-top:12px}
.hidden{display:none}
.ctx{font-size:13px;color:var(--muted);margin-bottom:4px}
.ordlist{display:grid;gap:8px}
.ordpick{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:12px;margin:8px 0}
.ordpick .chipx,.ordlist .chipx{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:left}
.ordpick .chipx{background:color-mix(in srgb,var(--accent) 18%,var(--panel2))}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;font-size:14px;max-width:90vw}
.ctov{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ctov .bar{position:sticky;top:0;z-index:1;background:var(--bg);border-bottom:1px solid var(--line)}
.ctov .bar .wrap{display:flex;align-items:center;gap:8px;min-height:56px}
.ctov .bar .t{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctov .body{padding-bottom:40px}
.ctsec{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.ctsec h4{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.ctsec p{margin:6px 0;line-height:1.6}
.ctsec ol,.ctsec ul{margin:6px 0;padding-left:22px;line-height:1.6}
.ctsec li{margin:4px 0}
.ev{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:8px;font-weight:800;margin-right:8px;color:#fff}
.ev.A{background:#1f9d55}.ev.B{background:#2f7fd6}.ev.C{background:#b7791f}.ev.D{background:#7a5bd6}
.lnk{display:inline-block;margin:3px 6px 3px 0;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:14px;min-height:36px}
.lnk:hover{border-color:var(--accent)}
.lnk.no{opacity:.6;cursor:default}
.ctq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.ctq summary{font-weight:600;color:var(--text)}
.ctq .a{margin-top:6px;color:var(--good)}
.ctbtn{min-height:44px;margin-top:10px}
.chip.hasct{box-shadow:inset 0 -4px 0 var(--accent)}
.ctnote{font-size:13px;color:var(--muted)}
@media (max-width:420px){.title{font-size:19px}.q{font-size:17px}}
</style>
</head>

<script>
const EMBED = {"ten":"Kho NL tổng hợp v2 (109/414 mục có chi tiết, 2026-10-31)","muc":[{"id":"KHUNG-05","thu_tu":1,"tuan":1,"ngay":1,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":14,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Chẩn đoán","ten":"5W1H","ten_goc":"5W1H (Kipling, \"six honest serving-men\"); dùng trong quản lý chất lượng","neu":"Cần mô tả đủ một vấn đề trước khi phân tích","thi":"Hỏi Ai · Cái gì · Ở đâu · Khi nào · Vì sao · Như thế nào; ghi dữ kiện, chưa phán xét","vi_du":"Doanh số giảm: Ai mua ít đi? Sản phẩm nào? Khu vực nào? Từ tuần nào? Thấy lý do gì? Giảm ra sao?","gioi_han":"Chỉ là khung thu thập dữ kiện, không tự tìm ra nguyên nhân gốc; câu Vì sao ở đây chỉ là sơ bộ.","tu_khoa":"mô tả vấn đề, dữ kiện, ai, khi nào, ở đâu","de_nham_voi":"KHUNG-06,KHUNG-10","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":1,"sau":"KHUNG-07","cap_doi":"KHUNG-10","khac_nhau":"5W1H mô tả hiện trạng; SWOT đánh giá vị thế để chọn chiến lược","ct_nguon_goc":"Tu từ học cổ điển (Hermagoras, Cicero) đã dạy rằng muốn hiểu một sự việc phải xác định đủ các \"tình tiết\": ai, làm gì, ở đâu, khi nào, vì sao, bằng cách nào. Tên gọi quen thuộc gắn với bài thơ \"sáu người hầu trung thực\" của Kipling (1902). Báo chí dùng 5W làm chuẩn cho đoạn mở đầu bản tin; quản lý chất lượng (kaizen, 8D) dùng 5W1H hoặc 5W2H ở bước mô tả vấn đề. Bản nâng cao là phân tích Là / Không là của Kepner & Tregoe (1965).","ct_co_che":"Não có xu hướng dựng ngay một câu chuyện từ những gì đang thấy và bỏ qua những gì chưa biết (Kahneman gọi là WYSIATI). Sáu câu hỏi buộc ta nhìn ra các ô còn trống trước khi kết luận. Khung này cũng tách mô tả khỏi phán xét: khi chưa được đoán nguyên nhân, nhóm ít đổ lỗi và ít cãi nhau hơn. Cột \"Không là\" thu hẹp không gian nguyên nhân: nếu vấn đề chỉ xảy ra ở một nơi, nguyên nhân khó nằm ở yếu tố chung cho mọi nơi.","ct_bang_chung":"C – Khung thực hành được dùng rộng rãi trong quản lý chất lượng và báo chí; ít nghiên cứu thực nghiệm đo riêng hiệu quả, nhưng cơ chế chống kết luận vội có cơ sở từ nghiên cứu thiên kiến nhận thức.","ct_quy_trinh":"Viết câu vấn đề ban đầu đúng như đang nghĩ || Trả lời lần lượt 6 câu bằng dữ kiện đo được và ghi nguồn; chưa có thì ghi \"chưa biết\" || Thêm cột \"Không là\" cho Cái gì, Ở đâu, Khi nào, Ai || Câu Vì sao chỉ ghi lý do đã được nêu ra, đánh dấu là giả thuyết sơ bộ || Đi lấy dữ liệu cho các ô \"chưa biết\" || Viết lại câu vấn đề: cái gì, lệch bao nhiêu, ở đâu, từ khi nào, nhóm nào, nhưng không ở đâu || Đưa câu vấn đề này sang Sơ đồ xương cá","ct_vi_du_mau":"Tình huống: chuỗi 6 quán trà sữa báo \"doanh số giảm\". Bảng Là / Không là: Cái gì – trà sữa trân châu −22% / cà phê, nước ép vẫn giữ mức. Ở đâu – quán Q.3 và Q.10 / 4 quán còn lại. Khi nào – từ tuần 36, giảm đều / trước tuần 36 ổn định. Ai – khách đặt qua app giao hàng / khách mua tại quầy. Như thế nào – số đơn giảm, giá trị mỗi đơn không đổi. Vì sao (sơ bộ) – vài đánh giá 1 sao chê \"trân châu cứng\". Câu vấn đề viết lại: \"Từ tuần 36, số đơn online dòng trân châu ở Q.3 và Q.10 giảm 22%; đơn tại quầy và các quán khác không giảm.\" Kết quả: giả thuyết \"kinh tế khó khăn\" gần như bị loại; hướng tìm tiếp là những gì Q.3 và Q.10 cùng thay đổi quanh tuần 36 (lô trân châu, ca nhân viên, thời gian giao).","ct_bien_the":"5W2H thêm Bao nhiêu (quy mô, chi phí). Is / Is-not của Kepner–Tregoe là bản mạnh nhất cho chẩn đoán. 5W1H còn dùng để lập kế hoạch hành động: ai làm, làm gì, ở đâu, hạn khi nào, vì sao, làm thế nào.","ct_gioi_han":"Chỉ là khung thu thập dữ kiện, không tự tìm ra nguyên nhân gốc. Kết quả phụ thuộc chất lượng dữ liệu: trả lời mơ hồ (\"dạo này\", \"khách\") làm khung mất tác dụng. Không sắp thứ tự ưu tiên, việc đó cần Pareto. Khi khủng hoảng cần hành động ngay, hãy ổn định tình hình trước rồi mới mô tả kỹ.","ct_sai_lam":"Biến câu Ai thành \"lỗi của ai\"; nên hỏi ai bị ảnh hưởng, ai liên quan || Điền giả định thay cho dữ kiện || Bỏ qua cột Không là, mất công cụ loại trừ mạnh nhất || Dừng ở bảng mà không viết lại câu vấn đề","ct_tu_kiem_tra":"Vì sao cột Không là giúp loại nguyên nhân? ⇒ Nguyên nhân thật phải giải thích được vì sao vấn đề xảy ra ở chỗ này mà không xảy ra ở chỗ kia. || \"Nhân viên lười\" có nên ghi vào 5W1H không? ⇒ Không; đó là phán xét/giả thuyết, chưa phải dữ kiện. || Câu vấn đề tốt cần những thành phần nào? ⇒ Cái gì, lệch bao nhiêu, ở đâu, từ khi nào, ở nhóm nào, và không ở đâu.","ct_tai_lieu":"TL006,TL001,TL008,TL187"},{"id":"KHUNG-07","thu_tu":2,"tuan":1,"ngay":1,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"khung","nhom":"Khung – Chẩn đoán","ten":"Sơ đồ xương cá (6M + 8P)","ten_goc":"Ishikawa diagram – Kaoru Ishikawa","neu":"Vấn đề có nhiều nguyên nhân tiềm ẩn, sợ bỏ sót","thi":"Xếp nguyên nhân vào các nhánh: 6M cho vận hành, 8P cho kinh doanh; rồi khoan 5 Whys ở nhánh nghi nhất","vi_du":"Đơn trễ: Man (thiếu người), Method (quy trình duyệt 3 cấp), Machine (máy in hỏng), Place (kho xa)…","gioi_han":"Là danh sách nguyên nhân có thể, chưa phải nguyên nhân thật; phải kiểm chứng bằng dữ liệu.","tu_khoa":"nhiều nguyên nhân, bỏ sót, nhánh, 6M, 8P","de_nham_voi":"KHUNG-06","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":2,"truoc":"KHUNG-05","sau":"KHUNG-03","cap_doi":"KHUNG-06","khac_nhau":"Xương cá quét rộng mọi nhánh nguyên nhân; 5 Whys khoan sâu một nhánh","ct_nguon_goc":"Do Kaoru Ishikawa, chuyên gia chất lượng Nhật Bản, phát triển; thường được nhắc là ông dùng ở nhà máy Kawasaki từ thập niên 1940, rồi phổ biến qua sách Guide to Quality Control (1976). Còn gọi là biểu đồ nhân quả, một trong \"7 công cụ chất lượng cơ bản\". Bộ 6M (Man, Machine, Method, Material, Measurement, Milieu) dùng cho vận hành; bộ 8P dùng cho dịch vụ, dựa trên marketing dịch vụ (Booms & Bitner mở rộng 4P thành 7P; Lovelock & Wirtz thêm Năng suất & chất lượng).","ct_co_che":"Người ta hay chộp nguyên nhân đầu tiên nghĩ ra (thiên kiến sẵn có, hiệu ứng neo). Các nhánh cố định buộc nhìn cả những vùng ít ai nghĩ tới, như Đo lường: \"hay là số liệu đo sai?\". Sơ đồ cũng cấu trúc hoá việc động não nhóm: mọi người đóng góp vào cùng một bản đồ, ít tranh luận vòng vo. Cách nhìn theo nhánh chuyển câu hỏi từ \"ai sai\" sang \"hệ thống nào sinh ra lỗi\".","ct_bang_chung":"C – Công cụ chuẩn trong quản lý chất lượng, được dạy rộng rãi; ít thử nghiệm đối chứng đo riêng hiệu quả. Giá trị chính là tính đầy đủ và minh bạch khi động não.","ct_quy_trinh":"Đầu cá là câu vấn đề đã làm sắc từ 5W1H || Chọn bộ nhánh: 6M cho vận hành, 8P cho kinh doanh, gộp 14 nhánh khi vấn đề có cả hai || Động não 5–10 phút cho từng nhánh, mỗi ý là một mệnh đề cụ thể || Với ý đáng ngờ, hỏi vì sao 1–2 lần để thêm xương con || Đối chiếu cột Không là của 5W1H, gạch nguyên nhân không giải thích được sự khác biệt || Khoanh 2–4 nguyên nhân nghi nhất, ghi cách kiểm chứng cho từng cái || Thu dữ liệu, xếp hạng bằng Pareto rồi khoan sâu bằng 5 Whys","ct_vi_du_mau":"Tiếp tình huống trà sữa. Đầu cá: \"Đơn online dòng trân châu ở Q.3 và Q.10 giảm 22% từ tuần 36.\" Material – đổi lô trân châu từ nhà cung cấp mới: giải thích được nếu 2 quán dùng chung lô → kiểm chứng phiếu nhập kho. Method – trân châu nấu sẵn để quá 4 giờ khi đơn online dồn → kiểm chứng nhật ký nấu. Place – app giao hàng đổi bán kính, giao lâu hơn → kiểm chứng thời gian giao trung bình. Man – nhân viên mới ca tối: chỉ đúng nếu cả 2 quán cùng có người mới. Price – đối thủ khuyến mãi: bị loại vì đơn tại quầy không giảm. Kết quả: từ 14 hướng còn 3 nguyên nhân (Material, Method, Place) cần kiểm chứng trước.","ct_bien_the":"4M (bản gốc: Man, Machine, Material, Method) cho vấn đề nhỏ. 4S (Surroundings, Suppliers, Systems, Skills) cho dịch vụ. CEDAC của Ryuji Fukuda: xương cá dán thẻ, cập nhật liên tục theo dữ liệu.","ct_gioi_han":"Sơ đồ chỉ liệt kê giả thuyết, chưa phải nguyên nhân thật; phải kiểm chứng bằng dữ liệu. Mô hình tuyến tính, không thể hiện tương tác hay vòng phản hồi giữa các nguyên nhân; với hệ thống phức tạp nên dùng thêm sơ đồ vòng nhân quả. Khi nhóm bị một người lấn át, sơ đồ phản ánh ý kiến chứ không phản ánh thực tế. Sơ đồ quá to thì mất tác dụng: cần thu hẹp đầu cá.","ct_sai_lam":"Viết giải pháp vào nhánh (\"cần đào tạo thêm\") thay vì nguyên nhân || Ý mơ hồ như \"thiếu trách nhiệm\", không kiểm chứng được || Biến nhánh Man thành nơi đổ lỗi || Vẽ xong rồi dừng, không kiểm chứng || Đầu cá mơ hồ vì bỏ qua bước 5W1H","ct_tu_kiem_tra":"\"Cần thêm nhân viên\" có đặt vào xương cá không? ⇒ Không, đó là giải pháp; nguyên nhân là \"thiếu người ở ca cao điểm\". || Nhánh nào hay bị quên nhất? ⇒ Đo lường: số liệu sai có thể tạo ra một \"vấn đề\" không có thật. || Xương cá khác 5 Whys thế nào? ⇒ Xương cá quét rộng mọi nhánh; 5 Whys khoan sâu một nhánh.","ct_tai_lieu":"TL007,TL008,TL185,TL186","ct_ghi_chu":"Mốc thập niên 1940 ở Kawasaki: các nguồn ghi năm khác nhau."},{"id":"KHUNG-03","thu_tu":3,"tuan":1,"ngay":1,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":15,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Nạp & quản lý","ten":"Nguyên lý Pareto 80/20","ten_goc":"Pareto principle – Vilfredo Pareto; Joseph Juran đặt tên \"số ít then chốt\"","neu":"Nguồn lực có hạn mà việc cần làm thì nhiều","thi":"Tìm số ít nguyên nhân tạo phần lớn kết quả và dồn sức vào đó trước","vi_du":"20% dạng bài chiếm 80% điểm thi → ôn kỹ các dạng đó trước. Vài khách hàng lớn tạo phần lớn doanh thu.","gioi_han":"80/20 là xu hướng, không phải tỷ lệ cố định (có thể 70/30, 90/10). Phải đo bằng số liệu, không đoán.","tu_khoa":"ưu tiên, trọng tâm, số ít, phần lớn kết quả","de_nham_voi":"KHUNG-02,KHUNG-04","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":3,"truoc":"KHUNG-07","sau":"KHUNG-06","cap_doi":"KHUNG-04","khac_nhau":"Pareto chọn làm cái gì; Hộp thời gian giới hạn làm bao lâu","ct_nguon_goc":"Bắt nguồn từ quan sát của nhà kinh tế học Vilfredo Pareto về sự phân bổ tài sản bất đối xứng ở Ý. Mặc dù ông không gọi đó là quy luật 80/20, sau này chuyên gia quản lý chất lượng Joseph Juran đã khái quát hóa phát hiện này trong thực tiễn, đặt tên là nguyên lý Pareto hay quy luật \"số ít then chốt\" (vital few) và \"số nhiều hữu ích\" (useful many).","ct_co_che":"Hệ thống phức tạp thường có sự phân bổ phi tuyến tính, thay vì phân bổ đều đặn. Một số ít yếu tố đầu vào mang trọng số lớn, tạo ra phần lớn kết quả cuối cùng (cả tốt lẫn xấu). Nhận diện được sự bất đối xứng này giúp con người thoát khỏi ảo giác \"mọi việc đều quan trọng như nhau\" vốn hay dẫn đến cạn kiệt sức lực. Thay vì dàn trải tài nguyên một cách công bằng nhưng vô ích, việc dồn lực vào \"số ít then chốt\" mang lại lợi suất tối đa. Cơ chế này dựa trên nguyên lý tiết kiệm năng lượng: tập trung giải quyết cốt lõi để hệ thống đạt hiệu suất cao nhất với nỗ lực thấp nhất.","ct_bang_chung":"A – Có sự ủng hộ mạnh mẽ. Dù tỷ lệ 80/20 không phải hằng số vật lý, quy luật phân bổ phi tuyến tính và số ít then chốt được chứng minh bằng nhiều bộ dữ liệu thực tế lớn trong kinh tế học, quản lý chất lượng và khoa học máy tính.","ct_quy_trinh":"Xác định rõ mục tiêu cần tối ưu (ví dụ: tăng doanh thu, giảm lỗi, tiết kiệm thời gian) || Thu thập dữ liệu định lượng thực tế của các yếu tố đầu vào tương ứng || Sắp xếp dữ liệu theo thứ tự đóng góp giảm dần || Tính tỷ lệ phần trăm tích lũy của từng yếu tố so với tổng thể || Kẻ đường cắt tại mốc tích lũy khoảng 80% để xác định nhóm \"số ít then chốt\" || Tập trung tối đa nguồn lực để giải quyết hoặc phát triển nhóm này trước tiên","ct_vi_du_mau":"Tình huống: Quán trà sữa nhận 200 lời phàn nàn mỗi tháng, nhân viên bị quá tải không biết bắt đầu xử lý từ đâu. Áp dụng: Quản lý cửa hàng quyết định thu thập số liệu, liệt kê và phân loại toàn bộ 200 lỗi trong sổ góp ý. Dữ liệu thực tế cho thấy: 120 lỗi do ứng dụng giao hàng trễ, 40 lỗi do trân châu nấu bị cứng, 40 lỗi còn lại rải rác ở các lý do khác (nhầm lượng đường, hết đá, thái độ phục vụ). Sắp xếp lại theo tỷ lệ: giao hàng trễ và trân châu cứng chiếm đúng 80% tổng phàn nàn. Thay vì chấn chỉnh toàn bộ quy trình pha chế và vận hành, quán tập trung thiết kế lại quy trình bàn giao cho shipper và áp dụng công thức luộc trân châu mới. Kết quả: Tháng sau số phàn nàn giảm ngay 150 vụ, giúp nhân viên bớt áp lực, dù quán chưa đụng đến các lỗi nhỏ lẻ khác.","ct_bien_the":"Quy luật sức mạnh (Power law), đường cong Zipf, quy luật 90/10 hoặc 70/30 tùy hệ thống. Phân tích ABC trong quản lý hàng tồn kho cũng dựa trên nguyên lý này.","ct_gioi_han":"Chỉ đúng khi đo lường bằng số liệu thực tế, không thể áp dụng bằng cách đoán mò cảm tính. Tỷ lệ 80/20 chỉ là con số ước lệ đại diện cho sự bất đối xứng, không mang tính tuyệt đối mọi lúc. Hơn nữa, không được dùng nguyên lý này để loại bỏ hoàn toàn 80% nguyên nhân thứ yếu vì chúng vẫn đóng vai trò cần thiết duy trì sự trọn vẹn của hệ thống.","ct_sai_lam":"Nhầm tưởng 80% và 20% cộng lại thành 100% của cùng một biến số, trong khi đây là hai biến độc lập || Cảm tính đoán định \"số ít then chốt\" mà không đi thu thập dữ liệu thật || Bỏ mặc hoàn toàn 80% nhóm thứ yếu dẫn đến sụp đổ hệ thống lâu dài","ct_tu_kiem_tra":"Có phải lúc nào tỷ lệ cũng chính xác là 80/20 không? ⇒ Không, nó chỉ là con số ước lệ cho tính phi tuyến, thực tế có thể là 70/30 hoặc 90/10. || Hai con số 80 và 20 cộng lại thành 100 đúng không? ⇒ Không, đây là tỷ lệ của hai biến số khác nhau (đầu vào và kết quả đầu ra). || Cách tốt nhất để tìm ra \"số ít then chốt\" là gì? ⇒ Thu thập dữ liệu thực tế và tính tỷ lệ tích lũy, không đoán mò bằng cảm tính.","ct_tai_lieu":"TL008,TL009","ct_ghi_chu":"Nghiên cứu gốc của Vilfredo Pareto thường được ghi nhận xuất bản năm 1896, nhưng chi tiết năm này không nằm trong danh sách tài liệu tham khảo cốt lõi đã cấp."},{"id":"KHUNG-06","thu_tu":4,"tuan":1,"ngay":1,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":15,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Chẩn đoán","ten":"5 Whys – hỏi \"Vì sao?\" 5 lần","ten_goc":"5 Whys – Sakichi Toyoda, Hệ thống sản xuất Toyota (Taiichi Ohno)","neu":"Sự cố lặp lại, cần tìm nguyên nhân gốc","thi":"Hỏi \"Vì sao?\" nối tiếp trên câu trả lời trước, đến khi chạm nguyên nhân có thể xử lý (khoảng 5 lần)","vi_du":"Máy dừng → quá tải → thiếu dầu → bơm hỏng → không có lịch bảo trì → lập lịch bảo trì.","gioi_han":"Dễ đi theo một nhánh duy nhất và dừng ở nguyên nhân mình nghĩ sẵn; mỗi bước cần dữ kiện kiểm chứng. Số 5 chỉ là ước lệ.","tu_khoa":"lặp lại, nguyên nhân gốc, vì sao, sự cố","de_nham_voi":"KHUNG-07","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":4,"truoc":"KHUNG-03","sau":"KHUNG-09","cap_doi":"KHUNG-07","khac_nhau":"Xương cá quét rộng mọi nhánh nguyên nhân; 5 Whys khoan sâu một nhánh","ct_nguon_goc":"Được phát triển bởi Sakichi Toyoda (nhà sáng lập Tập đoàn Toyota) vào đầu thế kỷ 20, sau đó được Taiichi Ohno hoàn thiện và đưa vào Hệ thống Sản xuất Toyota (TPS) trong thập niên 1950–1970. Ohno xem kỹ thuật này là nền tảng của phương pháp tiếp cận khoa học tại Toyota: bằng cách lặp lại câu hỏi vì sao 5 lần, bản chất của vấn đề cũng như giải pháp sửa chữa căn cơ sẽ lộ diện.","ct_co_che":"Tâm lý học chỉ ra con người có xu hướng thoả mãn với lời giải thích bề mặt đầu tiên (sự kiện kích hoạt trực tiếp) nhằm tiết kiệm nhận thức. Khi có sự cố, phản xạ tự nhiên là tìm người chịu trách nhiệm thay vì tìm lỗ hổng quy trình. Kỹ thuật 5 Whys tạo ra chuỗi nhân quả suy luận gián tiếp: mỗi câu trả lời trở thành tiền đề cho câu hỏi tiếp theo, ép tư duy vượt qua triệu chứng để đào sâu vào cấu trúc vận hành, hệ thống kiểm soát và chính sách quản lý sinh ra lỗi đó.","ct_bang_chung":"C – Được ứng dụng rộng rãi và xem là công cụ chuẩn trong Lean và Six Sigma; không có thử nghiệm đối chứng ngẫu nhiên độc lập nhưng có giá trị thực hành cao khi kết hợp cùng dữ liệu định lượng.","ct_quy_trinh":"Xác định sự cố bằng một câu mô tả khách quan, dựa trên dữ kiện đã xác minh || Hỏi \"Vì sao sự cố này xảy ra?\" và chỉ ghi nguyên nhân trực tiếp đã chứng minh || Lấy câu trả lời đó làm đầu vào để hỏi tiếp câu \"Vì sao?\" kế tiếp || Kiểm tra tính đảo ngược bằng cách đọc ngược từ dưới lên bằng từ \"Do đó/Vì vậy\" || Dừng lại khi chạm đến lỗi quy trình, chính sách hoặc thiết kế hệ thống || Thiết lập biện pháp đối phó (countermeasure) để ngăn lỗi tái diễn vĩnh viễn","ct_vi_du_mau":"Tình huống: Tiếp tục chuỗi trà sữa, phân tích Pareto cho thấy \"trân châu bị cứng\" là nguyên nhân lớn nhất làm mất khách. Nhóm ngồi lại đào sâu: (1) Vì sao trân châu bị cứng khi giao tới khách? ⇒ Vì trân châu đã nấu quá 4 tiếng trước khi đóng ly. (2) Vì sao trân châu bị để quá 4 tiếng? ⇒ Vì nhân viên nấu một mẻ lớn 5 kg từ 9h sáng cho cả ngày. (3) Vì sao nhân viên nấu một lần quá nhiều thay vì chia nhỏ? ⇒ Vì nồi nấu trân châu cơ cũ phải đứng khuấy tay 45 phút, nhân viên ngại làm nhiều lần giờ cao điểm. (4) Vì sao không có thiết bị khuấy tự động hoặc quy định chia mẻ? ⇒ Vì quy trình chuẩn hiện tại chỉ ghi \"nấu trân châu mỗi ngày\" mà không quy định kích cỡ mẻ theo giờ. (5) Vì sao quy trình chuẩn chưa bao giờ được cập nhật chi tiết này? ⇒ Vì chưa từng có cơ chế rà soát quy trình dựa trên dữ liệu phản hồi của khách. Kết quả: Thay vì phạt nhân viên nấu ẩu, chuỗi đầu tư nồi nấu đảo tự động và sửa quy trình thành \"chỉ nấu mẻ 1.5 kg, dán nhãn hủy sau 3 tiếng\". Vấn đề trân châu sượng chấm dứt hoàn toàn.","ct_bien_the":"Biểu đồ 5 Whys phân nhánh (khi một câu hỏi có nhiều nguyên nhân song song dẫn đến dạng cây nhân quả); Phân tích nguyên nhân gốc rễ (RCA - Root Cause Analysis).","ct_gioi_han":"Dễ bị bẫy thiên kiến xác nhận: người hỏi thường lái câu trả lời về phía định kiến có sẵn. Số 5 chỉ là con số tượng trưng, có thể dừng ở lần 3 hoặc cần tới lần 7. Kỹ thuật hoàn toàn thất bại nếu áp dụng đơn độc mà thiếu dữ kiện thực tế để kiểm chứng từng mắt xích, hoặc người tham gia không nắm rõ quy trình vận hành thực tế.","ct_sai_lam":"Dừng lại ở lỗi cá nhân (ví dụ: \"do nhân viên quên\") thay vì tìm lỗ hổng quy trình || Đưa ra giả định phỏng đoán thay vì kiểm chứng sự thật tại hiện trường (Gemba) || Mắc bẫy suy luận một chiều, bỏ qua các nguyên nhân nhánh cùng tác động || Tiếp tục hỏi khi đã vượt quá phạm vi kiểm soát của tổ chức","ct_tu_kiem_tra":"Làm thế nào để kiểm tra tính logic của một chuỗi 5 Whys? ⇒ Đọc ngược chuỗi nhân quả từ dưới lên trên bằng liên từ \"Do đó/Vì vậy\". || Đâu là dấu hiệu cho thấy bạn đã chạm đến nguyên nhân gốc rễ? ⇒ Khi câu trả lời chỉ ra một quy trình, tiêu chuẩn hoặc hệ thống kiểm soát cần thay đổi. || Nếu câu trả lời dừng ở \"do anh Nam sơ suất\", chuỗi 5 Whys đã hoàn thành chưa? ⇒ Chưa; cần hỏi tiếp vì sao quy trình lại cho phép một sơ suất cá nhân gây ra sự cố.","ct_tai_lieu":"TL010,TL008"},{"id":"KHUNG-09","thu_tu":5,"tuan":1,"ngay":2,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"khung","nhom":"Khung – Chiến lược","ten":"Tư duy nguyên bản (First Principles)","ten_goc":"First principles – Aristotle; phổ biến trong kỹ thuật và khởi nghiệp","neu":"Cách làm quen đã bế tắc hoặc quá đắt","thi":"Tách vấn đề về các sự thật cơ bản không thể chối cãi, rồi dựng lại giải pháp từ đó","vi_du":"Bản chất báo tường = nội dung hay + dễ đọc → làm bằng lá khô, dây thừng cũ, chi phí 0 đồng.","gioi_han":"Tốn thời gian; với việc thường ngày, dùng kinh nghiệm hoặc phép so sánh nhanh hơn.","tu_khoa":"bế tắc, bản chất, sự thật cơ bản, làm lại từ đầu","de_nham_voi":"KHUNG-08","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":5,"truoc":"KHUNG-06","sau":"KHUNG-08","cap_doi":"KHUNG-08","khac_nhau":"Lật ngược tìm điều chắc chắn làm hỏng; First Principles tìm bản chất để dựng lại","ct_nguon_goc":"Khái niệm \"nguyên lý đầu tiên\" bắt nguồn từ triết học của Aristotle, chỉ những mệnh đề cơ bản nhất không thể suy diễn từ bất kỳ điều gì khác. Trong thời hiện đại, phương pháp này trở nên phổ biến trong lĩnh vực kỹ thuật và khởi nghiệp như một công cụ để thiết kế lại hệ thống từ con số không thay vì cải tiến dựa trên cái cũ.","ct_co_che":"Não bộ chuộng tư duy theo kiểu loại suy (so sánh với cái có sẵn) vì nó tiết kiệm năng lượng. Tuy nhiên, loại suy dễ sao chép luôn cả những ranh giới và sai lầm của giải pháp cũ. Tư duy nguyên bản buộc ta gỡ bỏ mọi giả định, chạm tới những sự thật nền tảng nhất. Từ nền móng vững chắc này, ta xây dựng lại giải pháp mới hoàn toàn, giải phóng tư duy khỏi các lối mòn nhận thức và định kiến của đám đông.","ct_bang_chung":"C – Khung thực hành hợp lý, thiên về triết học và phương pháp luận thiết kế. Ít có kiểm chứng thực nghiệm tâm lý đo lường riêng biệt, nhưng cơ sở của nó dựa trên việc tránh thiên kiến mỏ neo và sự ỳ tâm lý.","ct_quy_trinh":"Xác định vấn đề đang gặp bế tắc hoặc có chi phí quá cao theo cách làm quen thuộc || Viết ra mọi giả định hiện tại đang được mọi người mặc nhiên tin là đúng || Hỏi \"Điều gì chắc chắn là đúng ở mức độ cơ bản nhất?\" để bóc tách giả định khỏi sự thật cốt lõi || Lấy các sự thật cốt lõi đó làm khối nguyên vật liệu xây dựng nền tảng || Kết hợp các nguyên vật liệu này lại theo một cấu trúc hoàn toàn mới để tạo ra giải pháp","ct_vi_du_mau":"Tình huống: Một chuỗi quán trà sữa muốn làm bao bì giữ nhiệt để khách đi đường xa, nhưng giá hộp xốp chuyên dụng quá đắt, mua về tặng kèm sẽ bị lỗ. Áp dụng: Phá bỏ giả định \"phải mua hộp giữ nhiệt làm sẵn\". Đội bóc tách vấn đề về sự thật cơ bản nhất: bản chất của việc giữ nhiệt là làm chậm quá trình truyền dẫn nhiệt; và không khí tĩnh là vật liệu cách nhiệt rẻ nhất có sẵn. Từ sự thật cơ bản này, họ xây dựng lại giải pháp: thiết kế một lớp bao quấn ôm sát thân ly bằng giấy các-tông gợn sóng, vì nếp gấp chứa rất nhiều túi không khí. Kết quả: Thay vì mua hộp đắt tiền theo lối mòn, quán tạo ra lớp bọc giữ nhiệt với chi phí giảm 90%, đủ rẻ để tặng kèm mà vẫn đạt hiệu quả mong muốn.","ct_bien_the":"Phương pháp phân tích truy nguyên trong triết học. Kỹ thuật 5 Whys cũng bóc tách bề mặt để tìm bản chất, nhưng dùng cho chẩn đoán lỗi thay vì sáng tạo thiết kế.","ct_gioi_han":"Phương pháp này tiêu tốn cực kỳ nhiều năng lượng nhận thức và thời gian. Với những quyết định nhỏ, lặp đi lặp lại hoặc cần phản ứng tức thời, tư duy loại suy vẫn là lựa chọn tối ưu hơn. Tư duy nguyên bản sẽ thất bại nếu người áp dụng thiếu kiến thức nền tảng vững chắc về lĩnh vực đang giải quyết.","ct_sai_lam":"Lầm tưởng những \"quy ước của ngành\" là sự thật cơ bản cốt lõi || Bóc tách vấn đề chưa đủ sâu, vẫn vô tình giữ lại các giả định ẩn || Chỉ phá vỡ cái cũ mà không có năng lực sáng tạo để lắp ráp các yếu tố lại từ đầu","ct_tu_kiem_tra":"Vì sao tư duy loại suy dễ dẫn đến bế tắc trong sáng tạo? ⇒ Vì nó vô tình sao chép luôn cả những giới hạn và sai lầm của giải pháp cũ. || Sự khác biệt giữa 5 Whys và Tư duy nguyên bản là gì? ⇒ 5 Whys dùng để tìm nguyên nhân gốc của một lỗi, còn Tư duy nguyên bản dùng để xây dựng giải pháp mới. || Mức độ cơ bản nhất của sự thật thường nằm ở đâu? ⇒ Nằm ở các quy luật vật lý, toán học hoặc các nền tảng không thể chối cãi.","ct_ghi_chu":"Trong giới công nghệ khởi nghiệp, phương pháp này thường được cho là do Elon Musk áp dụng và phổ biến rộng rãi, dù ông không phải là người sáng tạo ra nó.","ct_cho_duyet":1},{"id":"KHUNG-08","thu_tu":6,"tuan":1,"ngay":2,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":13,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Chiến lược","ten":"Lật ngược (Inversion)","ten_goc":"Inversion – Carl Jacobi (\"luôn lật ngược\"); Charlie Munger phổ biến","neu":"Lập kế hoạch hoặc mục tiêu mà khó thấy rủi ro","thi":"Hỏi \"Điều gì chắc chắn làm hỏng việc này?\", liệt kê rồi chặn từng điều","vi_du":"Muốn giữ nhân viên giỏi → hỏi điều gì chắc chắn làm họ nghỉ: trả lương thấp, sếp thất hứa → chặn trước.","gioi_han":"Tránh thất bại chưa đủ tạo thành công; vẫn cần mục tiêu và cách làm chủ động.","tu_khoa":"rủi ro, phá hỏng, ngược lại, chặn trước","de_nham_voi":"KHUNG-09","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":6,"truoc":"KHUNG-09","sau":"KHUNG-10","cap_doi":"KHUNG-09","khac_nhau":"Lật ngược tìm điều chắc chắn làm hỏng; First Principles tìm bản chất để dựng lại","ct_nguon_goc":"Bắt nguồn từ lời khuyên của nhà toán học người Đức Carl Gustav Jacob Jacobi: \"Man muss immer umkehren\" (Luôn luôn lật ngược vấn đề) khi giải các bài toán phức tạp. Nhà đầu tư Charlie Munger – đối tác của Warren Buffett tại Berkshire Hathaway – đã phổ biến rộng rãi phương pháp này vào tư duy kinh doanh và đời sống qua câu nói nổi tiếng: muốn giúp đỡ Ấn Độ, hãy nghiên cứu điều gì sẽ làm Ấn Độ suy kiệt nhất, rồi tránh làm điều đó.","ct_co_che":"Não bộ con người tiến hóa để dễ nhận biết hiểm họa và nỗi sợ hơn là hình dung viễn cảnh lý tưởng (thiên kiến mất mát và tính bất đối xứng nhận thức). Khi cố gắng lập kế hoạch thành công, ta thường vướng vào sự tự tin thái quá và thiên kiến lạc quan, làm mù mắt trước những lỗ hổng chí mạng. Tư duy lật ngược biến mục tiêu tích cực thành kịch bản thảm họa cụ thể, kích hoạt mạch thần kinh cảnh giác để truy quét sạch các điểm chết tiềm ẩn trước khi chúng xuất hiện trên thực tế.","ct_bang_chung":"B – Gary Klein và cộng sự chứng minh kỹ thuật tiền khám nghiệm (Pre-mortem – một biến thể của Inversion) làm tăng khả năng xác định chính xác các rủi ro tương lai lên khoảng 30% so với việc chỉ lập kế hoạch thông thường.","ct_quy_trinh":"Xác định rõ mục tiêu hoặc dự án bạn muốn đạt được thành công || Đảo ngược hoàn toàn câu hỏi: \"Làm thế nào để chắc chắn dự án này thất bại thảm hại?\" || Động não liệt kê không kiêng dè toàn bộ những cách thức dẫn đến sụp đổ || Phân loại danh sách thảm họa thành hai nhóm: rủi ro chí mạng và rủi ro thứ yếu || Xây dựng quy trình ngăn chặn và chốt chặn an toàn cho từng điểm chí mạng || Theo dõi và kiểm tra định kỳ để đảm bảo các sai lầm không bị tái phạm","ct_vi_du_mau":"Tình huống: Chuỗi trà sữa chuẩn bị mở rộng thêm 2 điểm bán kiosk tự động tại các tòa văn phòng ở Q.1. Thay vì chỉ vẽ ra viễn cảnh doanh thu màu hồng, quản lý yêu cầu toàn đội áp dụng Lật ngược: \"Điều gì chắc chắn sẽ biến dự án này thành đống sắt vụn trong 30 ngày tới?\". Toàn đội liệt kê: (1) Máy làm lạnh bị ngắt điện đột ngột khiến sữa bị chua mà khách uống vào ngộ độc; (2) Mạng internet của kiosk mất kết nối khiến khách không quét mã thanh toán được; (3) Hết trân châu vào giờ cao điểm 12h–13h trưa khiến khách bực bội tẩy chay. Áp dụng từng bước: nhóm thiết kế ngay rơ-le ngắt nguồn khẩn cấp có cảnh báo về điện thoại khi nhiệt độ vượt 8°C; trang bị bộ phát 4G phụ trợ tự kích hoạt khi mất wifi; đặt định mức nạp hàng dự phòng cố định vào lúc 11h trưa mỗi ngày. Kết quả: trong tháng đầu vận hành, có hai lần sảnh tòa nhà nhảy aptomat điện, nhưng cảm biến cảnh báo giúp đội kỹ thuật xử lý kịp thời trước khi sữa hư hỏng, không có sự cố chất lượng nào xảy ra. Bài học: tránh thất bại chính là bước đi chắc chắn nhất để bảo vệ thành công.","ct_bien_the":"Tiền khám nghiệm (Project Pre-mortem của Gary Klein); Kỹ thuật đảo ngược giả định (Assumption Reversal); Phân tích thất bại và tác động (FMEA - Failure Mode and Effects Analysis).","ct_gioi_han":"Tránh né mọi rủi ro không đồng nghĩa với việc sẽ tự động sinh ra giá trị đột phá. Lạm dụng tư duy lật ngược dễ dẫn đến tâm lý phòng thủ thái quá, sợ hãi, tê liệt hành động và triệt tiêu tinh thần đổi mới sáng tạo. Vẫn cần định hướng mục tiêu chủ động song hành.","ct_sai_lam":"Chỉ liệt kê các thảm họa để dọa dẫm lẫn nhau mà không thiết lập giải pháp chặn đứng || Bỏ qua các rủi ro xuất phát từ văn hóa nội bộ và sự gian dối || Rơi vào bi quan cực đoan khiến toàn đội nản lòng không dám khởi động dự án || Nghĩ rằng chặn được thất bại là tự khắc trở nên vĩ đại","ct_tu_kiem_tra":"Mục đích cốt lõi của tư duy lật ngược là gì? ⇒ Nhận diện và triệt tiêu trước những nguyên nhân chắc chắn dẫn đến thất bại thảm hại. || Điểm khác nhau giữa Lật ngược và Tư duy nguyên bản là gì? ⇒ Lật ngược tìm các điểm làm hỏng việc để né; Tư duy nguyên bản tìm chân lý cốt lõi để xây mới. || Khi nào việc áp dụng tư duy lật ngược trở nên có hại? ⇒ Khi tạo ra tâm lý bi quan cực đoan, sợ sai và làm tê liệt các quyết định đổi mới sáng tạo.","ct_tai_lieu":"TL012,TL001","ct_ghi_chu":"Câu châm ngôn của Jacobi xuất hiện trong các bài giảng toán học thế kỷ 19; Charlie Munger mang tư tưởng này vào quản trị kinh doanh hiện đại."},{"id":"KHUNG-10","thu_tu":7,"tuan":1,"ngay":2,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Chiến lược","ten":"Ma trận SWOT","ten_goc":"SWOT – thường gắn với Albert Humphrey (SRI, thập niên 1960); ma trận TOWS – Heinz Weihrich","neu":"Cần đánh giá vị thế trước khi chọn chiến lược","thi":"Liệt kê Mạnh, Yếu (bên trong) · Cơ hội, Thách thức (bên ngoài) rồi ghép thành 4 chiến lược SO, ST, WO, WT","vi_du":"Quán cà phê: S vị trí đẹp, W ít vốn, O khu văn phòng mới, T chuỗi lớn sắp mở → SO: bán combo cho dân văn phòng.","gioi_han":"Danh sách dễ chủ quan, không xếp ưu tiên; phải gắn với một mục tiêu cụ thể và dữ liệu.","tu_khoa":"vị thế, mạnh yếu, cơ hội thách thức, chiến lược","de_nham_voi":"KHUNG-05","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":7,"truoc":"KHUNG-08","sau":"KHUNG-04","cap_doi":"KHUNG-05","khac_nhau":"5W1H mô tả hiện trạng; SWOT đánh giá vị thế để chọn chiến lược","ct_nguon_goc":"Thường được cho là phát triển từ dự án nghiên cứu tại Viện Nghiên cứu Stanford (SRI) vào thập niên 1960 do Albert Humphrey dẫn dắt. Sau đó công cụ được hoàn thiện và chuẩn hóa thành ma trận SWOT. Giáo sư Heinz Weihrich đã nâng cấp công cụ này thành Ma trận TOWS, tập trung vào việc ghép cặp chéo các yếu tố bên trong và bên ngoài để tạo ra hành động chiến lược thực thi.","ct_co_che":"Tư duy con người thường bị kẹt vào cái nhìn phiến diện: hoặc quá chú tâm vào nội lực bên trong mà quên bối cảnh vĩ mô, hoặc quá hoảng sợ trước biến động thị trường mà bỏ qua sức mạnh cốt lõi. Khung ma trận 2x2 buộc người lập kế hoạch phân tách rạch ròi giữa các biến số nội sinh (Điểm mạnh, Điểm yếu do mình kiểm soát) và ngoại sinh (Cơ hội, Thách thức do thị trường quyết định). Việc ghép cặp chéo SO, WO, ST, WT tạo ra cơ chế bắc cầu, giúp chuyển từ trạng thái mô tả tĩnh sang thế cờ chiến lược động.","ct_bang_chung":"C – Khung phân tích chiến lược kinh điển được giảng dạy và sử dụng trên toàn cầu; ít nghiên cứu đối chứng về tính vượt trội, nhưng giá trị cấu trúc hóa thông tin và định vị chiến lược được xác nhận rộng rãi trong thực hành quản trị.","ct_quy_trinh":"Xác định một mục tiêu chiến lược cụ thể và phạm vi đánh giá rõ ràng || Liệt kê Điểm mạnh và Điểm yếu bên trong dựa trên dữ liệu kiểm toán nội bộ || Khảo sát Cơ hội và Thách thức từ xu hướng thị trường, đối thủ và pháp lý || Lập bảng ma trận TOWS ghép cặp: S-O, W-O, S-T, W-T || Xây dựng các sáng kiến hành động cụ thể cho từng ô ghép cặp || Đưa các sáng kiến vào bảng Pareto để chọn ưu tiên thực thi","ct_vi_du_mau":"Tình huống: Chuỗi trà sữa đánh giá vị thế để cạnh tranh khi một thương hiệu nhượng quyền quốc tế chuẩn bị mở cửa hàng lớn đối diện. Áp dụng ma trận TOWS: Mục tiêu giữ vững thị phần và biên lợi nhuận. Bên trong: S (Vị trí kiosk tiện lợi sát chân thang máy văn phòng; công thức trà vị đậm hợp gu người Việt), W (Ngân sách marketing mỏng; nhân viên biến động cao). Bên ngoài: O (Xu hướng dân văn phòng thích đặt hàng nhanh qua mini-app nội bộ; tòa nhà sắp đón thêm 3 công ty công nghệ lớn), T (Đối thủ thương hiệu lớn có vốn dày; đối thủ chạy chương trình giảm giá sốc 50% tuần khai trương). Ghép cặp chiến lược: S-O: Tận dụng vị trí chân thang máy để quảng bá mini-app đặt trước nhận ngay trong 30 giây cho nhân viên các công ty mới. S-T: Nhấn mạnh thông điệp \"vị trà đậm chuẩn gu Việt\" để giữ chân tệp khách sành trà, không chạy đua giảm giá đối đầu trực diện. W-T: Tối ưu tự động hóa tại kiosk để giảm phụ thuộc vào nhân viên quầy, tránh áp lực quỹ lương khi đối thủ giành người. Kết quả: chuỗi không bị cuốn vào cuộc chiến đốt tiền giảm giá mà vẫn duy trì được 85% lượng khách hàng trung thành văn phòng. Bài học: SWOT chỉ có giá trị khi ghép cặp thành thế trận hành động cụ thể.","ct_bien_the":"Ma trận TOWS (nhấn mạnh hành động ghép cặp); Phân tích PESTLE (mở rộng chi tiết cho yếu tố O và T); VRIO (đào sâu kiểm định giá trị nội bộ cho yếu tố S).","ct_gioi_han":"Rất dễ biến thành một danh sách liệt kê tùy tiện, cảm tính và vô thưởng vô phạt nếu không gắn với một mục tiêu duy nhất. SWOT không tự xếp hạng mức độ ưu tiên giữa các yếu tố. Nếu môi trường thay đổi quá nhanh và phi tuyến tính, các phân loại tĩnh của SWOT nhanh chóng trở nên lạc hậu.","ct_sai_lam":"Lập bảng SWOT chung chung mà không gắn với một bài toán cụ thể || Nhầm lẫn giữa yếu tố bên trong (S/W) và yếu tố bên ngoài (O/T) || Dừng lại ở bảng liệt kê 4 ô mà không ghép cặp thành chiến lược hành động || Nhét ý kiến cá nhân mơ hồ vào thay vì dữ liệu thị trường có căn cứ","ct_tu_kiem_tra":"Yếu tố \"đối thủ giảm giá mạnh\" thuộc ô nào trong SWOT? ⇒ Ô Thách thức (T), vì đây là yếu tố ngoại cảnh bên ngoài doanh nghiệp không thể kiểm soát trực tiếp. || Ma trận TOWS giải quyết nhược điểm lớn nhất nào của SWOT cổ điển? ⇒ Giải quyết tính bị động, buộc người làm phải ghép cặp các yếu tố để sinh ra chiến lược hành động cụ thể. || Khi nào một điểm mạnh (S) có thể biến thành điểm yếu (W)? ⇒ Khi môi trường thay đổi, năng lực cốt lõi cũ trở thành gánh nặng trì trệ cản trở sự thích ứng mới.","ct_tai_lieu":"TL008","ct_ghi_chu":"Bản quyền nguồn gốc Albert Humphrey tại SRI vào thập niên 1960 chưa có văn bản xuất bản chính thức dạng học thuật hàn lâm, nhưng lịch sử quản trị ghi nhận ông là người khởi xướng. Weihrich phát triển TOWS trong bài báo trên tạp chí Long Range Planning."},{"id":"KHUNG-04","thu_tu":8,"tuan":1,"ngay":2,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":13,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Nạp & quản lý","ten":"Hộp thời gian (Hộp cát)","ten_goc":"Timeboxing; kỹ thuật Pomodoro – Francesco Cirillo","neu":"Việc dễ kéo dài, cầu toàn hoặc khó bắt đầu","thi":"Đặt trước khung giờ cố định cho việc; hết giờ thì dừng, đánh giá rồi mới quyết định làm tiếp","vi_du":"Soạn báo cáo trong đúng 25 phút, nghỉ 5 phút; buổi tập MindGym 15 phút cũng là một hộp thời gian.","gioi_han":"Không hợp việc cần tập trung sâu liên tục hoặc có hạn chót cứng; hộp quá ngắn làm vỡ mạch suy nghĩ.","tu_khoa":"giới hạn thời gian, trì hoãn, 25 phút, dừng đúng giờ","de_nham_voi":"KHUNG-03","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":8,"truoc":"KHUNG-10","sau":"KHUNG-02","cap_doi":"KHUNG-03","khac_nhau":"Pareto chọn làm cái gì; Hộp thời gian giới hạn làm bao lâu","ct_nguon_goc":"Khái niệm Hộp thời gian (Timeboxing) bắt nguồn từ phương pháp phát triển phần mềm linh hoạt (Agile và Scrum) từ cuối thập niên 1980 đến đầu 1990, nhằm hạn chế sự bành trướng vô tận của các tính năng. Năm 1987, Francesco Cirillo phát triển Kỹ thuật Pomodoro sử dụng chiếc đồng hồ hình quả cà chua để chia phiên làm việc 25 phút, nghỉ ngắn 5 phút, tạo tiền đề đưa mô hình này vào công việc hàng ngày của cá nhân.","ct_co_che":"Dựa trên việc bẻ gãy hai quy luật tâm lý: Định luật Parkinson (công việc luôn tự giãn ra để lấp đầy khoảng thời gian được ấn định cho nó) và chủ nghĩa cầu toàn gây trì hoãn. Khi ta đặt một hộp thời gian đóng kín với hạn chót tức thì, não bộ kích hoạt sự tập trung cấp tính, ngăn chặn kích thích phân tâm từ môi trường. Việc giới hạn thời gian buộc cá nhân phải tự động hy sinh những chi tiết vụn vặt để hướng tới kết quả cốt lõi có thể bàn giao được.","ct_bang_chung":"B – Các nghiên cứu về năng suất và lý thuyết thiết lập mục tiêu (Locke & Latham) ủng hộ mạnh mẽ vai trò của hạn chót ngắn và cụ thể; tuy nhiên hiệu ứng của các khoảng thời gian cố định như 25 phút của Pomodoro phụ thuộc lớn vào đặc thù từng loại công việc.","ct_quy_trinh":"Chọn đúng một nhiệm vụ duy nhất cần giải quyết || Ấn định một hộp thời gian cố định và thực tế (ví dụ 25 hoặc 50 phút) || Loại bỏ triệt để mọi tác nhân gây xao nhãng trước khi bấm giờ || Tập trung làm việc liên tục cho đến khi chuông báo hết giờ reo || Lập tức dừng tay khi hết giờ, bất kể công việc đang ở trạng thái nào || Đánh giá kết quả đạt được và nghỉ ngơi hoàn toàn trước phiên kế tiếp","ct_vi_du_mau":"Tình huống: Người phụ trách truyền thông của chuỗi trà sữa thường xuyên trễ hạn nộp bản kế hoạch bài đăng mạng xã hội hàng tuần vì mải mê tìm kiếm hình ảnh đẹp và sửa câu chữ cả ngày không xong. Áp dụng Hộp thời gian: Người này chia buổi sáng thành 3 hộp thời gian cứng: Hộp 1 (45 phút) – Chỉ tập trung viết nội dung thô cho 7 bài đăng, tuyệt đối không tìm ảnh, không mở Facebook. Hộp 2 (45 phút) – Chỉ tìm kiếm và cắt ghép 7 hình ảnh minh họa cơ bản, hết giờ là chốt. Hộp 3 (30 phút) – Đọc soát lỗi chính tả và lên lịch đăng tự động trên hệ thống. Giữa mỗi hộp nghỉ 10 phút uống nước, thả lỏng. Kết quả: bản kế hoạch tuần được hoàn tất xuất sắc trong đúng 2,5 giờ buổi sáng thay vì dây dưa cả ngày, buổi chiều dành trọn vẹn thời gian để khảo sát phản hồi của khách hàng tại các kiosk. Bài học: giới hạn thời gian buộc ta phải hoàn thành thay vì hoàn hảo.","ct_bien_the":"Kỹ thuật Pomodoro (chu kỳ 25/5 phút); Hộp thời gian mềm (cho phép giãn nhẹ 5 phút nếu đang vào mạch); Quy tắc 2 phút của David Allen (việc dưới 2 phút làm ngay thay vì đóng hộp).","ct_gioi_han":"Không phù hợp với các công việc sáng tạo tự do đòi hỏi trạng thái dòng chảy sâu (Deep Flow) kéo dài 2–3 giờ liên tục mà sự ngắt quãng sẽ phá hủy mạch ý tưởng. Không áp dụng được cho các hoạt động đàm phán, khủng hoảng vận hành hoặc xử lý sự cố cấp bách tại chỗ.","ct_sai_lam":"Đặt hộp thời gian quá ngắn hoặc quá phi thực tế cho việc phức tạp || Tiếp tục làm rốn thêm khi chuông báo đã reo, làm mất tính kỷ luật của hộp || Để điện thoại và mạng xã hội làm gián đoạn giữa chừng || Không nghỉ ngơi giữa các hộp dẫn đến kiệt sức vào cuối ngày","ct_tu_kiem_tra":"Định luật tâm lý nào giải thích vì sao Hộp thời gian giúp tăng tốc độ làm việc? ⇒ Định luật Parkinson: công việc tự nở ra để chiếm hết thời gian được phân bổ cho nó. || Hành động bắt buộc phải làm khi đồng hồ hộp thời gian reo là gì? ⇒ Dừng tay ngay lập tức để đánh giá kết quả và nghỉ ngơi, giữ tính nghiêm ngặt của khung giờ. || Khi nào việc chia hộp thời gian 25 phút phản tác dụng? ⇒ Khi đang giải quyết các vấn đề kỹ thuật sâu hoặc sáng tạo phức tạp cần trạng thái dòng chảy liên tục.","ct_tai_lieu":"TL054,TL182,TL031","ct_ghi_chu":"Cirillo sáng tạo ra Pomodoro vào cuối thập niên 1980 khi còn là sinh viên đại học, tài liệu hoàn chỉnh xuất bản năm 2006."},{"id":"KHUNG-02","thu_tu":9,"tuan":1,"ngay":3,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Nạp & quản lý","ten":"Gom khối (Chunking)","ten_goc":"Chunking – George A. Miller (1956); Chase & Simon (1973) về kỳ thủ cờ vua","neu":"Phải nhớ hoặc xử lý nhiều mảnh thông tin rời rạc","thi":"Gom các mảnh thành vài khối có nghĩa; trí nhớ làm việc giữ khối chứ không giữ từng mảnh","vi_du":"Số 0912345678 nhớ thành 0912 · 345 · 678. Tài liệu 15 trang gom thành 3 khối: mốc thời gian · nhân vật · ý nghĩa.","gioi_han":"Trí nhớ làm việc chỉ giữ khoảng 4 khối (Cowan 2001). Khối phải dựa trên ý nghĩa đã hiểu; gom máy móc thì vẫn quên.","tu_khoa":"nhiều thông tin, khó nhớ, gom nhóm, khối","de_nham_voi":"KHUNG-03,KHUNG-01","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":9,"truoc":"KHUNG-04","sau":"KHUNG-01","cap_doi":"KHUNG-01","khac_nhau":"5 bước là cả quy trình quyết định; Gom khối chỉ là bước nạp dữ liệu","ct_nguon_goc":"Năm 1956, nhà tâm lý học nhận thức George A. Miller công bố nghiên cứu kinh điển về dung lượng trí nhớ làm việc (working memory) với con số \"7 ± 2\". Năm 1973, William Chase và Herbert Simon nghiên cứu các đại kiện tướng cờ vua và chứng minh năng lực vượt trội của họ không nằm ở việc tính trước hàng triệu nước cờ, mà ở khả năng nhận diện và gom các thế cờ thành từng khối (chunk) có ý nghĩa dựa trên cấu trúc đã lưu trong trí nhớ dài hạn.","ct_co_che":"Trí nhớ ngắn hạn và trí nhớ làm việc của con người có nút thắt cổ chai sinh học cực kỳ hẹp. Khi đối mặt với lượng dữ liệu rời rạc quá lớn, não bộ sẽ rơi vào tình trạng quá tải nhận thức (cognitive overload), dẫn đến tắc nghẽn xử lý. Gom khối là cơ chế nén dữ liệu: nhóm các mẩu thông tin đơn lẻ có liên hệ logic lại với nhau thành một đơn vị duy nhất, biến một luồng dữ liệu nhiều mẩu thành vài khối có ý nghĩa, giúp giải phóng băng thông tư duy.","ct_bang_chung":"A – Hàng trăm nghiên cứu lặp lại trong tâm lý học nhận thức và khoa học thần kinh suốt nửa thế kỷ qua xác nhận vai trò nền tảng của gom khối trong xử lý thông tin, học ngôn ngữ và hình thành chuyên môn sâu.","ct_quy_trinh":"Thu thập toàn bộ các mẩu thông tin hoặc dữ liệu đang bị phân tán || Tìm kiếm các mối liên hệ logic, đặc điểm tương đồng hoặc mẫu hình chung || Gom các chi tiết rời rạc thành 3–4 nhóm lớn có tên gọi đại diện rõ ràng || Gắn nhãn hoặc mã hóa mỗi nhóm bằng một từ khóa hoặc hình ảnh neo || Luyện tập truy xuất và thao tác trên nhãn của khối thay vì nhớ từng chi tiết","ct_vi_du_mau":"Tình huống: Quản lý chuỗi trà sữa cần bàn giao quy trình đóng cửa ca tối cho 5 nhân viên bán thời gian mới. Quy trình gồm 16 việc rời rạc: rút điện máy pha, lau khay nhỏ giọt, quét sàn bếp, khóa két tiền, in báo cáo Z, tắt máy lạnh, kiểm tra tủ lạnh, vứt rác, niêm phong nắp siro, tắt đèn biển hiệu, khóa cửa cuốn, kiểm kê tiền lẻ, gửi ảnh báo cáo nhóm, kiểm tra van nước, tắt loa nhạc, đổ bã trà. Nhân viên liên tục quên việc và đóng cửa rất muộn. Áp dụng Gom khối: Quản lý chia 16 việc thành đúng 3 khối logic tuần tự: (1) Khối Thiết bị & An toàn (máy pha, bã trà, siro, tủ lạnh, van nước, rác); (2) Khối Tiền & Số liệu (in báo cáo Z, kiểm két, đếm tiền lẻ, gửi nhóm); (3) Khối Niêm phong & Rời quán (sàn bếp, máy lạnh, đèn/loa, khóa cửa cuốn). Kết quả: nhân viên mới nắm bắt quy trình chỉ sau một ca hướng dẫn, tỷ lệ sót việc giảm về 0 và thời gian đóng ca rút ngắn từ 45 phút xuống 20 phút. Bài học: nén nhiều việc nhỏ vào vài khối lớn giúp não bộ ghi nhớ chính xác và hành động mượt mà.","ct_bien_the":"Mô hình tải nhận thức (Cognitive Load Theory của John Sweller); Lý thuyết mã hóa kép (Dual-Coding Theory của Paivio); Kỹ thuật ghi nhớ theo cung điện ký ức (Memory Palace).","ct_gioi_han":"Khối chỉ có tác dụng khi người học thực sự hiểu ý nghĩa và mối liên kết logic bên trong; gom cơ học theo kiểu thuộc vẹt sẽ vỡ vụn khi chịu áp lực. Không áp dụng để nén các dữ liệu ngẫu nhiên không có quy luật logic hoặc các bài toán phân tích đòi hỏi bóc tách chi tiết độc lập.","ct_sai_lam":"Gom quá 5 khối trong một lần ghi nhớ khiến não bộ tiếp tục bị quá tải || Gom nhóm ngẫu nhiên không dựa trên bản chất logic khiến việc truy xuất bị nghẽn || Đặt tên nhãn khối mơ hồ không gợi nhớ được các thành phần con || Quên ôn tập truy xuất khiến các liên kết giữa các mẩu thông tin trong khối bị đứt gãy","ct_tu_kiem_tra":"Dung lượng tối ưu của các khối thông tin trong trí nhớ làm việc của người trưởng thành theo các nghiên cứu nhận thức hiện đại là bao nhiêu? ⇒ Khoảng 3 đến 4 khối có ý nghĩa. || Điều kiện tiên quyết để việc gom khối phát huy tác dụng ghi nhớ là gì? ⇒ Các mẩu thông tin bên trong khối phải có mối liên kết logic hoặc mẫu hình mà người học thực sự hiểu. || Vì sao gom khối giúp giải quyết tình trạng kiệt sức nhận thức khi làm việc? ⇒ Vì nó nén nhiều dữ liệu rời rạc thành một vài đơn vị lớn, giải phóng dung lượng băng thông cho não bộ.","ct_tai_lieu":"TL176,TL177,TL178","ct_ghi_chu":"Con số của Miller (1956) là 7 ± 2 cho các kích thích thô; các nghiên cứu nhận thức hiện đại (như Nelson Cowan, 2001) làm rõ rằng dung lượng trí nhớ làm việc thực tế cho các khối có ý nghĩa chỉ là khoảng 4."},{"id":"KHUNG-01","thu_tu":10,"tuan":1,"ngay":3,"nhom_hoc":"Vòng giải quyết vấn đề","uu_tien":15,"muc_uu_tien":"A – cốt lõi","loai":"khung","nhom":"Khung – Nạp & quản lý","ten":"Tư duy nhanh – chính xác 5 bước","ten_goc":"Tổng hợp: Cynefin (Snowden), cửa 1 chiều/2 chiều (Bezos), RPD (Klein), Pre-mortem (Klein), Decision Journal","neu":"Gặp một tình huống cần quyết định nhanh mà vẫn phải đúng","thi":"Nạp mẫu hình → 10 giây định vị (loại tình huống, làm lại được không) → chạy thử trong đầu → chặn điểm mù → ghi nhật ký","vi_du":"Khách hủy đơn lớn: 10 giây thấy là việc làm lại được (cửa 2 chiều) → đủ 70% thông tin thì gọi đàm phán ngay.","gioi_han":"Không thay được chuyên môn: thiếu \"thư viện mẫu hình\" thì bước 3 chỉ là đoán. Quyết định cửa 1 chiều bắt buộc đi chậm qua bước 3–4.","tu_khoa":"quyết định nhanh, 10 giây, Cynefin, cửa 1 chiều, 70%","de_nham_voi":"KHUNG-02","chuoi_hoc":"Vòng giải quyết vấn đề","kieu_hoc":"chuoi","buoc":10,"truoc":"KHUNG-02","cap_doi":"KHUNG-02","khac_nhau":"5 bước là cả quy trình quyết định; Gom khối chỉ là bước nạp dữ liệu","ct_nguon_goc":"Mô hình tích hợp từ các thành tựu hàng đầu về ra quyết định: Khung Cynefin của Dave Snowden (2007) để phân loại bối cảnh; mô hình Quyết định cửa 1 chiều và 2 chiều trong thư gửi cổ đông năm 2015 của Jeff Bezos; mô hình Ra quyết định dựa trên nhận diện mẫu hình (RPD) và kỹ thuật Tiền khám nghiệm (Pre-mortem) của Gary Klein (1998, 2007); kết hợp với Nhật ký quyết định (Decision Journal).","ct_co_che":"Khi đối mặt áp lực thời gian, não bộ con người dễ rơi vào hai thái cực cực đoan: hoặc hoảng loạn ra quyết định bốc đồng theo cảm xúc (Hệ 1 bị thiên kiến), hoặc tê liệt vì phân tích cố tìm kiếm sự an toàn tuyệt đối 100% (Hệ 2 quá tải). Quy trình 5 bước thiết lập một cấu trúc tinh gọn: 10 giây định vị bản chất vấn đề và khả năng đảo ngược của quyết định, kích hoạt thư viện trực giác chuyên gia thông qua việc mô phỏng kịch bản nhanh, sau đó dùng chốt chặn điểm mù để ngăn ngừa thảm họa trước khi khóa quyết định vào văn bản.","ct_bang_chung":"B – Từng thành phần riêng lẻ (RPD, Pre-mortem, phân loại quyết định) đều có nghiên cứu thực chứng ủng hộ mạnh mẽ trong quân sự, y tế cấp cứu và quản trị doanh nghiệp lớn; mô hình tổng hợp 5 bước là khung thực hành tích hợp.","ct_quy_trinh":"Nạp mẫu hình và nhận diện bối cảnh bằng 3 câu hỏi thực tế || Dành 10 giây định vị: đây là quyết định cửa 1 chiều hay 2 chiều, tình huống đơn giản hay phức tạp || Chạy mô phỏng kịch bản hành động trong đầu để xem có điểm nghẽn vật lý không || Dừng lại 1 phút hỏi điều gì có thể làm hỏng việc để chặn điểm mù || Ghi nhật ký quyết định gồm giả định, dữ liệu hiện có và kết quả kỳ vọng","ct_vi_du_mau":"Tình huống: Vào lúc 11h trưa cao điểm, hệ thống kiosk tự động của chuỗi trà sữa bị lỗi cổng thanh toán điện tử, khách xếp hàng dài ùn ứ trước màn hình. Nhân viên hoảng loạn gọi điện hỏi quản lý có nên tắt máy chuyển sang bán trà đóng chai thu tiền mặt tạm thời với giá giảm 20% hay chờ kỹ thuật viên phần mềm sửa từ xa. Áp dụng 5 bước: (1) Nạp mẫu hình: nhận diện đây là sự cố nghẽn dòng tiền và trải nghiệm khách giờ trưa; (2) Định vị 10 giây: đây là quyết định \"cửa 2 chiều\" (hành động tạm thời, có thể bật lại máy ngay khi mạng thông, làm sai chỉ tốn vài trăm nghìn bù trừ nhưng giữ được khách); (3) Chạy thử trong đầu: nhân viên bưng khay trà ra chào mời, thu tiền mặt hoặc quét mã QR cá nhân chuyển khoản – hoàn toàn khả thi trong 2 phút; (4) Chặn điểm mù: tránh thất thoát tiền mặt bằng cách giao đúng 50 chai và lập tức thu đủ tiền đối soát số chai bán ra; (5) Ghi nhật ký: ghi lại quyết định chuyển đổi phương án bán thủ công và nguyên nhân lỗi để đối soát với bên đối tác phần mềm chiều nay. Kết quả: trong 30 phút nghẽn mạng, kiosk giải phóng được 42 khách, bán hết 42 chai trà, không để xảy ra ẩu đả hay đánh giá 1 sao. Bài học: phân loại cửa 2 chiều giúp hành động dứt khoát khi chỉ mới có 70% dữ liệu.","ct_bien_the":"Vòng OODA của John Boyd (Quan sát - Định hướng - Quyết định - Hành động); Mô hình ra quyết định chớp nhoáng (Naturalistic Decision Making - NDM).","ct_gioi_han":"Hoàn toàn vô hiệu nếu người ra quyết định chưa có \"thư viện mẫu hình\" tích lũy từ trước thông qua trải nghiệm thực chiến hoặc học tập trường hợp. Với các quyết định \"cửa 1 chiều\" sinh tử (bán công ty, sáp nhập, đầu tư toàn bộ vốn liếng), tuyệt đối không dùng bước đi tắt 10 giây mà phải chuyển sang hội đồng phản biện và phân tích rủi ro sâu.","ct_sai_lam":"Xem quyết định cửa 1 chiều như cửa 2 chiều rồi hành động ẩu đả không thể cứu vãn || Xem quyết định cửa 2 chiều như cửa 1 chiều khiến tổ chức bị tê liệt phân tích || Quên ghi chép nhật ký quyết định khiến tổ chức không học hỏi được từ các sai lầm trong quá khứ || Bỏ qua bước kiểm tra điểm mù vì quá tự tin vào trực giác cá nhân","ct_tu_kiem_tra":"Quyết định cửa 2 chiều là gì và nguyên tắc xử lý ra sao? ⇒ Là quyết định có thể đảo ngược dễ dàng nếu sai; nguyên tắc là chỉ cần khoảng 70% thông tin là hành động ngay. || Yếu tố cốt lõi nào quyết định độ chính xác khi ra quyết định nhanh? ⇒ Thư viện mẫu hình và trải nghiệm đã được tích lũy từ trước trong trí nhớ dài hạn. || Vì sao phải ghi nhật ký quyết định ngay sau khi lựa chọn? ⇒ Để đối chiếu khách quan giữa kỳ vọng ban đầu và kết quả thực tế, loại trừ thiên kiến nhận thức muộn (hindsight bias).","ct_tai_lieu":"TL011,TL012,TL013,TL015","ct_ghi_chu":"Mô hình tổng hợp mang tính ứng dụng thực chiến cao, gom các công cụ riêng lẻ của Snowden, Bezos và Klein thành một quy trình tác chiến thống nhất."},{"id":"QL-KT-01","thu_tu":11,"tuan":1,"ngay":4,"nhom_hoc":"Quán trà sữa (kinh tế vi mô)","uu_tien":15,"muc_uu_tien":"A – cốt lõi","loai":"quy_luat","nhom":"QL kinh tế","ten":"Cung – cầu","ten_goc":"Law of supply and demand – Alfred Marshall","neu":"Giá một hàng hoá tăng, các yếu tố khác giữ nguyên","thi":"Người mua mua ít đi (lượng cầu giảm), người bán muốn bán nhiều hơn (lượng cung tăng)","vi_du":"Giá thịt heo tăng → nhà hàng chuyển sang gà; trại nuôi tăng đàn.","gioi_han":"Ngoại lệ: hàng xa xỉ thể hiện đẳng cấp (Veblen), đầu cơ khi kỳ vọng giá tăng tiếp; ngắn hạn cung khó tăng ngay.","tu_khoa":"giá tăng, mua ít đi, bán nhiều hơn, khan hiếm","de_nham_voi":"QL-KT-03","chuoi_hoc":"Quán trà sữa (kinh tế vi mô)","kieu_hoc":"chuoi","buoc":1,"sau":"QL-KT-03","cap_doi":"QL-KT-03","khac_nhau":"Cung – cầu: giá đổi thì lượng mua, bán đổi; Cạnh tranh: nhiều người bán ép giá về gần chi phí","ct_nguon_goc":"Quy luật cung – cầu được các nhà kinh tế học cổ điển như Adam Smith (1776) thảo luận qua khái niệm \"bàn tay vô hình\", nhưng người đầu tiên mô hình hóa toán học hoàn chỉnh với đường cung và đường cầu giao nhau tại điểm cân bằng là Alfred Marshall trong tác phẩm kinh điển Các nguyên lý kinh tế học (1890). Mô hình của Marshall đã đặt nền móng cho kinh tế học vi mô hiện đại.","ct_co_che":"Quy luật vận hành dựa trên động lực tối ưu hóa lợi ích của hai chủ thể độc lập trên thị trường. Về phía cầu, khi giá một mặt hàng tăng lên, người mua đối mặt với chi phí cơ hội lớn hơn và lợi ích biên trên mỗi đồng tiền chi ra giảm đi (hiệu ứng thay thế và hiệu ứng thu nhập), khiến họ giảm lượng mua. Về phía cung, giá bán cao hơn mở ra biên lợi nhuận lớn hơn, thúc đẩy các nhà sản xuất hiện tại gia tăng sản lượng và thu hút thêm doanh nghiệp mới tham gia sản xuất. Cơ chế giá cả đóng vai trò tín hiệu phân bổ nguồn lực xã hội đến nơi có nhu cầu cấp thiết nhất.","ct_bang_chung":"A – Là một trong những quy luật kinh tế học được kiểm chứng thực nghiệm rộng rãi và vững chắc nhất trong lịch sử kinh tế học thông qua hàng triệu thị trường hàng hóa, dịch vụ và tài chính toàn cầu.","ct_quy_trinh":"Xác định rõ ràng thị trường hàng hóa hoặc dịch vụ cụ thể đang xét || Phân tích các yếu tố làm dịch chuyển lượng cầu (thu nhập, sở thích, giá hàng thay thế) || Phân tích các yếu tố làm dịch chuyển lượng cung (chi phí nguyên liệu, công nghệ, thời tiết) || Xác định hướng biến động của giá để tìm điểm cân bằng mới || Đưa ra quyết định kinh doanh hoặc tiêu dùng dựa trên sự mất cân đối cung cầu","ct_vi_du_mau":"Tình huống: Vào đợt nắng nóng đỉnh điểm tháng 5 tại TP.HCM, nhu cầu giải khát của nhân viên văn phòng tăng đột biến khiến lượng cầu trà sữa và nước ép giao tận nơi tăng 40%. Đồng thời, giá nguyên liệu chanh dây và cam sành nhập vào tăng thêm 25% do hạn mặn tại miền Tây làm giảm nguồn cung nông sản. Áp dụng quy luật Cung – Cầu: Chuỗi trà sữa phân tích thị trường: nhu cầu giải nhiệt rất cao nhưng lượng cung đồ uống trái cây tươi toàn khu vực đang khan hiếm. Chuỗi quyết định không giữ nguyên giá cũ để rồi hết hàng sớm, cũng không tăng giá thẳng trên menu làm khách phản cảm. Giải pháp: chuỗi tung ra phiên bản đồ uống dung tích lớn (Size XL 1 lít) với giá cao hơn 30%, kết hợp điều chỉnh tỷ lệ nguyên liệu sang các dòng trà ủ lạnh thảo mộc ít phụ thuộc vào trái cây tươi bị khan hiếm. Kết quả: chuỗi đáp ứng trọn vẹn nhu cầu giải khát mùa nóng của khách hàng văn phòng, sản lượng bán ra tăng 35% mà không bị đứt gãy nguồn cung, biên lợi nhuận gộp toàn hệ thống vẫn duy trì ở mức 62%. Bài học: đọc đúng tín hiệu cung cầu giúp định giá thông minh và tái cấu trúc sản phẩm kịp thời.","ct_bien_the":"Độ co giãn của cầu theo giá (Price Elasticity of Demand); Độ co giãn chéo; Cân bằng thị trường bộ phận và cân bằng tổng thể (Walras).","ct_gioi_han":"Quy luật bị sai lệch hoặc vô hiệu trong các trường hợp: hàng hóa Veblen (hàng xa xỉ càng tăng giá người mua càng thèm muốn để khẳng định đẳng cấp); hàng hóa Giffen (lương thực thiết yếu tăng giá người nghèo vẫn phải mua nhiều hơn vì không còn tiền mua thịt); thị trường tài sản đầu cơ khi tâm lý bầy đàn kỳ vọng giá sẽ còn tăng mãi; hoặc khi có sự can thiệp giá trần/giá sàn cứng nhắc của nhà nước.","ct_sai_lam":"Nhầm lẫn giữa \"thay đổi lượng cầu\" (di chuyển dọc theo đường cầu do giá đổi) với \"thay đổi cầu\" (dịch chuyển cả đường cầu do thị hiếu/thu nhập) || Tự động tăng giá vô tội vạ mà không đo lường độ co giãn của cầu theo giá || Bỏ qua chi phí cơ hội và thời gian trễ của nguồn cung trong ngắn hạn || Áp dụng máy móc mô hình cung cầu hoàn hảo cho thị trường độc quyền nhóm","ct_tu_kiem_tra":"Điều gì xảy ra với lượng cầu khi giá một mặt hàng thông thường tăng lên? ⇒ Lượng cầu giảm xuống do người mua chuyển sang hàng thay thế hoặc giảm sức mua. || Điểm cân bằng thị trường được xác định như thế nào? ⇒ Là mức giá mà tại đó lượng người mua sẵn sàng mua đúng bằng lượng người bán sẵn sàng bán. || Hàng hóa Veblen đi ngược lại quy luật cầu như thế nào? ⇒ Giá càng tăng thì lượng cầu càng tăng, vì người mua dùng nó để phô trương vị thế xã hội.","ct_tai_lieu":"TL155,TL170","ct_ghi_chu":"Quy luật này giả định thị trường có tính cạnh tranh và thông tin minh bạch; trong thế giới thực luôn tồn tại độ trễ về mặt thời gian khi nguồn cung điều chỉnh."},{"id":"QL-KT-03","thu_tu":12,"tuan":1,"ngay":4,"nhom_hoc":"Quán trà sữa (kinh tế vi mô)","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"quy_luat","nhom":"QL kinh tế","ten":"Cạnh tranh","ten_goc":"Perfect competition – kinh tế học tân cổ điển","neu":"Thị trường nhiều người bán, vào ra tự do, không ai độc quyền","thi":"Giá bị ép về gần chi phí sản xuất, lãi siêu ngạch mất dần, người mua được lợi","vi_du":"Nhiều quán trà sữa mở cùng phố → giá giảm, chất lượng phải tăng mới giữ khách.","gioi_han":"Ít thị trường cạnh tranh hoàn hảo; thông tin lệch, thương hiệu, hiệu ứng mạng làm cạnh tranh méo.","tu_khoa":"nhiều người bán, không rào cản, giá giảm, chất lượng tăng","de_nham_voi":"QL-KT-01","chuoi_hoc":"Quán trà sữa (kinh tế vi mô)","kieu_hoc":"chuoi","buoc":2,"truoc":"QL-KT-01","sau":"QL-KT-05","cap_doi":"QL-KT-01","khac_nhau":"Cung – cầu: giá đổi thì lượng mua, bán đổi; Cạnh tranh: nhiều người bán ép giá về gần chi phí","ct_nguon_goc":"Khái niệm cạnh tranh hoàn hảo bắt nguồn từ các nhà kinh tế học cổ điển như Adam Smith với phép ẩn dụ \"bàn tay vô hình\" năm 1776. Sau đó, mô hình thị trường cạnh tranh hoàn hảo và phân tích cân bằng dài hạn được các nhà kinh tế học tân cổ điển như Léon Walras, Alfred Marshall và Frank Knight hoàn thiện và toán học hóa chặt chẽ trong thế kỷ 19 và đầu thế kỷ 20.","ct_co_che":"Khi một ngành kinh doanh có rào cản gia nhập thấp và tạo ra lợi nhuận kinh tế dương (lợi nhuận siêu ngạch), tín hiệu này lập tức thu hút các nhà đầu tư và đối thủ mới ồ ạt đổ vốn tham gia. Nguồn cung toàn thị trường tăng vọt làm đường cung dịch sang phải, buộc giá bán cân bằng phải hạ xuống. Đồng thời, các nhà sản xuất phải cạnh tranh gay gắt để giành giật khách hàng, đẩy giá bán tiến dần về chi phí biên và chi phí trung bình tối thiểu. Quá trình này triệt tiêu lợi nhuận siêu ngạch, đưa lợi nhuận kinh tế dài hạn về bằng 0 và tối đa hóa thặng dư của người tiêu dùng.","ct_bang_chung":"A – Được kiểm chứng thực nghiệm rộng rãi trong kinh tế học vi mô, tài chính doanh nghiệp và chính sách chống độc quyền; hiện tượng bào mòn biên lợi nhuận khi mở cửa thị trường tự do diễn ra nhất quán trên toàn cầu.","ct_quy_trinh":"Xác định rõ cấu trúc ngành và mức độ rào cản gia nhập thị trường || Theo dõi tỷ suất lợi nhuận bình quân của ngành để dự báo làn sóng đối thủ mới || Tính toán chi phí sản xuất biên và chi phí đơn vị tối thiểu của chính mình || Tìm kiếm các yếu tố tạo sự khác biệt thực sự hoặc tối ưu hóa hiệu quả chi phí || Chủ động chuyển dịch mô hình kinh doanh trước khi lợi nhuận siêu ngạch bị triệt tiêu hoàn toàn","ct_vi_du_mau":"Tình huống: Khi chuỗi kiosk trà sữa tự động thí điểm thành công rực rỡ tại các tòa nhà văn phòng với biên lợi nhuận ròng lên tới 35%, chỉ trong vòng 4 tháng sau, đã có 3 đơn vị khác sao chép mô hình và đặt máy ngay cùng sảnh hoặc tòa nhà kế bên. Các đối thủ bắt đầu cuộc chiến hạ giá từ 30.000 đồng xuống 22.000 đồng/ly. Áp dụng quy luật Cạnh tranh: Quản lý nhận định thị trường đang tiến về trạng thái cạnh tranh gay gắt, việc cố bám giữ giá cũ sẽ mất khách, nhưng nếu chỉ hạ giá đơn thuần thì biên lợi nhuận sẽ về 0. Chuỗi quyết định triển khai 2 mũi nhọn: (1) Đàm phán ký hợp đồng thuê vị trí độc quyền dài hạn 2 năm tại sảnh các tòa nhà lớn nhằm dựng rào cản pháp lý gia nhập; (2) Chuyển đổi định vị sang dòng trà thảo mộc organic có chứng nhận chất lượng rõ ràng kèm chương trình tích điểm đổi quà trên app. Kết quả: trong khi các đối thủ cạnh tranh bằng cách giảm giá liên tục bị lỗ vì chi phí vận hành và dần phải rút lui, chuỗi giữ vững được 75% thị phần tại các tòa nhà trọng điểm với mức giá ổn định 28.000 đồng/ly. Bài học: lợi nhuận cao luôn mời gọi đối thủ; không xây dựng hào kinh tế phòng thủ thì cạnh tranh sẽ bào mòn sạch lợi nhuận.","ct_bien_the":"Lý thuyết thị trường có thể tranh chấp (Contestable Markets Theory của Baumol); Mô hình 5 áp lực cạnh tranh của Michael Porter (Porter's Five Forces); Cạnh tranh độc quyền (Monopolistic Competition của Chamberlin).","ct_gioi_han":"Mô hình lý thuyết thuần túy giả định thông tin hoàn hảo, sản phẩm đồng nhất tuyệt đối và không có rào cản gia nhập/rút lui. Trong thực tế, các yếu tố như độc quyền tự nhiên, bằng sáng chế độc quyền, sự bất cân xứng thông tin, hiệu ứng mạng lưới và sức mạnh thương hiệu làm biến dạng cơ chế cạnh tranh hoàn hảo.","ct_sai_lam":"Ảo tưởng rằng mức lợi nhuận siêu ngạch hiện tại sẽ kéo dài mãi mãi mà không có đối thủ nhảy vào || Lao vào cuộc chiến hạ giá xuống dưới giá thành mà không có lợi thế chi phí quy mô || Nhầm lẫn giữa thị trường cạnh tranh gay gắt với thị trường cạnh tranh hoàn hảo || Bỏ qua chi phí chìm và chi phí chuyển đổi của khách hàng","ct_tu_kiem_tra":"Điều gì tất yếu xảy ra trong dài hạn khi một ngành kinh doanh có rào cản gia nhập thấp đạt lợi nhuận rất cao? ⇒ Các đối thủ mới sẽ ồ ạt gia nhập, tăng nguồn cung và kéo giá bán về sát chi phí sản xuất, triệt tiêu lợi nhuận siêu ngạch. || Vì sao người tiêu dùng luôn là bên hưởng lợi nhiều nhất từ quy luật cạnh tranh? ⇒ Vì cạnh tranh buộc các doanh nghiệp phải liên tục hạ giá bán và nâng cao chất lượng dịch vụ để tồn tại. || Làm thế nào một doanh nghiệp có thể thoát khỏi vòng xoáy bào mòn giá của cạnh tranh hoàn hảo? ⇒ Bằng cách tạo ra sự khác biệt độc đáo, sở hữu tài sản trí tuệ hoặc xây dựng hào kinh tế (economic moat).","ct_tai_lieu":"TL155,TL170","ct_ghi_chu":"Frank Knight (1921) trong tác phẩm \"Risk, Uncertainty and Profit\" là người đầu tiên đặt ra các giả định toán học khắt khe cho thị trường cạnh tranh hoàn hảo."},{"id":"QL-KT-05","thu_tu":13,"tuan":1,"ngay":4,"nhom_hoc":"Quán trà sữa (kinh tế vi mô)","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"quy_luat","nhom":"QL kinh tế","ten":"Năng suất biên giảm dần","ten_goc":"Law of diminishing marginal returns – David Ricardo, Turgot","neu":"Liên tục thêm một yếu tố (người, nguyên liệu) khi yếu tố khác cố định","thi":"Sản lượng thêm của mỗi đơn vị bổ sung giảm dần, có lúc âm","vi_du":"Bếp 4 m² thêm đầu bếp thứ 5, thứ 6 → vướng nhau, món ra chậm hơn.","gioi_han":"Chỉ trong ngắn hạn khi có yếu tố cố định; mở rộng bếp hoặc đổi công nghệ thì đường năng suất dịch lên.","tu_khoa":"thêm người, cố định, quá tải, năng suất giảm","de_nham_voi":"QL-KT-06,QL-KT-02","chuoi_hoc":"Quán trà sữa (kinh tế vi mô)","kieu_hoc":"chuoi","buoc":3,"truoc":"QL-KT-03","sau":"QL-KT-06","cap_doi":"QL-KT-06,QL-KT-02","khac_nhau":"Lợi ích biên ở phía người mua dùng thêm; Năng suất biên ở phía người làm thêm đầu vào || Quy luật giá trị so chi phí của mình với mức xã hội; Năng suất biên nói về đơn vị đầu vào thêm","ct_nguon_goc":"Quy luật được nhà kinh tế học người Pháp Anne-Robert-Jacques Turgot đề cập lần đầu tiên vào năm 1767 trong lĩnh vực nông nghiệp (độ phì nhiêu của đất đai). Sau đó, David Ricardo (1817) đã hệ thống hóa và phát triển thành một nguyên lý nền tảng trong tác phẩm \"Các nguyên lý của kinh tế chính trị học và thuế khóa\", chỉ ra rằng việc canh tác thêm lao động trên những mảnh đất hữu hạn sẽ mang lại sản lượng biên ngày càng giảm.","ct_co_che":"Quy luật bắt nguồn từ giới hạn vật lý của các yếu tố đầu vào cố định trong ngắn hạn (như diện tích mặt bằng, công suất máy móc, băng thông công nghệ). Khi ta liên tục bổ sung một yếu tố đầu vào biến đổi (như số lượng công nhân, lượng phân bón, chi phí quảng cáo) vào một hệ thống có các yếu tố khác không đổi, tỷ lệ kết hợp tối ưu giữa các nguồn lực sẽ bị phá vỡ. Ban đầu, sự chuyên môn hóa giúp sản lượng biên tăng, nhưng khi đạt đến ngưỡng bão hòa, các đơn vị bổ sung sẽ bắt đầu cản trở lẫn nhau (người lao động vướng víu, máy móc quá tải, kênh truyền thông bão hòa), dẫn đến việc đóng góp của mỗi đơn vị đầu vào mới giảm dần và thậm chí gây hại cho tổng sản lượng.","ct_bang_chung":"A – Được chứng minh bằng vô số dữ liệu thực nghiệm trong nông nghiệp, sản xuất công nghiệp, kinh tế học vi mô và quản trị chuỗi cung ứng trên toàn thế giới.","ct_quy_trinh":"Xác định rõ ràng yếu tố đầu vào nào đang cố định và yếu tố nào đang biến đổi || Đo lường chính xác sản lượng biên gia tăng trên từng đơn vị đầu vào bổ sung || Lập bảng hoặc vẽ đồ thị theo dõi mối quan hệ giữa đầu vào và sản lượng biên || Xác định điểm cực đại của năng suất biên (ngưỡng tối ưu hóa phân công lao động) || Nhận diện điểm sản lượng biên bắt đầu suy giảm để dừng ngay việc bổ sung mù quáng || Đầu tư nâng cấp yếu tố cố định hoặc đổi mới công nghệ nếu muốn mở rộng sản lượng","ct_vi_du_mau":"Tình huống: Gian bếp chuẩn bị nguyên liệu trung tâm của chuỗi trà sữa có diện tích cố định 20 m² với 2 bàn sơ chế inox. Ban đầu, có 2 nhân viên bếp làm việc, sản xuất được 200 lít cốt trà và trân châu mỗi ngày (bình quân 100 lít/người). Khi nhu cầu tăng, quản lý tuyển thêm nhân viên thứ 3, sản lượng tăng lên 330 lít/ngày (sản lượng biên của người thứ ba là 130 lít nhờ phân chia người nấu người đóng gói). Thấy hiệu quả, quản lý tuyển tiếp người thứ 4, sản lượng chỉ tăng lên 410 lít (sản lượng biên giảm xuống 80 lít). Sai lầm xảy ra khi quản lý tiếp tục tuyển người thứ 5 và thứ 6: gian bếp trở nên chật chội, nhân viên va vào nhau khi di chuyển, tranh nhau nồi nấu và vòi nước rửa, khiến sản lượng ngày giảm xuống chỉ còn 380 lít kèm theo 2 vụ bỏng nước sôi. Áp dụng quy luật: Quản lý nhận diện ngay năng suất biên của người thứ 5 và thứ 6 đã mang giá trị âm. Quyết định: chuyển 2 nhân viên này sang ca đêm để tận dụng bếp trống hoặc giữ nguyên đội hình 3 người và đầu tư thêm máy làm trân châu tự động (thay đổi yếu tố công nghệ cố định). Kết quả: sản lượng ổn định ở mức 450 lít/ngày mà không cần chen chúc. Bài học: thêm người vào một không gian cố định không làm tăng kết quả mà chỉ tăng sự hỗn loạn.","ct_bien_the":"Hàm sản xuất Cobb-Douglas; Định luật Amdahl trong khoa học máy tính (tăng thêm vi xử lý nhưng tốc độ cải thiện giảm dần); Hiệu suất không đổi và hiệu suất giảm theo quy mô (Decreasing Returns to Scale).","ct_gioi_han":"Quy luật chỉ đúng trong ngắn hạn khi có ít nhất một yếu tố sản xuất được giữ cố định. Trong dài hạn, khi doanh nghiệp có thể thay đổi toàn bộ quy mô (mở rộng nhà xưởng, mua thêm máy móc, nâng cấp công nghệ), đường năng suất biên sẽ dịch chuyển lên trên và quy luật tạm thời chưa chi phối.","ct_sai_lam":"Nhầm lẫn giữa tổng sản lượng giảm và sản lượng biên giảm (sản lượng biên giảm nhưng tổng sản lượng vẫn có thể tăng chậm) || Nghĩ rằng cứ bơm thêm vốn hoặc người là hiệu suất làm việc sẽ tăng tuyến tính || Không nhận diện được yếu tố cố định đang đóng vai trò nút thắt cổ chai || Chờ đến khi sản lượng biên rơi xuống mức âm mới nhận ra sự lãng phí","ct_tu_kiem_tra":"Điều kiện cốt lõi để quy luật năng suất biên giảm dần xuất hiện là gì? ⇒ Phải có ít nhất một yếu tố sản xuất được giữ cố định trong ngắn hạn. || Năng suất biên mang giá trị âm nghĩa là gì? ⇒ Nghĩa là việc bổ sung thêm một đơn vị đầu vào làm cho tổng sản lượng chung bị sụt giảm. || Để vượt qua ngưỡng giới hạn của năng suất biên giảm dần, nhà quản lý phải làm gì? ⇒ Phải đầu tư mở rộng yếu tố cố định hoặc áp dụng công nghệ và quy trình vận hành mới.","ct_tai_lieu":"TL156,TL170","ct_ghi_chu":"Turgot mô tả quy luật này trên đất nông nghiệp, Ricardo khái quát hóa thành lý thuyết địa tô kinh điển."},{"id":"QL-KT-06","thu_tu":14,"tuan":1,"ngay":4,"nhom_hoc":"Quán trà sữa (kinh tế vi mô)","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"quy_luat","nhom":"QL kinh tế","ten":"Lợi ích biên giảm dần","ten_goc":"Diminishing marginal utility – Gossen; Jevons, Menger, Walras","neu":"Dùng liên tục thêm cùng một thứ trong thời gian ngắn","thi":"Mỗi đơn vị sau đem lại ít thoả mãn hơn đơn vị trước","vi_du":"Ly trà sữa thứ nhất rất ngon, ly thứ ba thấy ngán.","gioi_han":"Ngoại lệ: đồ sưu tầm, chất gây nghiện, sản phẩm có hiệu ứng mạng (càng nhiều người dùng càng giá trị).","tu_khoa":"dùng liên tục, ngán, thoả mãn giảm, đơn vị thêm","de_nham_voi":"QL-KT-05","chuoi_hoc":"Quán trà sữa (kinh tế vi mô)","kieu_hoc":"chuoi","buoc":4,"truoc":"QL-KT-05","sau":"QL-KT-07","cap_doi":"QL-KT-05","khac_nhau":"Lợi ích biên ở phía người mua dùng thêm; Năng suất biên ở phía người làm thêm đầu vào","ct_nguon_goc":"Quy luật được nhà kinh tế học người Đức Hermann Heinrich Gossen phát biểu lần đầu tiên vào năm 1854 (được biết đến là Định luật thứ nhất của Gossen). Sau đó, trong cuộc \"Cách mạng cận biên\" thập

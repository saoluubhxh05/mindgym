hang khác gì với Thế lưỡng nan an ninh? ⇒ Đáp trả là phản ứng trước cuộc tấn công trực diện; lưỡng nan an ninh là phản ứng vì sợ hãi trước sự phòng thủ của bên kia. || Cách hiệu quả nhất để dừng vòng lặp này là gì? ⇒ Không phản ứng ngay lập tức bằng cảm xúc và chuyển sang thảo luận khách quan về sự việc.","ct_tai_lieu":"TL131,TL096"},{"id":"CH-LT-05","thu_tu":87,"tuan":5,"ngay":2,"nhom_hoc":"Leo thang","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"chuoi","nhom":"Chuỗi leo thang – 5. Chuỗi cạnh tranh leo thang","ten":"Leo thang xung đột","ten_goc":"Conflict spiral – Pruitt & Rubin","neu":"Bất đồng","thi":"căng thẳng","chuoi":"Bất đồng → phản ứng → tăng mức → căng thẳng","vi_du":"Tranh luận về phân công → kéo chuyện cũ → đòi nghỉ.","gioi_han":"Có thể hạ nhiệt bằng bên thứ ba hoặc tách vấn đề khỏi con người.","tu_khoa":"Bất đồng, phản ứng, tăng mức, căng thẳng","chuoi_hoc":"Leo thang","kieu_hoc":"chuoi","buoc":3,"truoc":"CH-LT-04","sau":"CH-LT-02","ct_nguon_goc":"Mô hình \"vòng xoáy xung đột\" (conflict spiral) được Dean Pruitt và Jeffrey Rubin trình bày chi tiết trong cuốn Social Conflict (1986). Nó mô tả sự dịch chuyển của mâu thuẫn từ mức độ nhẹ, lý trí sang mức độ nặng nề, cảm xúc và phi lý trí. Khái niệm này kết tinh từ nhiều thập kỷ nghiên cứu về đàm phán, động lực học nhóm và quan hệ quốc tế.","ct_co_che":"Xung đột thường trải qua 5 sự dịch chuyển: từ chiến thuật nhẹ sang nặng (nhờ vả → đe dọa); từ vấn đề hẹp sang rộng (chuyện hôm nay → lỗi lầm quá khứ); từ cụ thể sang chung chung (một lỗi nhỏ → bản chất con người); từ mong muốn đạt kết quả sang mong muốn chiến thắng; và cuối cùng là mong muốn triệt hạ đối phương. Cơ chế tâm lý đằng sau là sự kích hoạt hạch hạnh nhân (amygdala hijack) khi con người cảm thấy bị đe dọa, khiến lý trí bị vô hiệu hóa, nhường chỗ cho bản năng chiến đấu.","ct_bang_chung":"A – Được củng cố mạnh mẽ bởi các nghiên cứu tâm lý học xã hội và đàm phán; mô hình này là nền tảng cho nhiều khung hòa giải xung đột hiện đại.","ct_quy_trinh":"Nhận diện sự dịch chuyển từ việc bàn luận \"vấn đề\" sang chỉ trích \"con người\" || Cắt đứt nguồn cơn bằng cách yêu cầu tạm dừng cuộc họp (time-out) 15-30 phút để hạ nhiệt não bộ || Khi bắt đầu lại, thiết lập quy tắc chỉ tập trung vào một vấn đề duy nhất ở hiện tại || Dùng ngôn ngữ \"Tôi cảm thấy... khi sự việc này xảy ra\" thay vì \"Anh luôn luôn...\" || Nếu hai bên quá bế tắc, mời một bên thứ ba trung lập vào điều phối","ct_vi_du_mau":"Tình huống: Trong buổi họp, nhóm kỹ thuật từ chối yêu cầu tính năng từ nhóm sản phẩm (bất đồng). Nhóm sản phẩm phản ứng: \"Các anh lúc nào cũng làm khó, không chịu nghĩ cho user\" (mở rộng vấn đề, công kích nhóm). Nhóm kỹ thuật bực mình: \"Còn các anh chỉ biết vẽ vời vô lý, chả có kiến thức gì\" (tăng mức, công kích cá nhân). Xung đột leo thang căng thẳng, hai bên dọa nghỉ việc. Áp dụng: Giám đốc (bên thứ ba) lập tức can thiệp, tuyên bố giải lao 20 phút. Sau đó, ông yêu cầu bỏ qua mọi lời chỉ trích, đưa cuộc họp về đúng một điểm hẹp: \"Tính năng A mất bao nhiêu giờ để code?\". Kết quả: Sự can thiệp tách con người ra khỏi vấn đề đã làm gãy vòng xoáy. Hai nhóm quay lại thảo luận kỹ thuật, chốt phương án cắt giảm một phần tính năng để kịp tiến độ.","ct_bien_the":"Thang xung đột của Friedrich Glasl (9 bậc, từ căng thẳng đến cùng nhau rơi xuống vực).","ct_gioi_han":"Việc tách vấn đề khỏi con người đôi khi là không thể nếu xung đột bắt nguồn từ sự thù hằn cá nhân sâu sắc hoặc đụng chạm đến giá trị cốt lõi, đạo đức. Bên thứ ba can thiệp phải thực sự trung lập, nếu không sẽ làm xung đột trầm trọng hơn.","ct_sai_lam":"Tiếp tục tranh cãi khi một trong hai bên đã mất bình tĩnh (bị cảm xúc chiếm quyền) || Sử dụng các từ ngữ tuyệt đối hóa như \"luôn luôn\", \"không bao giờ\" || Khơi lại những sai lầm trong quá khứ không liên quan đến hiện tại","ct_tu_kiem_tra":"Đặc điểm điển hình của một xung đột đang leo thang là gì? ⇒ Chuyển từ thảo luận vấn đề cụ thể sang công kích bản chất con người. || Biện pháp \"sơ cứu\" hiệu quả nhất khi xung đột bắt đầu bùng nổ cảm xúc là gì? ⇒ Tạm dừng (time-out) để não bộ hạ nhiệt. || \"Tách con người ra khỏi vấn đề\" nghĩa là thế nào? ⇒ Chỉ trích hành động, quy trình hoặc số liệu, không đánh giá nhân cách hay động cơ của người làm.","ct_tai_lieu":"TL129,TL132"},{"id":"CH-LT-02","thu_tu":88,"tuan":5,"ngay":2,"nhom_hoc":"Leo thang","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"chuoi","nhom":"Chuỗi leo thang – 4. Chuỗi leo thang cam kết","ten":"Chuẩn mực leo thang","ten_goc":"Norm escalation; Shifting baselines","neu":"Một hành vi","thi":"hành vi tăng mức","chuoi":"Một hành vi → được chấp nhận → chuẩn nâng lên → hành vi tăng mức","vi_du":"Làm thêm giờ thỉnh thoảng → thành bình thường → thành bắt buộc.","gioi_han":"Khó thấy vì mỗi bước chỉ nhỉnh hơn bước trước.","tu_khoa":"Một hành vi, được chấp nhận, chuẩn nâng lên, hành vi tăng mức","chuoi_hoc":"Leo thang","kieu_hoc":"chuoi","buoc":4,"truoc":"CH-LT-05","sau":"CH-LT-03","ct_nguon_goc":"Hiện tượng này liên quan đến khái niệm \"đường cơ sở dịch chuyển\" (shifting baselines) thường được nhắc đến trong sinh thái học, chỉ việc mỗi thế hệ coi mức độ bất thường hiện tại là bình thường. Trong tâm lý học xã hội và quản trị, nó mô tả cách một hành vi lệch chuẩn nếu không bị chấn chỉnh sẽ dần trở thành tiêu chuẩn mới, tương đồng với cơ chế của Thuyết cửa sổ vỡ (Broken windows theory).","ct_co_che":"Bộ não đánh giá mức độ nghiêm trọng dựa trên điểm neo (anchor) hiện tại. Khi một hành vi hơi lệch chuẩn được dung túng, điểm neo này dịch chuyển. Ở lần vi phạm tiếp theo, bộ não chỉ thấy mức chênh lệch rất nhỏ so với chuẩn mới nên không báo động (thích nghi giác quan). Càng tiếp xúc nhiều (mere exposure), hành vi sai trái càng trở nên quen thuộc, từ đó tập thể ngầm chấp nhận nó làm chuẩn mực mới mà không hề nhận ra sự trượt dài.","ct_bang_chung":"C – Là một khung lý thuyết mạnh mẽ giải thích sự suy thoái văn hoá tổ chức (ví dụ: bình thường hoá việc trễ hạn, gian lận), được củng cố gián tiếp qua thuyết Cửa sổ vỡ và hiệu ứng mỏ neo.","ct_quy_trinh":"Xác định rõ bằng văn bản các chuẩn mực cốt lõi (giờ giấc, an toàn) || Khi xuất hiện vi phạm nhỏ đầu tiên, lập tức phản hồi và điều chỉnh, không tặc lưỡi bỏ qua || Giải thích sự dung túng vi phạm nhỏ sẽ phá vỡ hệ thống chung thế nào || Rà soát định kỳ thói quen thực tế so với chuẩn mực ban đầu || Tái thiết lập và công bố lại mốc chuẩn nếu phát hiện tổ chức đang trượt dài","ct_vi_du_mau":"Tình huống: Quy định công ty làm việc lúc 8h30. Vài ngày đầu mưa, một nhóm đến muộn 10 phút, sếp thông cảm không nhắc. Tháng sau, mọi người mặc nhiên 8h45 mới đến. Nửa năm sau, 9h mọi người mới bật máy tính và coi đó là \"văn hoá linh hoạt\"; sếp bực bội nhưng khó phạt vì chính mình đã ngầm đồng ý. Áp dụng: Để sửa sai, sếp không đột ngột phạt nặng. Sếp gọi họp, thừa nhận sự dễ dãi của mình đã làm xô lệch chuẩn mực, ảnh hưởng đến bộ phận chăm sóc khách hàng. Sau đó, sếp công bố tái thiết lập mốc 8h30, bắt đầu áp dụng nghiêm từ tuần sau. Kết quả: Tập thể hiểu lý do và điều chỉnh lại. Bài học là sự dễ dãi với vi phạm nhỏ hôm nay chắc chắn sẽ trở thành chuẩn mực ép buộc của ngày mai.","ct_bien_the":"Thuyết cửa sổ vỡ tập trung vào môi trường vật lý ảnh hưởng đến hành vi. Ẩn dụ \"ếch luộc trong nước ấm\" thường được dùng để mô tả hiện tượng này.","ct_gioi_han":"Không phải sự dịch chuyển chuẩn mực nào cũng tiêu cực; đôi khi đó là sự tiến hoá để thích nghi với bối cảnh mới. Việc kiểm soát quá gắt gao từng sai sót siêu nhỏ có thể tạo ra văn hoá quản lý vi mô (micromanagement) ngột ngạt.","ct_sai_lam":"Tặc lưỡi cho qua lần vi phạm đầu tiên vì nghĩ \"chỉ là chuyện nhỏ\" || Trách mắng nhân viên khi họ làm theo chuẩn mực mới mà chính người quản lý đã dung túng || Cố gắng kéo chuẩn mực về vị trí cũ bằng hình phạt đột ngột mà không giải thích || Không ghi chép lại chuẩn mực ban đầu nên bị quên lãng","ct_tu_kiem_tra":"Vì sao vi phạm nhỏ giọt lại nguy hiểm hơn vi phạm lớn đột ngột? ⇒ Vì não bộ không nhận ra sự khác biệt nhỏ, khiến chuẩn mực bị hạ thấp dần mà không ai phản ứng. || Cách tốt nhất để chặn chuỗi chuẩn mực leo thang là gì? ⇒ Không cho phép ngoại lệ ở ngay lần vi phạm đầu tiên của các ranh giới cốt lõi. || Chuẩn mực leo thang khác leo thang cam kết thế nào? ⇒ Leo thang cam kết là cố chấp đuổi theo quyết định sai; chuẩn mực leo thang là từ từ chấp nhận hành vi sai thành bình thường.","ct_tai_lieu":"TL002,TL093","ct_ghi_chu":"Câu chuyện ếch luộc sai về mặt sinh học nhưng có giá trị cao như một ẩn dụ truyền thông cho hiện tượng này."},{"id":"PP-DL-57","thu_tu":89,"tuan":5,"ngay":3,"nhom_hoc":"Động lực: Duy trì","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"phuong_phap","nhom":"Động lực – VI. Duy trì","ten":"Đổi góc nhìn","ten_goc":"Cognitive reappraisal – James Gross","neu":"Người làm bế tắc, căng thẳng, coi việc như hình phạt","thi":"Giúp nhìn lại việc theo hướng có ích","vi_du":"Coi buổi thuyết trình là cơ hội luyện nói thay vì bài kiểm tra.","gioi_han":"Không thay được việc giải quyết vấn đề thật.","tu_khoa":"góc nhìn, căng thẳng, tích cực","chuoi_hoc":"Động lực: Duy trì","kieu_hoc":"cay","buoc":6,"cha":"PP-DL-00","ct_nguon_goc":"Khái niệm \"tái đánh giá nhận thức\" (cognitive reappraisal) được định hình rõ nét qua công trình của James Gross (1998) về điều chỉnh cảm xúc. Nó có nền tảng sâu xa từ chủ nghĩa Khắc kỷ (Stoicism) và Liệu pháp Nhận thức Hành vi (CBT) của Aaron Beck và Albert Ellis. Nguyên lý cốt lõi là: không phải bản thân sự kiện, mà chính cách chúng ta diễn giải sự kiện đó mới sinh ra cảm xúc.","ct_co_che":"Khi gặp tình huống đe dọa, hạch hạnh nhân (amygdala) trong não kích hoạt phản ứng căng thẳng tự động. Việc chủ động đổi góc nhìn đòi hỏi sự tham gia của vỏ não trước trán (prefrontal cortex), vùng não tư duy logic. Quá trình này kiềm chế hoạt động của hạch hạnh nhân, chuyển trạng thái tâm lý từ \"bị đe dọa, hình phạt\" sang \"thử thách, cơ hội\". Sự tái cấu trúc ý nghĩa giúp giải phóng năng lượng bị kẹt trong lo âu, chuyển thành động lực hành động.","ct_bang_chung":"A – Nhiều tổng quan hệ thống trong tâm lý học thần kinh và tâm lý học lâm sàng chứng minh tái đánh giá nhận thức là chiến lược điều hòa cảm xúc lành mạnh và hiệu quả nhất.","ct_quy_trinh":"Tạm dừng khi nhận thấy cảm xúc tiêu cực, chán nản ập đến || Ghi nhận lại cách diễn giải tự động đang khiến mình căng thẳng || Tìm kiếm bằng chứng khách quan để phản bác diễn giải cũ đó || Đặt câu hỏi: \"Sự việc này mang lại lợi ích tiềm ẩn hoặc bài học gì?\" || Viết lại một câu diễn giải mới tích cực hơn và nhắc lại khi làm việc","ct_vi_du_mau":"Tình huống: An được sếp giao thuyết trình trước toàn công ty. An bế tắc, sợ hãi, coi đây là một bài kiểm tra để sếp đánh trượt mình. Áp dụng: An nhận ra cảm xúc tiêu cực đang khóa chặt động lực chuẩn bị. Cô dừng lại, ghi diễn giải tự động: \"Nếu nói vấp, mình sẽ bị sa thải\". Cô tự tìm phản bằng chứng: chưa ai ở công ty bị đuổi chỉ vì thuyết trình vấp. Cô quyết định đổi góc nhìn bằng câu hỏi tìm lợi ích. An viết lại diễn giải: \"Đây là cơ hội hiếm để luyện nói trước đám đông, sếp giao vì tin mình có khả năng phát triển\". Kết quả: Nỗi sợ hãi giảm hẳn, năng lượng được chuyển từ việc lo âu sang việc chuẩn bị kỹ slide và tập luyện, giúp bài thuyết trình thành công.","ct_bien_the":"Tái cấu trúc nhận thức (Cognitive restructuring) trong CBT; Gắn nhãn cảm xúc (Affect labeling).","ct_gioi_han":"Đổi góc nhìn không thay thế cho hành động thực tế để giải quyết vấn đề. Nếu sự kiện thực sự mang tính tàn phá nghiêm trọng, việc ép bản thân phải nhìn nhận tích cực ngay lập tức là \"tích cực độc hại\" (toxic positivity), gây chèn ép cảm xúc thật.","ct_sai_lam":"Ép mình suy nghĩ tích cực ảo tưởng khi vấn đề thực tế đang cháy nhà cần dập ngay || Phủ nhận cảm xúc tiêu cực thực tế thay vì đi tìm ý nghĩa mới || Áp đặt việc đổi góc nhìn cho người khác khi họ đang chịu tổn thương tâm lý cấp tính","ct_tu_kiem_tra":"Đổi góc nhìn làm thay đổi bản chất sự kiện hay thay đổi điều gì? ⇒ Chỉ thay đổi cách diễn giải và ý nghĩa gán cho sự kiện đó. || Tại sao đổi góc nhìn không phải là suy nghĩ tích cực độc hại? ⇒ Vì nó dựa trên tìm kiếm bằng chứng thực tế để diễn giải lại, không mù quáng phủ nhận khó khăn. || Có nên dùng đổi góc nhìn để né tránh vấn đề? ⇒ Không, nó chỉ dọn dẹp rào cản tâm lý để lấy lại năng lượng giải quyết vấn đề thực tế.","ct_tai_lieu":"TL080,TL081","ct_tai_lieu_de_xuat":"Beck, A. T. (1979). Cognitive Therapy of Depression."},{"id":"PP-DL-59","thu_tu":90,"tuan":5,"ngay":3,"nhom_hoc":"Động lực: Duy trì","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"phuong_phap","nhom":"Động lực – VI. Duy trì","ten":"Thấy mình tiến bộ","ten_goc":"Progress principle – Amabile & Kramer (2011)","neu":"Việc dài, kết quả chưa thấy ngay","thi":"Hiển thị tiến độ bằng thanh, biểu đồ","vi_du":"Thanh tiến độ \"đã thuộc 12/17 mục\" tuần 1.","gioi_han":"Tiến độ giả (thanh chạy nhưng không học) làm hỏng niềm tin.","tu_khoa":"tiến độ, thanh tiến bộ, phản hồi","chuoi_hoc":"Động lực: Duy trì","kieu_hoc":"cay","buoc":7,"cha":"PP-DL-00","ct_nguon_goc":"Khái niệm \"nguyên lý tiến bộ\" (Progress principle) nổi tiếng qua nghiên cứu của Teresa Amabile và Steven Kramer (2011), sau khi họ phân tích hàng ngàn nhật ký công việc. Nó kế thừa khái niệm \"thắng lợi nhỏ\" (small wins) của Karl Weick (1984) và có liên hệ chặt chẽ với thuyết đặt mục tiêu, thiết kế trò chơi (gamification), chỉ ra rằng cảm giác tiến lên phía trước là động lực mạnh mẽ nhất trong công việc.","ct_co_che":"Mỗi bước tiến nhỏ, dù vụn vặt, đều kích hoạt não bộ tiết ra dopamine, tạo cảm giác tưởng thưởng dễ chịu. Khi một hành trình dài thiếu điểm neo, con người dễ chìm trong cảm giác bất định và mất niềm tin vào năng lực bản thân (self-efficacy). Việc hiển thị tiến độ (qua thanh đo, biểu đồ) biến những nỗ lực vô hình thành bằng chứng thị giác cụ thể. Nó tạo ra hiệu ứng hoàn thành (khao khát lấp đầy khoảng trống còn lại) và duy trì ngọn lửa nỗ lực không bị tắt giữa chừng.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại từ tâm lý học tổ chức đến thiết kế trải nghiệm người dùng chứng minh tiến bộ nhỏ là yếu tố giữ chân người dùng và nhân viên bền vững bậc nhất.","ct_quy_trinh":"Chia nhỏ mục tiêu lớn thành các cột mốc cực nhỏ, có thể đo lường ngay trong ngày hoặc tuần || Thiết lập hệ thống hiển thị trực quan (thanh tiến độ, biểu đồ, checklist) ở nơi dễ thấy || Đánh dấu ngay lập tức mỗi khi hoàn thành một mốc nhỏ || Tổ chức ăn mừng nhẹ (small win) để não bộ ghi nhận thành quả || Điều chỉnh độ khó nếu thấy thanh tiến độ bị chững lại quá lâu gây nản","ct_vi_du_mau":"Tình huống: Phòng IT cần nâng cấp phần mềm cho 200 nhân viên trong 1 tháng. Tuần đầu, nhân viên IT rất nản vì làm cả ngày mà lượng việc còn lại vẫn mênh mông. Áp dụng: Trưởng phòng dựng một tấm bảng lớn ở văn phòng với thanh tiến độ từ 0 đến 200, chia vạch cho mỗi 10 máy. Mỗi khi cài xong một máy, kỹ thuật viên tự tay tô màu thêm một ô. Kết quả: Thay vì áp lực với 150 máy chưa làm, họ tập trung vào niềm vui \"đã tô được 50 ô, sắp tới mốc 60\". Việc biến quá trình thành hình ảnh trực quan kích thích thi đua nội bộ. Nhóm hoàn thành toàn bộ dự án trước hạn 3 ngày với tinh thần vui vẻ, không kiệt sức.","ct_bien_the":"Thắng lợi nhỏ (Small wins); Ứng dụng cơ chế trò chơi (Gamification); Hiệu ứng dốc mục tiêu (Goal-gradient effect).","ct_gioi_han":"Tiến độ giả mạo (cày cuốc chỉ để tăng số liệu mà không ra kết quả thật) sẽ làm mất ý nghĩa của công việc. Nếu thanh tiến độ quá dài, chậm nhích, hoặc mục tiêu quá xa vời, nó sẽ sinh ra hiệu ứng ngược là sự tuyệt vọng.","ct_sai_lam":"Chia mốc tiến độ quá lớn, phải đợi cả tháng mới được đánh dấu một lần || Đo lường sai chỉ số (vanity metrics) khiến biểu đồ đi lên nhưng dự án thực tế thất bại || Giấu kín bảng tiến độ trong máy tính thay vì phơi bày ra môi trường vật lý","ct_tu_kiem_tra":"Tiến bộ nhỏ kích hoạt chất hóa học nào trong não giúp duy trì động lực? ⇒ Dopamine. || Rủi ro lớn nhất của việc thiết kế hiển thị tiến độ sai là gì? ⇒ Người làm dễ tập trung cày số liệu bề mặt thay vì tạo ra giá trị thực chất. || Làm sao để bảng tiến độ không gây nản chí? ⇒ Chia mốc mục tiêu đủ nhỏ để người làm có thể thấy thanh nhích lên liên tục trong thời gian ngắn.","ct_tai_lieu":"TL042,TL052,TL055"},{"id":"PP-DL-67","thu_tu":91,"tuan":5,"ngay":3,"nhom_hoc":"Động lực: Duy trì","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – VI. Duy trì","ten":"Khan hiếm","ten_goc":"Scarcity – Cialdini; Worchel (thí nghiệm hũ bánh)","neu":"Cơ hội có giá trị nhưng giới hạn số lượng, thời gian","thi":"Nêu rõ giới hạn để thúc đẩy làm ngay","vi_du":"\"Lớp chỉ nhận 20 người, đóng đơn thứ Sáu.\"","gioi_han":"Khan hiếm giả là quảng cáo gian dối.","tu_khoa":"khan hiếm, giới hạn, làm ngay","phong_ve":"Hỏi: nếu không có giới hạn, mình có muốn thứ này không?","de_nham_voi":"PP-DL-05","chuoi_hoc":"Động lực: Duy trì","kieu_hoc":"cay","buoc":8,"cha":"PP-DL-00","cap_doi":"PP-DL-05","khac_nhau":"Hạn chót: giới hạn thời gian; Khan hiếm: giới hạn số lượng cơ hội","ct_nguon_goc":"Nguyên tắc khan hiếm (scarcity) được định hình thành một trong sáu vũ khí thuyết phục kinh điển bởi Robert Cialdini (1984). Trước đó, Stephen Worchel (1975) đã cung cấp bằng chứng thực nghiệm nổi tiếng: người tham gia đánh giá bánh quy ngon hơn và đắt hơn khi nó được lấy từ một hũ chỉ có 2 cái, so với hũ chứa 10 cái giống hệt.","ct_co_che":"Khan hiếm đánh mạnh vào \"lý thuyết phản kháng tâm lý\" (reactance theory): khi một lựa chọn trở nên khan hiếm, quyền tự do sở hữu nó bị đe dọa. Con người phản ứng bằng cách muốn giành lại sự tự do đó, khao khát món đồ mãnh liệt hơn. Đồng thời, bộ não dùng sự khan hiếm như một lối tắt phán đoán (heuristic): món gì ít, có nhiều người tranh giành thì mặc định là hàng chất lượng cao. Nỗi sợ bỏ lỡ (FOMO) kích hoạt hạch hạnh nhân, lấn át tư duy phân tích thấu đáo.","ct_bang_chung":"A – Hàng loạt nghiên cứu trong marketing, kinh tế học hành vi và tâm lý học xã hội chứng minh khan hiếm đẩy nhanh tốc độ ra quyết định và tăng giá trị nhận thức.","ct_quy_trinh":"Xác định rõ ràng tính giới hạn thực sự của cơ hội (số lượng, thời gian, nguồn lực) || Truyền thông minh bạch giới hạn này ngay từ đầu để tạo sự mong đợi || Nhấn mạnh vào những gì người làm sẽ mất đi nếu bỏ lỡ, thay vì chỉ nói về lợi ích || Giữ đúng cam kết giới hạn, tuyệt đối không lén lút phá vỡ quy tắc để thêm suất || Chỉ dùng kỹ thuật này khi cơ hội thực sự có giá trị cao và khan hiếm","ct_vi_du_mau":"Tình huống: Công ty mở lớp kỹ năng đàm phán miễn phí cho nhân viên. Nhiều người đăng ký nhưng đến ngày học lại báo bận không đi, vì nghĩ \"khóa này lúc nào học chẳng được\". Áp dụng: Khóa tiếp theo, bộ phận đào tạo thay đổi cách truyền thông: \"Lớp thực hành với chuyên gia chỉ nhận đúng 20 người, đóng đơn vào 17h thứ Sáu. Sang năm mới tổ chức lại, ai bỏ lỡ sẽ phải tự bỏ tiền túi học ngoài\". Kết quả: Mọi người tranh nhau đăng ký hết chỗ trong vòng 2 tiếng. Tỷ lệ tham gia đạt 100% vì ai cũng cảm thấy mình may mắn mới giành được suất học hạn chế này, tạo ra động lực tập trung rất cao.","ct_bien_the":"Sợ bỏ lỡ (FOMO - Fear Of Missing Out); Thiên kiến độc quyền (Exclusivity bias).","ct_gioi_han":"Khan hiếm giả tạo (như đồng hồ đếm ngược ảo trên web) khi bị phát hiện sẽ hủy hoại toàn bộ uy tín dài hạn. Kỹ thuật này cũng vô dụng với những thứ người ta vốn dĩ không có nhu cầu, hoặc có vô số lựa chọn thay thế dễ dàng.","ct_sai_lam":"Lạm dụng khan hiếm giả (thao túng bẩn) để chốt sale bằng mọi giá || Dùng quá thường xuyên khiến người nhận quen thuộc và sinh ra kháng thể tâm lý || Chỉ tạo khan hiếm mà không chứng minh được giá trị lõi của thứ đang giới hạn","ct_phong_ve":"Nhận diện: Các lời chào mời kèm cụm từ hối thúc như \"chỉ còn 1 suất cuối\", \"khuyến mãi kết thúc trong 10 phút\", hoặc đồng hồ đếm ngược đỏ rực. Phòng vệ: Cô lập cảm xúc bằng cách tự hỏi: \"Nếu cơ hội này luôn có sẵn vô hạn, mình có thực sự cần nó lúc này không?\". Dùng chính danh: Sử dụng giới hạn thực tế (như hàng tồn kho thật, số lượng học viên tối đa đảm bảo chất lượng) để giúp người khác vượt qua sự trì hoãn ra quyết định, tuyệt đối không lừa dối.","ct_tu_kiem_tra":"Cơ chế tâm lý nào làm khan hiếm trở nên hiệu quả? ⇒ Sự phản kháng tâm lý khi bị hạn chế quyền tự do và lối tắt phán đoán chất lượng. || Khan hiếm khác hạn chót (deadline) ở điểm nào? ⇒ Hạn chót chỉ giới hạn thời gian; khan hiếm nhấn mạnh sự cạn kiệt về số lượng và cơ hội sở hữu. || Hậu quả nguy hiểm nhất của việc lạm dụng khan hiếm giả là gì? ⇒ Đánh mất hoàn toàn niềm tin và uy tín dài hạn của người sử dụng nó.","ct_tai_lieu":"TL088,TL089,TL092"},{"id":"PP-DL-60","thu_tu":92,"tuan":5,"ngay":3,"nhom_hoc":"Động lực: Duy trì","uu_tien":9,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – VI. Duy trì","ten":"Tự theo dõi","ten_goc":"Self-monitoring – Kanfer","neu":"Người làm có kỷ luật, muốn hiểu bản thân","thi":"Ghi nhật ký hành vi và kết quả","vi_du":"Ghi giờ ngủ và năng lượng mỗi sáng trong 2 tuần.","gioi_han":"Ghi chép quá chi tiết gây mệt, dễ bỏ.","tu_khoa":"nhật ký, tự theo dõi","chuoi_hoc":"Động lực: Duy trì","kieu_hoc":"cay","buoc":9,"cha":"PP-DL-00","ct_nguon_goc":"Tự theo dõi (Self-monitoring) là kỹ thuật nòng cốt trong lý thuyết tự điều chỉnh (Self-regulation theory) do Frederick Kanfer đề xuất. Xuất phát từ tâm lý học hành vi, phương pháp này nhấn mạnh rằng cá nhân phải liên tục quan sát, đo lường và tự phản hồi về hành vi của chính mình trước khi có thể thay đổi nó thành công.","ct_co_che":"Đa phần thói quen hàng ngày diễn ra ở trạng thái vô thức để não tiết kiệm năng lượng. Tự theo dõi ép hành vi từ vùng vô thức nổi lên vùng nhận thức có ý thức. Việc ghi chép tạo ra một vòng lặp phản hồi (feedback loop) khách quan, phá vỡ sự tự lừa dối (ví dụ: tưởng mình làm việc nhiều nhưng thực ra lướt mạng). Nó còn kích hoạt cảm giác chịu trách nhiệm với chính bản thân, từ đó tăng động lực tự thân.","ct_bang_chung":"A – Hàng loạt nghiên cứu trong tâm lý học sức khoẻ và hành vi khẳng định tự theo dõi là một trong những chiến lược can thiệp cốt lõi, hiệu quả nhất để thay đổi thói quen (như giảm cân, tăng năng suất).","ct_quy_trinh":"Chọn đúng 1 đến 2 chỉ số quan trọng nhất phản ánh mục tiêu (ví dụ: số giờ làm việc sâu) || Chọn công cụ ghi chép ít rườm rà nhất (sổ tay nhỏ, app điện thoại) || Thực hiện ghi chú ngay lập tức sau khi hành vi xảy ra, không đợi đến cuối ngày || Đặt lịch hàng tuần để nhìn lại dữ liệu, tìm ra các quy luật hoặc điểm nghẽn || Điều chỉnh hành động của tuần tới dựa trên dữ liệu thực tế","ct_vi_du_mau":"Tình huống: Một quản lý dự án luôn thấy bận rộn, làm đến 8h tối nhưng cuối tuần vẫn trễ tiến độ. Anh kiệt sức nhưng không hiểu thời gian trôi đi đâu. Áp dụng: Anh quyết định tự theo dõi. Trong 3 ngày, cứ mỗi 30 phút anh ghi chú nhanh vào sổ tay việc mình vừa làm. Đến cuối ngày thứ 3, anh nhận ra sự thật sốc: mỗi ngày anh dành gần 3 tiếng để trả lời tin nhắn lặt vặt và 1.5 tiếng cho các cuộc họp vô bổ; thời gian làm việc chuyên sâu chỉ có 1 tiếng. Kết quả: Dữ liệu khách quan bẻ gãy \"ảo tưởng bận rộn\". Anh tự tin thiết lập khung giờ tắt thông báo 2 tiếng mỗi sáng. Bài học là ta không thể quản lý hiệu quả những gì ta không thể đo lường trung thực.","ct_bien_the":"Trào lưu Tự định lượng (Quantified Self) sử dụng các thiết bị công nghệ đeo tay để tự động hoá việc theo dõi các chỉ số sinh lý và hành vi hàng ngày.","ct_gioi_han":"Việc theo dõi quá nhiều chỉ số cùng lúc sẽ gây quá tải nhận thức, kiệt sức (tracking fatigue) và dẫn đến từ bỏ. Nó phù hợp với người đã có sẵn ý thức kỷ luật; người đang quá căng thẳng có thể dùng dữ liệu để tự trừng phạt, dằn vặt bản thân.","ct_sai_lam":"Theo dõi hàng chục thói quen cùng một lúc || Đợi đến cuối tuần mới hồi tưởng và ghi lại khiến trí nhớ bóp méo sự thật || Chỉ thu thập số liệu mà không dành thời gian phân tích xem chúng có ý nghĩa gì || Dùng số liệu để dằn vặt bản thân thay vì tìm cách cải thiện","ct_tu_kiem_tra":"Vì sao phải ghi chép ngay lập tức thay vì đợi cuối ngày? ⇒ Vì trí nhớ rất kém tin cậy, ta hay đánh giá thấp hành vi xấu và phóng đại hành vi tốt. || Cơ chế tâm lý chính của tự theo dõi là gì? ⇒ Kéo hành vi từ vô thức lên vùng nhận thức có ý thức để tự đánh giá khách quan. || Nguyên nhân lớn nhất khiến việc tự theo dõi thất bại? ⇒ Theo dõi quá chi tiết hoặc quá nhiều chỉ số cùng lúc gây quá tải nhận thức.","ct_tai_lieu":"TL027,TL032","ct_ghi_chu":"Nhiều mô hình tự điều chỉnh đều coi tự theo dõi là bước nền tảng không thể thiếu."},{"id":"PP-DL-42","thu_tu":93,"tuan":5,"ngay":4,"nhom_hoc":"Động lực: Củng cố","uu_tien":14,"muc_uu_tien":"A – cốt lõi","loai":"phuong_phap","nhom":"Động lực – IV. Reinforcement (Củng cố)","ten":"Khen cụ thể","ten_goc":"Specific praise; Carol Dweck (khen nỗ lực, cách làm)","neu":"Muốn củng cố một hành động tốt cụ thể","thi":"Khen chi tiết hành vi, cách làm","vi_du":"\"Bảng so sánh 3 phương án của em giúp sếp quyết nhanh.\"","gioi_han":"Khen chung chung (\"giỏi lắm\") ít tác dụng; khen trí thông minh làm ngại thử thách.","tu_khoa":"khen cụ thể, hành vi, chi tiết","de_nham_voi":"PP-DL-43","chuoi_hoc":"Động lực: Củng cố","kieu_hoc":"cay","buoc":1,"cha":"PP-DL-00","cap_doi":"PP-DL-43","khac_nhau":"Ghi nhận công khai: trước đám đông; Khen cụ thể: chỉ rõ hành vi tốt","ct_nguon_goc":"Khen cụ thể (Specific praise) được nhấn mạnh trong Thuyết củng cố (Operant conditioning) của B.F. Skinner (1953). Tuy nhiên, ảnh hưởng lớn nhất đến thực hành giáo dục và quản trị hiện đại đến từ Carol Dweck (2006) với khái niệm Tư duy phát triển (Growth mindset). Dweck chỉ ra rằng khen nỗ lực và chiến lược mang lại tác dụng tích cực hơn nhiều so với việc khen bản chất hay trí thông minh.","ct_co_che":"Khen ngợi tạo ra phần thưởng xã hội, kích thích não tiết dopamine. Khi lời khen nhắm cụ thể vào hành vi và nỗ lực (ví dụ: em đã phân tích rất sâu dữ liệu), nó tạo ra một liên kết thần kinh rõ ràng giữa hành động đó và phần thưởng, định hướng người làm lặp lại. Khen thông minh (ví dụ: em thật tài năng) lại kích hoạt tư duy cố định, khiến họ sợ thất bại và né tránh thử thách để bảo vệ hình ảnh hoàn hảo vừa được gán. Lời khen cụ thể cũng chứng minh người quản lý có quan sát thật sự.","ct_bang_chung":"A – Các nghiên cứu thực nghiệm của Dweck và nhiều bản lặp lại trong tâm lý học giáo dục, tổ chức xác nhận mạnh mẽ hiệu quả của khen nỗ lực so với khen phẩm chất.","ct_quy_trinh":"Quan sát kỹ để tìm ra một hành vi, nỗ lực hoặc chiến lược hiệu quả mà người làm vừa thực hiện || Bắt đầu lời khen bằng việc gọi tên chính xác hành vi đó thay vì một tính từ chung chung || Giải thích ngắn gọn vì sao hành vi đó mang lại giá trị hoặc tác động tích cực cho công việc chung || Kết thúc bằng sự khích lệ để họ tiếp tục phát huy hoặc bước vào thử thách khó hơn","ct_vi_du_mau":"Tình huống: Tuấn là nhân viên mới, vừa hoàn thành bản báo cáo phân tích đối thủ với hình thức rất đẹp và lập luận sắc bén. Áp dụng: Thay vì khen chung chung \"Em làm tốt lắm, em rất thông minh\", trưởng phòng quyết định khen cụ thể: \"Tuấn, anh đánh giá cao cách em thiết kế bảng so sánh tính năng của 3 đối thủ. Em đã chủ động đào sâu vào thông số kỹ thuật, giúp nhóm kinh doanh nhìn ra ngay điểm mạnh để chốt sale với khách hàng. Cách làm báo cáo này rất hiệu quả, em áp dụng tiếp cho dự án tháng sau nhé\". Kết quả: Tuấn hiểu chính xác sếp thích điều gì ở mình. Cậu không bị áp lực phải tỏ ra \"là người luôn xuất chúng\" mà tập trung vào việc duy trì sự chi tiết, chủ động trong các tài liệu tiếp theo.","ct_bien_the":"Phản hồi định hướng hành vi (Behavioral feedback); Khen ngợi mô tả (Descriptive praise).","ct_gioi_han":"Khen cụ thể tốn thời gian quan sát, khó áp dụng khi quản lý không bám sát công việc hàng ngày. Nếu khen những chi tiết quá vụn vặt nhưng bỏ qua sự thất bại của bức tranh tổng thể (như dự án trễ tiến độ, lỗ nặng nhưng sếp lại khen làm slide đẹp), nó sẽ tạo ra tín hiệu định hướng sai lệch trầm trọng.","ct_sai_lam":"Khen trí thông minh hay phẩm chất thay vì nỗ lực (\"Cháu đúng là thiên tài\") || Lời khen kiểu bánh mì kẹp thịt (khen giả tạo ở đầu để chuẩn bị chê bai ở sau) || Khen cụ thể nhưng lại so sánh dìm người khác xuống (\"Em làm slide đẹp hơn hẳn thằng A\")","ct_tu_kiem_tra":"Vì sao khen \"em rất thông minh\" lại gây hại trong dài hạn? ⇒ Nó tạo ra tư duy cố định, khiến người được khen sợ mắc lỗi và né tránh thử thách để bảo vệ hình ảnh. || Lời khen cụ thể và hiệu quả cần chứa đựng những yếu tố bắt buộc nào? ⇒ Gọi tên chính xác hành vi đã làm và giải thích tác động tích cực mà hành vi đó mang lại. || Tại sao lời khen chung chung (\"giỏi lắm\") ít có tác dụng củng cố hành vi? ⇒ Vì người nghe không hiểu rõ mình đã làm đúng điểm nào để có thể lặp lại vào lần sau.","ct_tai_lieu":"TL035,TL045"},{"id":"PP-DL-38","thu_tu":94,"tuan":5,"ngay":4,"nhom_hoc":"Động lực: Củng cố","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"phuong_phap","nhom":"Động lực – IV. Reinforcement (Củng cố)","ten":"Thưởng ngay","ten_goc":"Operant conditioning – Skinner; Immediacy","neu":"Giai đoạn đầu tạo thói quen mới","thi":"Thưởng ngay sau khi hành vi xảy ra","vi_du":"Tích một ô trên lịch và tự thưởng ly trà sau buổi tập.","gioi_han":"Thưởng vật chất cho việc vốn thích làm có thể giảm động lực nội tại.","tu_khoa":"thưởng ngay, thói quen mới","de_nham_voi":"PP-DL-40","chuoi_hoc":"Động lực: Củng cố","kieu_hoc":"cay","buoc":2,"cha":"PP-DL-00","cap_doi":"PP-DL-40","khac_nhau":"Thưởng ngay: tạo liên kết lúc đầu; Thưởng bất ngờ: chống nhàm khi đã quen","ct_nguon_goc":"Thưởng ngay (Immediacy of reinforcement) là trụ cột vững chắc của Thuyết điều kiện hóa kết quả (Operant conditioning) do B.F. Skinner (1953) đặt nền móng. Skinner chứng minh rằng thời gian giữa hành vi và phần thưởng càng ngắn, sự củng cố càng mạnh. Khái niệm này cũng gắn chặt với \"sự suy giảm giá trị theo thời gian\" (delay discounting) - một hiện tượng cốt lõi trong kinh tế học hành vi giải thích tại sao con người hay chọn lợi ích nhỏ trước mắt thay vì lợi ích lớn ở tương lai.","ct_co_che":"Bộ não động vật có vú được lập trình tiến hóa để ưu tiên sinh tồn và lợi ích trước mắt. Hệ thống phần thưởng dopamine phản ứng mạnh nhất với các kích thích xảy ra tức thì. Khi khoảng cách thời gian từ lúc làm đến lúc nhận thưởng bị kéo dài, não mất đi khả năng kết nối nhân quả thần kinh. Việc thưởng ngay giúp lách qua rào cản tư duy dài hạn (vốn mờ nhạt và yếu ớt), trực tiếp tiêm dopamine để tạo cảm giác thỏa mãn, khắc sâu mạch thần kinh của thói quen mới trước khi sự mệt mỏi kịp làm người ta nản chí.","ct_bang_chung":"A – Một trong những quy luật bền vững nhất của tâm lý học hành vi; vô số nghiên cứu từ động vật đến con người đều xác nhận vai trò sống còn của tính tức thời trong việc hình thành thói quen.","ct_quy_trinh":"Xác định rõ hành vi mới, có độ khó cao mà bạn đang cố gắng xây dựng || Chuẩn bị sẵn một phần thưởng nhỏ, lành mạnh mà bản thân thực sự yêu thích || Thực hiện hành vi mục tiêu || Ngay khi vừa hoàn thành, lập tức tự trao phần thưởng cho mình, tuyệt đối không trì hoãn || Giảm dần tần suất thưởng khi hành vi đã bắt đầu vào nếp và chuyển sang tự động","ct_vi_du_mau":"Tình huống: Nam muốn tạo thói quen chạy bộ 3km mỗi chiều đi làm về, nhưng việc xỏ giày chạy rất mệt. Cứ chạy xong là uể oải, vài ngày sau Nam lại bỏ cuộc. Áp dụng: Nam thiết kế lại cơ chế củng cố. Thay vì chờ đợi phần thưởng xa vời như \"giảm 3kg sau 2 tháng\", cậu chọn một phần thưởng tức thì: được uống ly sinh tố yêu thích và xem đúng một tập phim hài. Nam tự ra luật nghiêm ngặt: chỉ được hưởng đặc quyền này ngay khi vừa chạy xong bước vào nhà, mồ hôi còn ướt. Kết quả: Bộ não Nam bắt đầu kết nối sự mệt mỏi của chạy bộ với niềm vui tột độ của ly sinh tố và phim hài ngay sau đó. Sự kháng cự trước khi xỏ giày giảm hẳn vì não thèm khát phần thưởng tức thì, giúp Nam duy trì được lịch tập luyện.","ct_bien_the":"Phần thưởng kề sát (Proximal reward); Phản hồi tức thì (Immediate feedback).","ct_gioi_han":"Dễ bị lạm dụng nếu phần thưởng tức thì đi ngược lại mục tiêu dài hạn (như chạy bộ xong thưởng bằng bánh ngọt đầy đường). Khi thói quen đã vững chắc, nếu cứ tiếp tục thưởng liên tục có thể làm xói mòn động lực nội tại (hiệu ứng quá mức biện minh - overjustification effect), biến công việc thành sự đổi chác bề mặt.","ct_sai_lam":"Thưởng bằng thứ phá hoại chính mục tiêu đang xây dựng (tập thể dục xong ăn thức ăn nhanh) || Tự thưởng trước khi làm hành động mục tiêu với hy vọng \"lấy động lực\" || Hứa tự thưởng nhưng hay quên, tự khất nợ với bản thân hết lần này đến lần khác","ct_tu_kiem_tra":"Vì sao phần thưởng nhận vào cuối tháng ít có tác dụng trong việc tạo thói quen mới? ⇒ Khoảng cách thời gian quá xa khiến hệ thần kinh không kết nối được hành động và phần thưởng. || Mối nguy hiểm lớn nhất khi chọn sai phần thưởng tức thì là gì? ⇒ Phần thưởng đi ngược lại mục tiêu dài hạn, phá vỡ công sức vừa bỏ ra. || Khi nào nên bắt đầu giảm tần suất của việc thưởng ngay? ⇒ Khi hành vi đã trở nên tự động hóa và người làm bắt đầu tìm thấy niềm vui, động lực từ chính công việc đó.","ct_tai_lieu":"TL035,TL048"},{"id":"PP-DL-43","thu_tu":95,"tuan":5,"ngay":4,"nhom_hoc":"Động lực: Củng cố","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – IV. Reinforcement (Củng cố)","ten":"Ghi nhận công khai","ten_goc":"Recognition; esteem needs – Maslow","neu":"Người làm cần được tôn trọng; tập thể cần tấm gương","thi":"Tuyên dương trước nhóm","vi_du":"Nêu tên người xử lý sự cố giỏi trong họp toàn công ty.","gioi_han":"Người hướng nội có thể ngại; hỏi trước cách họ muốn được ghi nhận.","tu_khoa":"tuyên dương, công khai, tấm gương","de_nham_voi":"PP-DL-42","chuoi_hoc":"Động lực: Củng cố","kieu_hoc":"cay","buoc":3,"cha":"PP-DL-00","cap_doi":"PP-DL-42","khac_nhau":"Ghi nhận công khai: trước đám đông; Khen cụ thể: chỉ rõ hành vi tốt","ct_nguon_goc":"Khái niệm này bắt nguồn từ Tháp nhu cầu của Abraham Maslow (1943), nơi \"nhu cầu được tôn trọng\" (esteem needs) nằm ở tầng cao, chỉ dưới nhu cầu tự thể hiện. Trong quản trị tổ chức, Frederick Herzberg (1959) cũng xếp sự ghi nhận (recognition) vào nhóm các \"yếu tố động lực\" cốt lõi tạo ra sự thỏa mãn sâu sắc, khác biệt với tiền lương chỉ là \"yếu tố duy trì\".","ct_co_che":"Não bộ tiến hóa để sinh tồn trong cấu trúc bộ lạc, khiến con người cực kỳ nhạy cảm với địa vị xã hội và sự chấp thuận của tập thể. Việc được vinh danh công khai kích hoạt sự giải phóng serotonin và dopamine, mang lại cảm giác tự hào mãnh liệt. Về mặt tổ chức, theo Thuyết học tập xã hội của Bandura, việc tuyên dương một cá nhân tạo ra một mô hình hành vi (role model) sống động. Đám đông sẽ quan sát, ghi nhớ phần thưởng xã hội đó và tự động điều chỉnh hành vi của mình để cũng được công nhận tương tự.","ct_bang_chung":"A – Nhiều nghiên cứu tâm lý học tổ chức và nhân sự khẳng định sự công nhận xã hội là phần thưởng phi tài chính có sức củng cố hành vi và giữ chân nhân tài mạnh mẽ nhất.","ct_quy_trinh":"Xác định thành tích thực sự xuất sắc và xứng đáng được làm gương || Kiểm tra xem người được nhận có thoải mái với việc được xướng tên trước đám đông không || Chọn bối cảnh công khai phù hợp (như email toàn công ty, cuộc họp giao ban) || Tuyên dương bằng cách gọi tên hành động cụ thể và giá trị nó mang lại cho tập thể || Trao một kỷ niệm chương hoặc phần thưởng nhỏ đi kèm để tăng tính biểu tượng","ct_vi_du_mau":"Tình huống: Hoàng, một kỹ sư IT, đã thức trắng đêm cuối tuần để vá một lỗ hổng bảo mật nghiêm trọng, cứu công ty khỏi nguy cơ rò rỉ dữ liệu khách hàng. Áp dụng: Sáng thứ Hai, thay vì chỉ nhắn tin cảm ơn riêng, Giám đốc quyết định ghi nhận công khai. Trong buổi họp toàn công ty, ông dành 5 phút kể lại chi tiết nỗ lực của Hoàng, nhấn mạnh hành động này thể hiện đúng giá trị cốt lõi \"Bảo vệ khách hàng bằng mọi giá\". Ông trao cho Hoàng một thư cảm ơn và voucher nghỉ dưỡng. Kết quả: Hoàng cảm thấy những nỗ lực thầm lặng của mình thực sự được trân trọng, sự gắn kết với công ty tăng vọt. Các nhân viên khác hiểu rõ thế nào là cống hiến thực sự và có động lực để nỗ lực trong các tình huống khẩn cấp tương tự.","ct_bien_the":"Giải thưởng nhân viên của tháng (Employee of the month); Tôn vinh đồng cấp (Peer-to-peer recognition).","ct_gioi_han":"Việc ghi nhận công khai có thể trở thành cực hình đối với những người cực kỳ hướng nội hoặc mắc chứng ám ảnh sợ xã hội; họ thích được khen riêng tư hơn. Nếu làm quá thường xuyên với những thành tích tầm thường, lời khen sẽ bị lạm phát và trở nên sáo rỗng.","ct_sai_lam":"Khen ngợi người này nhưng lại dùng từ ngữ có ý dìm hàng những người khác trong nhóm || Tuyên dương công khai những việc vốn là nghĩa vụ cơ bản (như đi làm đúng giờ) || Mặc định ai cũng thích đứng trên bục vinh quang trước hàng trăm người","ct_tu_kiem_tra":"Tại sao ghi nhận công khai đôi khi lại phản tác dụng với người nhận? ⇒ Vì những người hướng nội có thể cảm thấy áp lực và xấu hổ khi bị quá nhiều người chú ý. || Ghi nhận công khai tác động đến đám đông xung quanh như thế nào? ⇒ Tạo ra hiệu ứng học tập xã hội, thúc đẩy người khác làm theo tấm gương tốt. || Sự khác biệt cốt lõi giữa khen cụ thể và ghi nhận công khai là gì? ⇒ Ghi nhận công khai dùng áp lực xã hội và khao khát địa vị để củng cố hành vi, không chỉ là lời phản hồi cá nhân.","ct_tai_lieu":"TL033,TL039,TL041"},{"id":"PP-DL-48","thu_tu":96,"tuan":5,"ngay":4,"nhom_hoc":"Động lực: Củng cố","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"phuong_phap","nhom":"Động lực – IV. Reinforcement (Củng cố)","ten":"Hình phạt rõ và nhất quán","ten_goc":"Punishment – Skinner; deterrence: chắc chắn quan trọng hơn nặng","neu":"Vi phạm nghiêm trọng; luật đã công bố trước","thi":"Đặt quy định rõ và áp dụng nhất quán","vi_du":"Vi phạm an toàn lao động lần hai thì đình chỉ, ai cũng như ai.","gioi_han":"Mức chắc chắn bị phạt răn đe tốt hơn mức nặng; phạt dễ khiến người ta giấu lỗi.","tu_khoa":"hình phạt, quy định, nhất quán","chuoi_hoc":"Động lực: Củng cố","kieu_hoc":"cay","buoc":4,"cha":"PP-DL-00","ct_nguon_goc":"Dựa trên khái niệm Trừng phạt (Punishment) trong Thuyết điều kiện hoá kết quả (Operant conditioning) của B. F. Skinner. Trong quản trị hành vi và tội phạm học, nguyên lý răn đe (deterrence) nhấn mạnh rằng: để ngăn chặn một hành vi, tính chắc chắn (certainty) và tính nhanh chóng (celerity) của hình phạt đóng vai trò quan trọng hơn rất nhiều so với độ nặng (severity) của nó.","ct_co_che":"Con người luôn vô thức tính toán rủi ro trước khi lách luật. Nếu hình phạt cực kỳ nặng (như sa thải) nhưng xác suất bị bắt thấp hoặc dễ xin xỏ, họ vẫn vi phạm vì ảo tưởng \"mình sẽ thoát\". Ngược lại, nếu hình phạt nhỏ nhưng 100% hễ vi phạm là bị phạt ngay lập tức, não bộ sẽ hình thành liên kết nhân quả vững chắc, loại bỏ hoàn toàn ý định thử thách ranh giới rủi ro.","ct_bang_chung":"A – Các nghiên cứu về quản lý hành vi chứng minh tính chắc chắn của hình phạt có sức mạnh thay đổi hành vi cao hơn nhiều so với việc chỉ đơn thuần tăng mức phạt (ví dụ: gắn camera giám sát hiệu quả hơn tăng tiền phạt).","ct_quy_trinh":"Xác định rõ bằng văn bản các giới hạn vùng đỏ tuyệt đối không được vi phạm || Thiết kế hình phạt tương xứng: đủ đau để nhớ nhưng không quá nặng đến mức quản lý không nỡ ra quyết định || Truyền thông minh bạch về quy định và hình phạt trước khi áp dụng || Khi có vi phạm, thực thi hình phạt ngay lập tức, không trì hoãn || Áp dụng nhất quán cho mọi cá nhân, kể cả nhân sự cấp cao hay xuất sắc","ct_vi_du_mau":"Tình huống: Nhà máy quy định phạt 2 triệu nếu không mặc đồ bảo hộ. Tuy nhiên, quản đốc nể nang thợ bậc cao nên hay nhắm mắt làm ngơ. Hậu quả là nhân viên trẻ cũng lén tháo đồ, quy định bị vô hiệu hoá. Áp dụng: Giám đốc đổi chiến lược, giảm mức phạt xuống 300 ngàn đồng nhưng lắp camera AI giám sát 100%. Bất cứ ai vi phạm, hệ thống tự động báo về nhân sự để trừ lương. Khi quản đốc vi phạm, ông cũng bị phạt đúng 300 ngàn công khai. Kết quả: Tỷ lệ tuân thủ đạt 100% chỉ sau một tuần. Bài học: Sự thiên vị và mức phạt phi thực tế sẽ phá nát tính răn đe; thà phạt nhẹ mà chắc chắn còn hơn quy định doạ người nhưng không ai thực thi.","ct_bien_the":"Quy tắc bếp lò nóng (Hot Stove Rule) của Douglas McGregor: Bếp lò phạt ngay lập tức, phạt bất kỳ ai chạm vào không phân biệt, và luôn đỏ lửa báo trước sự nguy hiểm.","ct_gioi_han":"Hình phạt chỉ có tác dụng dừng hành vi xấu, không tạo ra hành vi xuất sắc. Lạm dụng hình phạt làm triệt tiêu động lực nội tại, tạo văn hoá sợ hãi, khiến nhân viên tìm cách che giấu lỗi lầm thay vì báo cáo để cùng sửa chữa.","ct_sai_lam":"Quy định mức phạt quá nặng, thiếu thực tế nên cuối cùng không ai dám áp dụng || Xử phạt chậm trễ (ví dụ đợi đến kỳ đánh giá cuối năm mới phạt) || Thiên vị, tha bổng cho người quen hoặc người có thành tích cao || Dùng hình phạt để doạ nạt mà không bao giờ thực sự thi hành","ct_tu_kiem_tra":"Yếu tố nào quan trọng nhất để hình phạt có tính răn đe? ⇒ Tính chắc chắn (chắc chắn sẽ bị phạt) và tính nhanh chóng (phạt ngay lập tức). || Nhược điểm lớn nhất của việc dùng hình phạt là gì? ⇒ Nó khiến người ta giấu lỗi để không bị phạt và không tạo ra động lực làm việc xuất sắc. || Tại sao quy định phạt quá nặng thường thất bại? ⇒ Vì mức phạt vô lý khiến chính người quản lý không nỡ thực thi, làm mất đi tính chắc chắn.","ct_tai_lieu":"TL035","ct_ghi_chu":"Lý thuyết răn đe ban đầu thuộc về tội phạm học nhưng được ứng dụng rất vừa vặn trong quản trị hành vi tổ chức."},{"id":"HN-NN-16","thu_tu":97,"tuan":5,"ngay":5,"nhom_hoc":"Nhìn người: nền tảng và lâu dài","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"hieu_nguoi","nhom":"Nhìn người – Lớp 3: Độ trung thành dài hạn","ten":"Đồng điệu giá trị","ten_goc":"Person–organization fit – Kristof (1996)","neu":"Năng lực tạo kết quả, nhưng giá trị cốt lõi quyết định sự bền vững","thi":"Lệch giá trị thì người càng giỏi càng dễ thành rủi ro","vi_du":"Mình coi trọng minh bạch, đồng đội thích lách luật → sớm muộn kéo nhau vào rắc rối.","gioi_han":"Đa dạng quan điểm là tốt; chỉ cần đồng điệu ở vài giá trị không thể thoả hiệp.","tu_khoa":"giá trị cốt lõi, lệch, bền vững","de_nham_voi":"HN-NN-17","chuoi_hoc":"Nhìn người: nền tảng và lâu dài","kieu_hoc":"chuoi","buoc":1,"sau":"HN-NN-17","cap_doi":"HN-NN-17","khac_nhau":"Giá trị: cùng nguyên tắc sống; Lợi ích hai chiều: cùng được lợi","ct_nguon_goc":"Khái niệm Person-Organization (P-O) fit được chuẩn hoá mạnh mẽ qua bài tổng quan của Amy Kristof (1996). Nguồn gốc của nó xuất phát từ tâm lý học tương tác (Interactional Psychology), nổi bật là phương trình B=f(P,E) của Kurt Lewin: hành vi là hàm số của con người và môi trường. Về sau, nó phát triển thành khung đánh giá đa chiều gồm sự phù hợp với công việc, với nhóm và với tổ chức.","ct_co_che":"Giá trị cốt lõi hoạt động như hệ điều hành ngầm định hướng mọi quyết định của cá nhân. Khi giá trị đồng điệu, cá nhân và tổ chức có chung tần số, giao tiếp mượt mà và sinh ra lòng tin. Ngược lại, nếu lệch giá trị (ví dụ: người thích mạo hiểm vào môi trường quy trình cứng nhắc), nhân sự sẽ liên tục bị vắt kiệt năng lượng vì phải chống lại văn hoá chung, dẫn đến sự đứt gãy không thể hàn gắn dù năng lực có giỏi đến đâu.","ct_bang_chung":"A – Phân tích tổng hợp từ nhiều nghiên cứu hành vi tổ chức chứng minh nhất quán rằng mức độ đồng điệu giá trị là chỉ báo dự đoán cực kỳ mạnh mẽ đối với sự cam kết và tỷ lệ giữ chân nhân sự.","ct_quy_trinh":"Xác định 3 giá trị cốt lõi tuyệt đối không thể thoả hiệp của tổ chức || Thiết kế các câu hỏi hành vi trong phỏng vấn để tìm kiếm bằng chứng về các giá trị này || Quan sát cách ứng viên ra quyết định trong các tình huống đánh đổi khó khăn || Đối chiếu giá trị của họ với văn hoá hiện tại của nhóm || Sẵn sàng loại bỏ những trường hợp xuất sắc về kỹ năng nhưng vi phạm giá trị cốt lõi","ct_vi_du_mau":"Tình huống: Một công ty tài chính đặt tính trung thực lên hàng đầu. Giám đốc kinh doanh mới được tuyển có thành tích chốt đơn vô cùng ấn tượng. Tuy nhiên, qua 2 tháng, bộ phận pháp chế phát hiện anh ta liên tục giấu thông tin bất lợi của hợp đồng để ép khách hàng ký nhanh. Áp dụng: Bất chấp doanh thu mang lại rất lớn, CEO trực tiếp đánh giá hành vi này vi phạm nghiêm trọng giá trị minh bạch. CEO lập tức chấm dứt hợp đồng thử việc thay vì cố gắng đào tạo lại, vì giá trị cốt lõi là thứ rất khó thay đổi ở người trưởng thành. Kết quả: Công ty mất một nguồn thu ngắn hạn nhưng bảo vệ được rủi ro pháp lý và uy tín dài hạn. Bài học là kỹ năng có thể học, nhưng lệch giá trị sẽ phá huỷ tổ chức từ bên trong.","ct_bien_the":"Mô hình ASA (Attraction-Selection-Attrition) của Schneider mô tả cách các tổ chức tự nhiên thu hút những người giống mình và đào thải những người khác biệt.","ct_gioi_han":"Việc đẩy sự đồng điệu giá trị lên mức cực đoan sẽ sinh ra hội chứng tư duy nhóm (groupthink), triệt tiêu sự đa dạng ý kiến và khả năng đổi mới. Cần phân định rạch ròi giữa việc chung nguyên tắc đạo đức với việc giống hệt nhau về chuyên môn và phong cách.","ct_sai_lam":"Đánh đồng sở thích cá nhân hoặc \"độ hợp cạ\" với giá trị cốt lõi || Đánh giá sự phù hợp qua những lời hứa hẹn thay vì hành vi trong quá khứ || Chỉ tuyển những người có chung điểm mạnh, dẫn đến nhóm bị mù chung một điểm yếu","ct_tu_kiem_tra":"Tại sao người càng xuất chúng mà lệch giá trị thì càng nguy hiểm? ⇒ Vì sức ảnh hưởng của họ lớn, sự sai lệch sẽ nhanh chóng phá vỡ hệ thống từ bên trong. || Làm sao để kiểm tra một giá trị có thực sự là cốt lõi không? ⇒ Đó là thứ bạn sẵn sàng từ chối tiền bạc hoặc lợi ích ngắn hạn để bảo vệ nó. || Sự khác biệt giữa đồng điệu giá trị và tư duy nhóm là gì? ⇒ Đồng điệu giá trị là chung nguyên tắc sống, còn tư duy nhóm là triệt tiêu tiếng nói phản biện.","ct_tai_lieu":"TL066"},{"id":"HN-NN-17","thu_tu":98,"tuan":5,"ngay":5,"nhom_hoc":"Nhìn người: nền tảng và lâu dài","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"hieu_nguoi","nhom":"Nhìn người – Lớp 3: Độ trung thành dài hạn","ten":"Lợi ích hai chiều","ten_goc":"Social exchange theory; Win–win","neu":"Hai bên phụ thuộc lẫn nhau về lợi ích và tương lai","thi":"Quan hệ hợp tác bền hơn quan hệ chỉ dựa tình cảm","vi_du":"Cam kết rõ: bạn lo kỹ thuật, tôi lo khách hàng, chia X% lợi nhuận.","gioi_han":"Chỉ dựa lợi ích thì đối thủ trả cao hơn là mất người; cần thêm niềm tin, ý nghĩa.","tu_khoa":"cùng có lợi, phụ thuộc lẫn nhau, cam kết","de_nham_voi":"HN-NN-16","chuoi_hoc":"Nhìn người: nền tảng và lâu dài","kieu_hoc":"chuoi","buoc":2,"truoc":"HN-NN-16","sau":"HN-NN-18","cap_doi":"HN-NN-16","khac_nhau":"Giá trị: cùng nguyên tắc sống; Lợi ích hai chiều: cùng được lợi","ct_nguon_goc":"Thuyết trao đổi xã hội (Social Exchange Theory) được George Homans (1958) phát triển, sau đó mở rộng bởi Peter Blau. Nó nhìn nhận mọi tương tác xã hội đều trải qua quá trình tính toán chi phí và phần thưởng. Tư duy \"Win-win\" (cùng có lợi) sau này được phổ cập rộng rãi trong thực tế quản trị thông qua lý thuyết đàm phán của Fisher và Ury (1981).","ct_co_che":"Con người bẩm sinh luôn tìm kiếm sự cân bằng và công bằng trong tương tác. Ngay khi cấu trúc lợi ích hai chiều được thiết lập và duy trì ổn định, sự phụ thuộc tương hỗ xuất hiện. Mỗi bên đều nhận được giá trị mình cần (tiền bạc, quyền lực, sự an toàn, cơ hội), từ đó tự động duy trì lòng tin và sự cam kết mà không cần tới những lời kêu gọi cảm xúc sáo rỗng hay sự ép buộc.","ct_bang_chung":"A – Có nền tảng vững chắc trong xã hội học, tâm lý học tiến hoá và lý thuyết trò chơi, chứng minh rằng sự hợp tác dài hạn chỉ tồn tại khi lợi ích được phân phối cân bằng.","ct_quy_trinh":"Xác định chính xác giá trị mong đợi lớn nhất của mình và của đối phương || Bỏ qua các cam kết tình cảm mơ hồ, tập trung vào những điều kiện có thể đo lường || Thiết lập cơ chế bù trừ công bằng (ví dụ: lương thấp bù bằng cổ phần) || Chốt thoả thuận minh bạch: chỉ rõ vai trò, nghĩa vụ và công thức chia sẻ phần thưởng || Rà soát và đàm phán lại khi bối cảnh thay đổi làm lệch cán cân lợi ích","ct_vi_du_mau":"Tình huống: Một startup công nghệ cần mời chuyên gia kỹ thuật cấp cao về làm Co-founder nhưng ngân sách eo hẹp, không thể trả mức lương thị trường 60 triệu/tháng. Áp dụng: Thay vì dùng lý tưởng \"thay đổi thế giới\" để ép lương, Founder chọn cách sòng phẳng. Hai bên ký cam kết rõ ràng: chuyên gia nhận lương 30 triệu, đổi lại được vesting 15% cổ phần theo tiến độ sản phẩm trong 3 năm và toàn quyền quyết định mảng công nghệ. Kết quả: Sau 2 năm, chuyên gia này từ chối các lời mời lương cao vì quyền lợi và sự nghiệp bị ràng buộc chặt chẽ ở công ty hiện tại. Bài học: Nhiệt huyết có thể cạn kiệt, nhưng một cấu trúc lợi ích công bằng, rõ ràng sẽ giữ chân người tài vững chắc nhất.","ct_bien_the":"Khái niệm phụ thuộc tương hỗ (Mutual Dependence) giải thích quyền lực trong tổ chức. Trong lý thuyết trò chơi, đây là dạng trò chơi có tổng khác không (Non-zero-sum game).","ct_gioi_han":"Nếu chỉ duy trì mối quan hệ thuần tuý qua lăng kính giao dịch lạnh lùng, tổ chức sẽ thiếu đi tính gắn kết nhân văn; khi đối thủ đưa ra lợi ích vật chất cao hơn, nhân tài lập tức rời đi. Sự cân bằng lợi ích phải được xây dựng cùng với niềm tin và ý nghĩa.","ct_sai_lam":"Ép đối tác chịu thiệt để tối đa hoá lợi ích cá nhân ngắn hạn || Dùng cụm từ \"anh em một nhà\" để che đậy sự bóc lột về mặt vật chất || Không thoả thuận rõ ràng về lợi ích ngay từ đầu vì tâm lý e ngại sự thực dụng","ct_tu_kiem_tra":"Tại sao bàn bạc sòng phẳng về lợi ích từ đầu lại bảo vệ mối quan hệ? ⇒ Vì nó triệt tiêu các kỳ vọng ngầm và ngăn chặn sự ấm ức trong tương lai. || Lợi ích hai chiều có đồng nghĩa với tiền bạc không? ⇒ Không, lợi ích có thể bao gồm cơ hội thăng tiến, sự an toàn, danh tiếng hoặc quyền tự chủ. || Yếu tố nào dễ làm vỡ cấu trúc win-win nhất? ⇒ Sự thay đổi bối cảnh khiến cán cân giá trị bị lệch mà hai bên không ngồi lại để tái đàm phán.","ct_tai_lieu":"TL097,TL098,TL132"},{"id":"HN-NN-18","thu_tu":99,"tuan":5,"ngay":5,"nhom_hoc":"Nhìn người: nền tảng và lâu dài","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"hieu_nguoi","nhom":"Nhìn người – Lớp 3: Độ trung thành dài hạn","ten":"Hiểu nhu cầu hiện tại","ten_goc":"Need theory – Maslow, McClelland","neu":"Biết động lực lớn nhất lúc này của họ (tiền, danh, trải nghiệm, an toàn)","thi":"Biết cách thu hút đúng và đề phòng đối thủ dùng chính nhu cầu đó để lôi kéo","vi_du":"Nhân viên cần tiền mua nhà → tạo cơ hội kiếm thêm chính đáng từ dự án.","gioi_han":"Nhu cầu thay đổi theo giai đoạn đời; hỏi lại định kỳ thay vì đoán.","tu_khoa":"nhu cầu, động lực, tiền, an toàn","chuoi_hoc":"Nhìn người: nền tảng và lâu dài","kieu_hoc":"chuoi","buoc":3,"truoc":"HN-NN-17","sau":"HN-NN-19","ct_nguon_goc":"Dựa trên Thuyết nhu cầu (Hierarchy of Needs) nổi tiếng của Abraham Maslow (1943), phân loại nhu cầu con người từ sinh tồn đến tự thể hiện. Sau đó, David McClelland (1961) bổ sung Thuyết ba nhu cầu (Thành tựu, Quyền lực, Hòa nhập). Cả hai lý thuyết định hình cách thức động viên nhân sự hiện đại: không có một phần thưởng nào làm hài lòng tất cả mọi người ở mọi thời điểm.","ct_co_che":"Động lực của con người không đứng yên mà liên tục dịch chuyển theo từng giai đoạn cuộc đời và hoàn cảnh thực tế. Một người vừa lập gia đình, mang nợ mua nhà sẽ bị chi phối mạnh bởi nhu cầu an toàn tài chính. Nếu quản lý lại mang \"tầm nhìn vĩ đại, cơ hội cống hiến\" ra để giữ chân họ, sự kết nối sẽ hoàn toàn đứt gãy. Khi bắt đúng huyệt nhu cầu hiện tại, tổ chức tối ưu hóa được nguồn lực phần thưởng, đồng thời phong tỏa được nguy cơ đối thủ dùng chính nhu cầu đang khuyết đó để lôi kéo nhân tài.","ct_bang_chung":"A – Các nghiên cứu về hành vi tổ chức và động lực làm việc chứng minh rõ sự đa dạng và tính thời điểm của nhu cầu; phần thưởng chỉ có giá trị khi nó đáp ứng đúng sự thiếu hụt hiện tại.","ct_quy_trinh":"Lắng nghe chủ động qua các cuộc trò chuyện thân mật (1-on-1) để nắm bắt thay đổi trong đời sống cá nhân của họ || Chẩn đoán xem động lực lớn nhất lúc này của họ là tiền bạc, danh tiếng, an toàn, hay sự cân bằng || Thiết kế gói công việc và phần thưởng linh hoạt đánh trúng nhu cầu đó || Thường xuyên cập nhật và đánh giá lại nhu cầu mỗi 6-12 tháng || Đề phòng sớm các đối thủ có thể khoét vào những nhu cầu mà công ty chưa đáp ứng được","ct_vi_du_mau":"Tình huống: Trưởng phòng Thiết kế là một nhân tài gắn bó 3 năm, lương cao. Gần đây, cô có con nhỏ và thường xuyên phải xin về sớm đón con, vẻ mặt rất căng thẳng và hiệu suất đi xuống. Áp dụng: Giám đốc nhân sự trò chuyện riêng và nhận ra nhu cầu hiện tại của cô không còn là thăng tiến như trước, mà đã chuyển sang nhu cầu cân bằng công việc gia đình và sự linh hoạt thời gian. Nếu giám đốc cố giữ cô bằng cách đề bạt lên chức Giám đốc Sáng tạo kèm ép làm thêm giờ, cô sẽ nghỉ việc. Thay vào đó, công ty đề xuất cô vẫn giữ chức cũ nhưng chuyển sang chế độ làm việc từ xa (remote) 3 ngày/tuần. Kết quả: Đánh trúng nhu cầu thiết thực, nhân viên giải tỏa được áp lực gia đình, năng suất phục hồi nhanh chóng và cô hoàn toàn trung thành với công ty vì biết hiếm nơi nào đáp ứng linh hoạt như vậy.","ct_bien_the":"Thuyết ERG của Alderfer (Tồn tại, Quan hệ, Phát triển); Thuyết hai yếu tố của Herzberg.","ct_gioi_han":"Khó áp dụng ở các tổ chức có quy chế lương thưởng quá cứng nhắc, cào bằng. Việc chạy theo đáp ứng nhu cầu cá nhân quá mức có thể tạo ra cảm giác bất công, thiên vị cho những nhân viên khác trong cùng tập thể.","ct_sai_lam":"Lấy nhu cầu của chính mình áp đặt làm nhu cầu của nhân viên (sếp khát tiền nên nghĩ ai cũng vậy) || Nghĩ rằng nhu cầu của một người là cố định vĩnh viễn không thay đổi theo thời gian || Trao những phần thưởng đắt đỏ (vé du lịch) cho người đang cần tiền mặt khẩn cấp","ct_tu_kiem_tra":"Vì sao tăng lương không phải lúc nào cũng giữ chân được nhân sự giỏi? ⇒ Vì nếu nhu cầu bức thiết của họ lúc đó là thời gian cho gia đình, tiền bạc sẽ mất đi sức hấp dẫn. || Làm sao để biết nhu cầu thực tại của một người đã thay đổi? ⇒ Quan sát những bước ngoặt trong đời sống cá nhân của họ (như kết hôn, sinh con, ốm đau) thông qua giao tiếp định kỳ. || Rủi ro của việc lãnh đạo lấy động lực của mình áp đặt cho cấp dưới là gì? ⇒ Đưa ra phần thưởng sai lệch, tốn kém mà không tạo được sự gắn kết thực sự.","ct_tai_lieu":"TL039,TL040,TL041"},{"id":"HN-NN-19","thu_tu":100,"tuan":5,"ngay":5,"nhom_hoc":"Nhìn người: nền tảng và lâu dài","uu_tien":11,"muc_uu_tien":"B – quan trọng","loai":"hieu_nguoi","nhom":"Nhìn người – Lớp 3: Độ trung thành dài hạn","ten":"Nhất quán theo thời gian","ten_goc":"Consistency over time; nguyên tắc tổng hợp quan sát","neu":"Quan sát một người đủ lâu (6–12 tháng) qua nhiều tình huống","thi":"Diễn kịch bị bào mòn, tính cách thật hiện ra","vi_du":"Chăm chỉ tháng đầu có thể là thử việc; giữ được qua một năm khó khăn mới là thật.","gioi_han":"Con người cũng thay đổi thật; đánh giá lại định kỳ.","tu_khoa":"thời gian dài, nhất quán, bản chất thật","de_nham_voi":"HN-NN-08","chuoi_hoc":"Nhìn người: nền tảng và lâu dài","kieu_hoc":"chuoi","buoc":4,"truoc":"HN-NN-18","sau":"HN-NN-05","cap_doi":"HN-NN-08","khac_nhau":"Hứa – làm: đếm lời hứa giữ được; Nhất quán thời gian: quan sát đủ lâu","ct_nguon_goc":"Bắt nguồn từ tâm lý học nhân cách, nơi các nét tính cách (trait) được định nghĩa là sự ổn định qua thời gian (Costa & McCrae, 1987). Trong tâm lý học đánh giá, nguyên tắc tổng hợp hành vi (aggregation principle) của Seymour Epstein chỉ ra rằng dù hành vi đơn lẻ trong ngắn hạn rất khó dự đoán, nhưng trung bình các hành vi trải dài theo thời gian sẽ phơi bày chính xác bản chất thực sự của một người.","ct_co_che":"Trong ngắn hạn, con người có dư thừa năng lượng nhận thức để đóng kịch (impression management), tạo ra một vỏ bọc hoàn hảo nhằm đạt mục đích (qua thử việc). Tuy nhiên, vỏ bọc này tốn rất nhiều năng lượng để duy trì. Khi đối mặt với áp lực liên tục, khủng hoảng, hoặc các tình huống bất ngờ không có kịch bản, lớp nguỵ trang sụp đổ. Lúc này, Hệ thống 1 (tư duy tự động) phải tiếp quản, để lộ ra phản xạ tự nhiên và thói quen cốt lõi.","ct_bang_chung":"A – Nguyên tắc tổng hợp hành vi và các nghiên cứu dọc (longitudinal studies) cung cấp bằng chứng toán học vững chắc cho thấy trung bình cộng của nhiều điểm dữ liệu theo thời gian sẽ loại bỏ được sai số do hoàn cảnh.","ct_quy_trinh":"Xác định các tham số tính cách cốt lõi cần đánh giá || Quan sát và ghi nhận trạng thái cơ sở của họ trong thời gian đầu (giai đoạn trăng mật) || Chú ý cao độ vào phản ứng của họ trong các tình huống áp lực, xung đột, hoặc khi không có giám sát || Loại bỏ các đánh giá cục bộ dựa trên một vài biến cố đơn lẻ || So sánh dữ liệu ở thời điểm 6 tháng với hồ sơ ban đầu để chốt kết luận","ct_vi_du_mau":"Tình huống: Tìm người kế nhiệm vị trí Trưởng nhóm. Ứng viên tên Tuấn biểu hiện xuất sắc, luôn chủ động làm trễ trong 2 tháng đầu thử việc và hứa hẹn sẽ vực dậy nhóm. Áp dụng: Quản lý không vội thăng chức mà kéo dài thời gian quan sát thêm 6 tháng. Ở tháng thứ 4, dự án gặp khủng hoảng. Thay vì chủ động giải quyết như đã hứa, Tuấn bắt đầu đi trễ, đùn đẩy trách nhiệm và đổ lỗi cho nhân viên khác. Khi sếp vắng mặt, Tuấn làm việc rất hời hợt. Kết quả: Dữ liệu tổng hợp 6 tháng cho thấy năng lượng đóng kịch của Tuấn đã cạn kiệt, bộc lộ tính né tránh trách nhiệm. Quản lý tránh được một quyết định bổ nhiệm sai lầm. Bài học: Ấn tượng ban đầu chỉ là dữ liệu nhiễu; thời gian dài mới là thước đo chính xác bản chất thật.","ct_bien_the":"Khái niệm độ tin cậy (Reliability) trong trắc nghiệm tâm lý học: một bài test tốt phải cho ra kết quả tương đồng khi đo lường cùng một người ở nhiều thời điểm khác nhau.","ct_gioi_han":"Cần phân biệt thật kỹ giữa việc lộ bản chất thật và tình trạng kiệt sức (burnout) do môi trường làm việc độc hại. Một hệ thống vắt kiệt nhân sự sẽ làm thay đổi hành vi theo hướng tiêu cực, đó là phản xạ sinh tồn chứ không phải do bản chất kém cỏi.","ct_sai_lam":"Kết luận ngay về bản chất của một người chỉ qua vài tuần tiếp xúc ban đầu || Đánh đồng một phản ứng tệ hại lúc hoảng loạn thành tính cách vĩnh viễn || Quên việc phải đánh giá lại định kỳ vì quá tin tưởng vào thiện cảm ban đầu","ct_tu_kiem_tra":"Vì sao những quan sát ngắn hạn thường thiếu chính xác? ⇒ Vì con người có khả năng dùng năng lượng nhận thức để duy trì vỏ bọc hoàn hảo nhằm đạt mục đích ngắn hạn. || Ý nghĩa của nguyên tắc tổng hợp hành vi là gì? ⇒ Việc lấy trung bình nhiều hành vi qua một thời gian dài sẽ triệt tiêu các sai số do hoàn cảnh tạm thời gây ra. || Làm thế nào phân biệt một người bộc lộ bản chất và một người bị kiệt sức? ⇒ Lộ bản chất là trở về với các thói quen xấu đã có từ trước; kiệt sức là sự suy sụp năng lượng và động lực do tác động từ môi trường làm việc.","ct_tai_lieu":"TL079,TL001"},{"id":"CH-DK-01","thu_tu":101,"tuan":6,"ngay":1,"nhom_hoc":"Điều khiển nhóm","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"chuoi","nhom":"Chuỗi điều khiển nhóm","ten":"Chuẩn mực nhóm","ten_goc":"Normative social influence – Deutsch & Gerard (1955)","neu":"Có quy tắc","thi":"cả nhóm theo","chuoi":"Có quy tắc → nhiều người làm → thành chuẩn → cả nhóm theo","vi_du":"Văn phòng ai cũng tắt đèn khi về → người mới cũng làm.","gioi_han":"Chuẩn xấu cũng lan như chuẩn tốt.","tu_khoa":"Có quy tắc, nhiều người làm, thành chuẩn, cả nhóm theo","chuoi_hoc":"Điều khiển nhóm","kieu_hoc":"chuoi","buoc":1,"sau":"CH-DK-02","ct_nguon_goc":"Bắt nguồn từ nghiên cứu kinh điển của Solomon Asch (1951) về áp lực nhóm, sau đó được Morton Deutsch và Harold Gerard (1955) định hình thành khái niệm \"ảnh hưởng xã hội chuẩn mực\" (normative social influence). Khác với ảnh hưởng thông tin (làm theo vì nghĩ người khác có thông tin đúng), ảnh hưởng chuẩn mực xảy ra khi ta tuân thủ nhóm để được chấp nhận hoặc tránh bị cô lập, dù trong lòng có thể không đồng tình.","ct_co_che":"Nhu cầu thuộc về (need to belong) là một động lực tiến hoá cốt lõi. Não bộ xem việc bị nhóm loại trừ là một mối đe doạ sinh tồn ngang với đau đớn thể xác. Khi nhận thấy một quy tắc ngầm hay hành vi phổ biến, cơ chế tự bảo vệ kích hoạt, thôi thúc ta điều chỉnh hành vi cho giống số đông để duy trì sự hoà hợp. Ta thà sai cùng nhóm còn hơn đúng nhưng bị tẩy chay.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Thí nghiệm của Asch và các biến thể sau này trên nhiều nền văn hoá đều chứng minh con người sẵn sàng từ bỏ phán đoán cá nhân để tuân theo áp lực chuẩn mực của nhóm.","ct_quy_trinh":"Quan sát hành vi lặp lại của đa số thành viên trong nhóm || Xác định xem có ai bị nhắc nhở hoặc cô lập khi làm khác đi không || Đánh giá xem quy tắc ngầm này phục vụ lợi ích chung hay chỉ là thói quen xấu || Quyết định tuân thủ nếu vô hại, hoặc tìm đồng minh nếu cần thay đổi || Đề xuất chuẩn mực mới bằng cách làm gương với nhóm nhỏ thay vì chỉ trích đám đông","ct_vi_du_mau":"Tình huống: Tại một công ty, chuẩn mực ngầm là mọi người đều ở lại làm việc đến 7 giờ tối dù giờ chính thức là 5:30. Một nhân viên mới thấy vậy nên cũng nán lại. Cô nhận ra những ai về đúng giờ thường bị trêu chọc là \"thiếu nhiệt huyết\". Dù việc đã xong, cô vẫn ngồi lướt web để không bị đánh giá. Sau một thời gian mệt mỏi, cô tìm hiểu và biết vài đồng nghiệp khác cũng muốn về sớm. Họ rủ nhau làm xong việc thì đứng lên về đúng giờ cùng lúc. Khi có một nhóm nhỏ phá vỡ chuẩn mực cũ, những người khác cũng tự tin đứng lên theo. Bài học: Chuẩn mực nhóm rất mạnh, nhưng có thể bị phá vỡ nếu có vài người tiên phong hành động cùng nhau thay vì chống lại một mình.","ct_bien_the":"Ảnh hưởng xã hội thông tin (informational social influence): hùa theo vì tin nhóm biết nhiều hơn mình. Hội chứng tư duy tập thể (groupthink) là biến thể cực đoan khi chuẩn mực đồng thuận lấn át hoàn toàn tư duy phản biện.","ct_gioi_han":"Hiệu ứng yếu đi rất nhiều nếu trong nhóm có dù chỉ một người dám lên tiếng phản đối. Chuẩn mực nhóm ít tác dụng với những cá nhân có quyền lực cao, chuyên môn vượt trội hoặc không có ý định gắn bó lâu dài với tổ chức đó.","ct_sai_lam":"Ép bản thân tuân theo các chuẩn mực độc hại (như nhậu nhẹt ép xác) chỉ để hoà nhập || Đánh đồng việc mọi người cùng làm với việc hành động đó là đúng đắn || Bỏ qua tiếng nói phản biện của bản thân vì sợ làm mất lòng tập thể","ct_phong_ve":"Nhận diện: Cảm thấy căng thẳng, phải làm trái với giá trị của mình chỉ vì \"ở đây ai cũng làm thế\", sợ bị cô lập nếu làm khác. Phòng vệ: Tự hỏi \"nếu mình làm khác đi thì hậu quả thực tế là gì, hay chỉ là cảm giác ngại ngùng?\". Tìm kiếm ít nhất một người đồng tình để phá vỡ áp lực đồng thuận tuyệt đối. Dùng chính danh: Lãnh đạo chủ động tạo ra các chuẩn mực tích cực (như đúng giờ, tôn trọng sự khác biệt) và khen ngợi công khai những người tuân thủ để kéo cả nhóm theo.","ct_tu_kiem_tra":"Vì sao người ta tuân theo chuẩn mực nhóm dù biết nó sai? ⇒ Vì nhu cầu được thuộc về và nỗi sợ bị cô lập lớn hơn mong muốn làm đúng. || Làm sao để phá vỡ một chuẩn mực nhóm tiêu cực? ⇒ Tìm ít nhất một đồng minh để cùng làm khác đi, phá vỡ sự đồng thuận tuyệt đối. || Chuẩn mực nhóm khác với tuân thủ mệnh lệnh ở điểm nào? ⇒ Tuân thủ mệnh lệnh là do quyền lực ép buộc, còn chuẩn mực là áp lực ngầm tự nguyện.","ct_tai_lieu":"TL104,TL105,TL059"},{"id":"CH-DK-02","thu_tu":102,"tuan":6,"ngay":1,"nhom_hoc":"Điều khiển nhóm","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"chuoi","nhom":"Chuỗi điều khiển nhóm","ten":"Theo số đông","ten_goc":"Social proof – Cialdini","neu":"Vài người làm","thi":"cả nhóm làm","chuoi":"Vài người làm → lan ra → cả nhóm làm","vi_du":"Vài người đăng ký khoá học → cả phòng đăng ký.","gioi_han":"Số đông có thể cùng sai (thác thông tin).","tu_khoa":"Vài người làm, lan ra, cả nhóm làm","de_nham_voi":"CH-LA-02","chuoi_hoc":"Điều khiển nhóm","kieu_hoc":"chuoi","buoc":2,"truoc":"CH-DK-01","sau":"CH-DK-03","cap_doi":"CH-LA-02","khac_nhau":"Lan truyền: số đông tự lan; Điều khiển nhóm: dùng số đông có chủ đích","ct_nguon_goc":"Được Robert Cialdini hệ thống hoá trong cuốn sách kinh điển Influence (1984) như một trong sáu nguyên tắc thuyết phục, lấy nền tảng từ tâm lý học tiến hoá. Khái niệm này ban đầu gọi là \"bằng chứng xã hội\" (social proof), nhấn mạnh việc dùng hành vi của số đông làm thước đo sự đúng đắn cho hành vi của mình trong hoàn cảnh thiếu chắc chắn.","ct_co_che":"Trong điều kiện thiếu thông tin, mơ hồ hoặc áp lực thời gian, não bộ sử dụng lối tắt nhận thức: \"nếu nhiều người đang làm thế, chắc chắn điều đó đúng hoặc có lợi\". Cơ chế này giúp tiết kiệm năng lượng ra quyết định. Càng có nhiều người thực hiện hành vi, và những người đó càng giống ta (tương đồng về hoàn cảnh, địa vị), lực kéo của hiệu ứng số đông càng mạnh mẽ.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Thực nghiệm của Cialdini về việc dùng thông báo \"đa số khách tái sử dụng khăn\" tại khách sạn đã làm tăng mạnh tỷ lệ tuân thủ so với thông điệp bảo vệ môi trường chung chung.","ct_quy_trinh":"Xác định hành vi bạn muốn người khác thực hiện || Thu thập dữ liệu thực tế cho thấy đã có một nhóm thực hiện hành vi này || Đóng khung thông điệp nhấn mạnh sự tương đồng giữa nhóm tiên phong và đối tượng mục tiêu || Lan truyền thông tin tự nhiên thay vì ra lệnh || Theo dõi và liên tục cập nhật con số người tham gia để tạo đà","ct_vi_du_mau":"Tình huống: Bộ phận nhân sự muốn khuyến khích nhân viên công ty công nghệ điền khảo sát độ hài lòng, nhưng mới có 20% tham gia. Trưởng phòng nhân sự ngừng gửi email nhắc nhở chung chung. Cô trích xuất dữ liệu và thấy phòng Kỹ thuật đã điền tới 70%. Cô gửi một thông báo mới: \"Đã có 70% anh em phòng Kỹ thuật hoàn thành khảo sát, các phòng ban khác hãy cùng bắt kịp nhé\". Lập tức, tỷ lệ tham gia của phòng Marketing và Sales tăng vọt vì họ bị kích thích bởi bằng chứng từ một nhóm tương đồng. Kết quả: Tỷ lệ toàn công ty đạt 85% chỉ sau hai ngày. Bài học: Thay vì ép buộc hay kêu gọi, việc chỉ ra \"những người giống bạn đang làm điều này\" mang lại sức thuyết phục tự nhiên và ít bị phản kháng hơn.","ct_bien_the":"Hiệu ứng bầy đàn (herd behavior) trong tài chính; Thác thông tin (informational cascade) khi người đi sau hoàn toàn bỏ qua thông tin riêng để nhắm mắt làm theo người đi trước.","ct_gioi_han":"Phản tác dụng nếu thông điệp nhấn mạnh rằng hành vi sai trái đang rất phổ biến (ví dụ: \"rất nhiều người vứt rác bừa bãi\" sẽ ngầm cho phép vứt rác). Hiệu ứng cũng thất bại nếu nhóm làm mẫu không có sự tương quan hay đáng tin cậy với người quan sát.","ct_sai_lam":"Nhấn mạnh việc hành vi xấu đang rất phổ biến khiến người ta nghĩ đó là chuẩn mực || Bịa đặt số liệu về sự tham gia của số đông, làm sụp đổ uy tín khi bị phát hiện || Áp dụng cho các quyết định đòi hỏi tính cá nhân hoá cao","ct_phong_ve":"Nhận diện: Nghe các cụm từ \"sản phẩm bán chạy nhất\", \"hàng triệu người tin dùng\", hoặc thấy dòng người xếp hàng vô lý và cảm thấy thôi thúc muốn mua theo. Phòng vệ: Chậm lại một nhịp, tự hỏi \"mình có thực sự cần cái này không, hay chỉ mua vì thấy người ta mua đông?\". Tách bạch giữa sự phổ biến của sản phẩm và chất lượng thực tế. Dùng chính danh: Dùng số liệu thật, minh bạch về phản hồi của khách hàng hoặc nhân viên để giúp người đi sau giảm bớt lo âu khi ra quyết định.","ct_tu_kiem_tra":"Bằng chứng xã hội hiệu quả nhất khi nào? ⇒ Khi tình huống có tính mơ hồ cao và nhóm làm mẫu có sự tương đồng với đối tượng mục tiêu. || Sai lầm lớn nhất khi dùng số đông để răn đe hành vi xấu là gì? ⇒ Nhấn mạnh hành vi xấu đang phổ biến, vô tình biến nó thành chuẩn mực được chấp nhận. || Làm sao để chống lại áp lực đám đông khi mua sắm? ⇒ Tách rời sự phổ biến ra khỏi nhu cầu thực tế và chất lượng cốt lõi của sản phẩm.","ct_tai_lieu":"TL089,TL124"},{"id":"CH-DK-03","thu_tu":103,"tuan":6,"ngay":1,"nhom_hoc":"Điều khiển nhóm","uu_tien":12,"muc_uu_tien":"A – cốt lõi","loai":"chuoi","nhom":"Chuỗi điều khiển nhóm","ten":"Lãnh đạo làm → nhóm theo","ten_goc":"Authority; Social learning – Bandura","neu":"Lãnh đạo làm","thi":"bắt chước","chuoi":"Lãnh đạo làm → nhóm thấy → bắt chước","vi_du":"Trưởng phòng đọc sách giờ nghỉ → nhóm lập góc đọc.","gioi_han":"Lãnh đạo làm sai thì nhóm cũng theo sai.","tu_khoa":"Lãnh đạo làm, nhóm thấy, bắt chước","chuoi_hoc":"Điều khiển nhóm","kieu_hoc":"chuoi","buoc":3,"truoc":"CH-DK-02","sau":"CH-DK-10","ct_nguon_goc":"Bắt nguồn từ Thuyết học tập xã hội (Social Learning Theory) của Albert Bandura (1977) chứng minh con người học qua quan sát người mẫu (modeling); kết hợp với nguyên tắc Uy quyền (Authority) của Cialdini (1984). Trong quản trị, điều này phát triển thành khái niệm \"dẫn dắt bằng làm gương\" (leading by example), khẳng định hành động thực tế của người đứng đầu định hình văn hoá mạnh hơn mệnh lệnh.","ct_co_che":"Não bộ đánh giá người có quyền lực là hình mẫu mang lại thông tin sinh tồn. Qua các tế bào thần kinh phản gương, ta vô thức mô phỏng họ. Quan trọng hơn, trong môi trường làm việc, nhân viên chú ý sát sao hành động của sếp để \"giải mã\" điều gì thực sự được thưởng và phạt, từ đó tự điều chỉnh hành vi cho an toàn, bất chấp các khẩu hiệu dán trên tường viết gì.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Thí nghiệm búp bê Bobo của Bandura minh chứng trẻ học hành vi hung hăng từ người lớn. Trong quản trị, tính toàn vẹn hành vi của lãnh đạo dự báo trực tiếp lòng tin và hành vi của nhân viên.","ct_quy_trinh":"Xác định một thói quen hoặc quy tắc mới muốn cả nhóm áp dụng || Lãnh đạo phải tự mình thực hiện trước một cách nhất quán || Đảm bảo mọi người nhìn thấy thực tế thực hành của lãnh đạo chứ không chỉ nghe hô hào || Khen ngợi ngay lập tức những cá nhân đầu tiên bắt chước || Lồng ghép hành vi đó vào hệ thống vận hành hàng ngày","ct_vi_du_mau":"Tình huống: Giám đốc muốn chuyển văn hoá họp từ \"báo cáo thành tích\" sang \"thẳng thắn nhận lỗi để sửa\". Dù đã ra quy định mới, các cuộc họp vẫn mang tính né tránh rủi ro. Tháng sau, giám đốc mở đầu bằng việc chiếu một quyết định sai lầm của chính mình khiến công ty mất một khách hàng lớn, phân tích nguyên nhân gốc và công khai nhận trách nhiệm. Giám đốc cảm ơn một nhân viên đã dám chỉ ra điểm mù đó. Bầu không khí lập tức thay đổi. Ngay trong buổi họp, hai trưởng phòng khác cũng tự nguyện báo cáo về các dự án đang chậm tiến độ mà họ giấu giếm lâu nay. Bài học: Lời nói định hướng kỳ vọng, nhưng chỉ có sự tổn thương và hành động làm gương thực tế của lãnh đạo mới cấp phép cho sự an toàn tâm lý lan toả xuống cấp dưới.","ct_bien_the":"Hiệu ứng hào quang (Halo effect) khiến lãnh đạo giỏi một mặt được bắt chước cả ở những mặt chưa giỏi; Quảng cáo dùng người nổi tiếng để kích hoạt hành vi mua hàng của fan hâm mộ.","ct_gioi_han":"Lãnh đạo \"nói một đằng làm một nẻo\" sẽ triệt tiêu lòng tin. Khi đó, nhóm sẽ học và bắt chước cái \"làm nẻo\", bỏ qua cái \"nói đằng\". Nếu lãnh đạo mất uy tín chuyên môn hoặc đạo đức, cơ chế bắt chước cũng biến mất.","ct_sai_lam":"Đặt ra quy định khắt khe nhưng lãnh đạo tự cho mình đặc quyền đứng ngoài || Diễn kịch làm gương qua loa, thiếu nhất quán khiến nhóm nhận ra sự giả tạo || Chờ đợi nhóm làm trước rồi lãnh đạo mới thực hiện","ct_phong_ve":"Nhận diện: Nhận thấy bản thân đang tiễm nhiễm một thói quen độc hại (ví dụ: thức khuya, cáu gắt, lấp liếm) chỉ vì \"sếp tôi cũng làm thế\". Phòng vệ: Tách bạch giữa năng lực chuyên môn và thói quen cá nhân của lãnh đạo. Nhắc nhở bản thân rằng thành công của họ đến từ yếu tố khác chứ không phải từ các thói quen xấu đó. Dùng chính danh: Người quản lý tự ý thức về \"cái bóng\" của mình (shadow of the leader), chủ động phơi bày sự dễ tổn thương và minh bạch trong việc sửa sai để kiến tạo văn hoá lành mạnh.","ct_tu_kiem_tra":"Khi lãnh đạo nói một đằng làm một nẻo, nhân viên sẽ học theo điều gì? ⇒ Nhân viên sẽ bắt chước hành động thực tế của lãnh đạo, phớt lờ lời nói. || Yếu tố nào quyết định việc nhóm có bắt chước lãnh đạo hay không? ⇒ Sự nhất quán trong hành động và quyền lực, uy tín thực tế của người làm gương. || Làm sao để lãnh đạo khuyến khích văn hoá nhận lỗi? ⇒ Tự mình công khai nhận lỗi và quy trình sửa sai trước mặt nhân viên.","ct_tai_lieu":"TL033,TL089,TL062"},{"id":"CH-DK-10","thu_tu":104,"tuan":6,"ngay":1,"nhom_hoc":"Điều khiển nhóm","uu_tien":10,"muc_uu_tien":"B – quan trọng","loai":"chuoi","nhom":"Chuỗi điều khiển nhóm","ten":"Áp lực ngang hàng","ten_goc":"Peer pressure; Peer accountability","neu":"Bạn nhắc nhau","thi":"duy trì","chuoi":"Bạn nhắc nhau → ngại làm khác → duy trì","vi_du":"Nhóm học nhắc nhau nộp bài đúng hạn.","gioi_han":"Áp lực ngang hàng cũng đẩy vào hành vi xấu.","tu_khoa":"Bạn nhắc nhau, ngại làm khác, duy trì","chuoi_hoc":"Điều khiển nhóm","kieu_hoc":"chuoi","buoc":4,"truoc":"CH-DK-03","sau":"CH-DK-06","ct_nguon_goc":"Khái niệm áp lực ngang hàng (peer pressure) bắt nguồn từ tâm lý học phát triển, ban đầu dùng để chỉ sức ép đồng trang lứa ở lứa tuổi thanh thiếu niên. Trong quản trị và khoa học hành vi hiện đại, nó được tái định khung thành \"trách nhiệm ngang hàng\" (peer accountability). Các nghiên cứu về tổ chức tự quản và làm việc nhóm chỉ ra rằng khi các thành viên cùng cấp bậc chủ động giám sát lẫn nhau, hiệu suất duy trì tốt hơn so với mô hình giám sát truyền thống từ trên xuống.","ct_co_che":"Tại sao đúng? Vì con người nhạy cảm với việc bị đồng nghiệp đánh giá hơn là sếp. Đánh giá từ sếp mang tính mệnh lệnh, nhưng sự đánh giá từ đồng nghiệp đe doạ trực tiếp vị thế xã hội hàng ngày của họ. Khi các thành viên trong nhóm thiết lập một thoả thuận chung và công khai tiến độ, cảm giác \"không muốn làm gánh nặng cho đội\" hoặc sợ mất mặt trước những người ngang hàng sẽ kích hoạt động lực tuân thủ mạnh mẽ, giúp duy trì hành vi một cách bền vững.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Các thực nghiệm về cam kết công khai và nhóm tự quản cho thấy áp lực từ người ngang hàng có tác dụng thúc đẩy việc hoàn thành mục tiêu mạnh hơn cả các phần thưởng tài chính nhỏ.","ct_quy_trinh":"Lập một nhóm nhỏ có cùng mục tiêu hoặc nhiệm vụ || Cùng thống nhất bộ quy tắc hoặc chuẩn mực hành vi rõ ràng || Thiết lập cơ chế cập nhật tiến độ công khai định kỳ (ví dụ: họp đứng mỗi sáng) || Quy định cách nhắc nhở nhẹ nhàng khi có người tụt lại || Đổi phiên người giám sát để không ai trở thành sếp giả","ct_vi_du_mau":"Tình huống: Phòng Sales thường xuyên nộp báo cáo tuần trễ hạn. Trưởng phòng ra quy định phạt tiền nhưng chỉ hiệu quả được hai tuần. Sau đó, anh đổi chiến thuật, yêu cầu 5 nhân viên Sales lập một nhóm chat riêng. Mỗi chiều thứ Sáu, ai làm xong báo cáo thì thả một biểu tượng hoàn thành vào nhóm. Nếu đến 5 giờ chiều ai chưa thả, những người còn lại sẽ réo tên để nhắc khéo. Không có hình phạt từ sếp, nhưng việc phải thấy 4 người kia đã xong mà mình chưa xong, cộng với việc bị chính đồng nghiệp thúc giục, tạo ra sự ngượng ngùng lớn. Kết quả: 100% nhân viên nộp báo cáo đúng hạn trong suốt 3 tháng liên tục mà sếp không cần nhắc một lời. Bài học: Giao quyền giám sát cho người ngang hàng hiệu quả hơn là dùng quyền lực từ trên ép xuống.","ct_bien_the":"Cam kết công khai (Public commitment); Đối tác giải trình (Accountability partner) áp dụng cho cặp đôi để hỗ trợ nhau hoàn thành mục tiêu cá nhân hoặc công việc.","ct_gioi_han":"Áp lực ngang hàng có thể chuyển thành bắt nạt chốn công sở (mobbing) nếu không có quy tắc tôn trọng. Nó cũng có thể duy trì những hành vi xấu (ví dụ: nhóm hùa nhau nói xấu sếp, che giấu lỗi lầm). Không hiệu quả nếu các thành viên không tôn trọng hoặc không có sự gắn kết xã hội với nhau.","ct_sai_lam":"Giao cho một người ngang hàng quyền phạt người khác, biến họ thành sếp tồi || Không có mục tiêu chung rõ ràng khiến việc nhắc nhở bị coi là lo chuyện bao đồng || Bỏ qua các xung đột cá nhân đang ngầm tồn tại trong nhóm || Để áp lực biến thành sự tẩy chay, cô lập người yếu kém","ct_phong_ve":"Nhận diện: Bị đồng nghiệp thúc ép tham gia vào các hoạt động bạn không muốn (như nói xấu, tụ tập quá đà) với lý do \"cả nhóm ai cũng vậy\". Phòng vệ: Tách bạch giữa yêu cầu công việc và các chuẩn mực tự phát của nhóm. Dùng sự từ chối nhã nhặn nhưng kiên quyết ngay từ lần đầu. Dùng chính danh: Chủ động rủ một đồng nghiệp đáng tin cậy làm \"đối tác giải trình\" để cùng nhau theo đuổi các mục tiêu tích cực, minh bạch hoá sự hỗ trợ.","ct_tu_kiem_tra":"Vì sao áp lực ngang hàng đôi khi hiệu quả hơn mệnh lệnh của sếp? ⇒ Vì nó đánh vào tâm lý sợ mất mặt và không muốn làm gánh nặng cho những người làm việc trực tiếp hàng ngày. || Áp lực ngang hàng thất bại khi nào? ⇒ Khi nhóm thiếu sự gắn kết, không tôn trọng nhau hoặc khi nó biến thành công cụ để bắt nạt. || Làm sao để việc nhắc nhở không gây thù hằn? ⇒ Biến việc cập nhật tiến độ thành cơ chế tự động, công khai toàn nhóm thay vì để một cá nhân soi mói cá nhân khác.","ct_tai_lieu":"TL104,TL027"},{"id":"CH-KT-001","thu_tu":105,"tuan":6,"ngay":2,"nhom_hoc":"Kinh tế: giá và thị trường","uu_tien":13,"muc_uu_tien":"A – cốt lõi","loai":"chuoi","nhom":"Chuỗi kinh tế – Cung-cầu vi mô","ten":"Tăng giá – giảm cầu","ten_goc":"Law of demand","neu":"Giá tăng","thi":"lượng cầu giảm","chuoi":"Giá tăng → người mua cân nhắc → mua ít đi → lượng cầu giảm","vi_du":"Xăng tăng giá → nhiều người đi xe buýt.","gioi_han":"Hàng thiết yếu cầu ít co giãn; hàng xa xỉ thể hiện đẳng cấp có thể ngược lại.","tu_khoa":"Giá tăng, người mua cân nhắc, mua ít đi, lượng cầu giảm","chuoi_hoc":"Kinh tế: giá và thị trường","kieu_hoc":"chuoi","buoc":1,"sau":"CH-KT-002","ct_nguon_goc":"Quy luật cầu (Law of demand) là nguyên lý nền tảng của kinh tế học vi mô, được các nhà kinh tế học cổ điển như Adam Smith (1776) nhắc đến và Alfred Marshall (1890) hệ thống hoá qua đồ thị cung – cầu. Nó mô tả mối quan hệ nghịch biến giữa giá cả và số lượng hàng hoá mà người tiêu dùng sẵn sàng và có khả năng mua trong một thời gian nhất định, với điều kiện các yếu tố khác không đổi.","ct_co_che":"Khi giá một mặt hàng tăng, hai cơ chế tâm lý và kinh tế sẽ kích hoạt. Thứ nhất là hiệu ứng thay thế: người mua cảm thấy mặt hàng này đắt hơn tương đối so với các lựa chọn khác, nên họ tìm sản phẩm rẻ hơn để thay thế. Thứ hai là hiệu ứng thu nhập: giá tăng làm giảm sức mua thực tế của ví tiền, khiến người tiêu dùng cảm thấy mình nghèo đi và buộc phải thắt chặt chi tiêu, mua ít số lượng hơn hoặc từ bỏ hoàn toàn.","ct_bang_chung":"A – Nhiều nghiên cứu lặp lại ủng hộ. Đây là quy luật kinh tế học cơ bản được kiểm chứng liên tục qua hàng thế kỷ trên dữ liệu thị trường thực tế của hầu hết mọi loại hàng hoá.","ct_quy_trinh":"Xác định mặt hàng định tăng giá và đo lường lượng bán hiện tại || Phân tích độ co giãn: xem khách có dễ dàng tìm được hàng thay thế không || Tính toán điểm hoà vốn: lượng khách giảm tối đa bao nhiêu thì tăng giá vẫn có lãi || Truyền thông trước về việc tăng giá kèm lý do hợp lý để giảm sốc tâm lý || Theo dõi lượng cầu trong 1-3 tháng đầu và chuẩn bị phương án khuyến mãi nhỏ nếu cầu tụt quá nhanh","ct_vi_du_mau":"Tình huống: Một quán phở gia truyền tại Hà Nội quyết định tăng giá bát phở từ 50.000đ lên 65.000đ do giá thịt bò nhập vào tăng mạnh. Trong tuần đầu tiên, lượng khách quen (sinh viên và nhân viên văn phòng) giảm đi trông thấy, từ 300 bát/ngày xuống còn 200 bát/ngày. Khách hàng cảm thấy mức giá mới không còn phù hợp với bữa ăn sáng thường ngày nên họ chuyển sang ăn bún chả hoặc xôi (hiệu ứng thay thế). Dù giá tăng, tổng doanh thu của quán lại giảm từ 15 triệu xuống 13 triệu/ngày. Kết quả: Chủ quán nhận ra phở bình dân có độ co giãn của cầu theo giá cao. Ông phải điều chỉnh lại: giữ bát 50.000đ nhưng bớt một chút thịt, đồng thời ra mắt bát đặc biệt 65.000đ. Khách hàng có quyền lựa chọn, lượng cầu bát 50.000đ phục hồi ngay lập tức.","ct_bien_the":"Nghịch lý Giffen (hàng thứ cấp mà giá tăng thì cầu lại tăng vì người nghèo không mua nổi hàng tốt hơn); Nghịch lý Veblen (hàng xa xỉ giá càng cao càng bán chạy vì tạo đẳng cấp).","ct_gioi_han":"Chỉ đúng khi các yếu tố khác không đổi (ceteris paribus). Nếu giá tăng đồng thời với việc chất lượng tăng vọt, hoặc thu nhập người mua tăng mạnh, lượng cầu có thể không giảm. Hàng thiết yếu (như điện, nước sinh hoạt) ít bị giảm cầu khi tăng giá. Hàng xa xỉ có tính chất định vị đẳng cấp cũng không tuân theo quy luật này.","ct_sai_lam":"Bỏ qua việc đánh giá độ co giãn của cầu trước khi quyết định tăng giá || Tăng giá đột ngột mà không nâng cấp bất kỳ dịch vụ hay bao bì nào || Cho rằng khách quen sẽ luôn trung thành bất chấp giá cả thay đổi || Quên tính đến các động thái phản đòn của đối thủ cạnh tranh trực tiếp","ct_tu_kiem_tra":"Hai hiệu ứng nào giải thích việc tăng giá làm giảm lượng cầu? ⇒ Hiệu ứng thay thế (tìm hàng khác) và hiệu ứng thu nhập (sức mua thực tế giảm). || Vì sao giá xăng tăng nhưng người ta không giảm mua xăng đáng kể? ⇒ Vì xăng là hàng thiết yếu, khó tìm hàng thay thế ngay lập tức (cầu ít co giãn). || Khi nào tăng giá mà cầu không giảm? ⇒ Khi thu nhập của người tiêu dùng đang tăng mạnh hoặc đó là hàng xa xỉ định vị đẳng cấp.","ct_tai_lieu":"TL155,TL170","ct_ghi_chu":"Cần lưu ý phân biệt giữa thay đổi lượng cầu (trượt dọc trên đường cầu do giá) và thay đổi cầu (dịch chuyển đường cầu do yếu tố khác như thu nhập, thị hiếu)."},{"id":"CH-KT-002","thu_tu":106,"tuan":6,"ngay":2,"nhom_hoc":"Kinh tế: giá và thị trường","uu_tien
